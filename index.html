 cho ta nói chuyện riêng một lát. À thôi, vú cứ ở đây mà nghe câu chuyện”<\/em>.<\/p>\n<p>Tuy nhiên, sau cái chết của Tybalt, suy nghĩ và hành động của Capulet đã có sự thay đổi, ông đã đưa ra một quyết định sai lầm khi tự gả con gái mình cho Bá tước Paris - người mà Juliet không hề có một chút tình cảm nào. Mặc cho Juliet khóc lóc cầu xin: <em>“con quỳ lạy cha, xin cha nghe con”<\/em>. Trước sự từ chối của con, Capulet đã thể hiện sự tức giận ông cho rằng họ đang ban cho con gái mình một điều quý giá và không thể tin cô từ chối, thậm chí sau đó Capulet và còn dùng những từ ngữ thô tục dành cho con mình <em>“đồ đĩ dại, đồ bất hiếu dám cưỡng lại lời cha…. đồ chết giẫm”<\/em>. Ông còn thẳng thắn từ bỏ con gái của mình nếu nàng không chịu kết hôn với người mà ông đã chọn: <em>“Một là mi là con ta, và ta đặt đâu ngồi đây; hai là mi không còn là con ta nữa, và mi xéo đi đâu thì xéo”<\/em>. Đến Capulet phu nhân cũng không đứng về sự tự do của con mà bà còn ủng hộ quyết định của chồng mình: <em>“Cô cứ ý cô mà làm, giữa cô với tôi từ nay là hết”<\/em>.<\/p>\n<p>Gia đình Capulet đã dồn Juliet đến bước đường cùng là nghĩ tới cái chết. Sau đó cô đã xin và dưới sự giúp đỡ của tu sĩ Lawrence, cô đã giả chết. Tuy thoát được khỏi một đám cưới sắp đặt nhưng cô lại chịu đựng một nỗi đau khủng khiếp là người mình yêu đã chết. Như vậy, cha mẹ Juliet không những góp phần vào cái chết giả về mặt thể xác của cô mà còn gián tiếp đẩy cô vào cái chết thật đầy đau đớn.<\/p>\n<p><em><strong>* Tybalt<\/strong><\/em><\/p>\n<p>Tybalt - cháu Capulet phu nhân, anh chính là nhân vật được xuất hiện nhiều nhất trong những vụ ẩu đả giữa hai gia đình, và hơn hết anh còn là một trong những người thể hiện rõ nhất sự căm ghét dành cho dòng họ Montague. Ngay trong buổi dạ yến nhà Capulet, khi nhận ra Romeo, anh đã vô cùng giận dữ và nói với Capulet. Dù bị Capulet ngăn cản: <em>“Anh phải để cho nó yên”<\/em> nhưng Tybalt chỉ nhẫn nại, chịu đựng trong lúc đó và quyết tâm trả thù<em>: “Việc thằng khốn này vác mặt đến đây, đêm nay tưởng là thú vị, nhưng rồi sẽ đưa đến những hậu quả chu cay”.<\/em><\/p>\n<p>Với tính cách xốc nổi, hung hãn như vậy, chắc chắn những gì Tybalt ghim trong đầu sẽ có ngày anh ta hành động. Và đúng như dự đoán, khi gặp bạn của Romeo là Mercutio và Benvolio, anh ta đã gây sự, khi Romeo đến thì anh ta đã sỉ nhục Romeo là <em>“một thằng khốn nạn”<\/em>. Dù rằng Romeo đã nhẫn nhịn, dùng những lời lẽ để xoa dịu bởi hơn ai hết anh hiểu rằng Tybalt chính là anh họ của Juliet thì Tybalt vẫn không ngớt buông những lời nhục mạ. Không chấp nhận nhìn bạn mình như vậy Mercutio đã rút kiếm và đánh nhau với Tybalt và bị tử thương. Thấy bạn vì mình mà bị Tybalt giết chết, Romeo đã không thể tiếp tục nhụt chí khí rắn như thép của mình mà ra tay khiến Tybalt tử thương. Từ đây, lại gây ra thêm một rào cản, bi kịch nữa ngăn cách tình yêu của Romeo và Juliet. Những suy nghĩ và hành động sẵn sàng giao tranh như của Tybalt là một trong những lí do mà mỗi thù Capulet và Montague cứ mãi tiếp diễn.<\/p>\n<p><em><strong>* Mercutio<\/strong><\/em><\/p>\n<p>Cũng giống như Tybalt, bạn của Romeo - Mercutio cũng là người có tính cách nóng vội, hiếu thắng. Vì không thể kiềm chế được khi thấy bạn mình bị Tybalt nói xỉa, anh đã nhanh chóng rút kiếm ra để đấu với Tybalt: <em>“tôi chỉ xin ông một trong số chín vía của ông thôi. Tôi hãy tạm xơi một vía, còn tuỳ thái độ ông sau này đối với tôi thế nào tôi sẽ tha…”<\/em>. Vụ đánh nhau đã khiến anh và cả Tybalt đều chết, và vô tình đẩy Romeo và vào tình thế có tội và phải chịu án tù đày, khiến cho Romeo và Juliet chưa kịp tận hưởng giây phút đẹp đẽ bên nhau sau hôn lễ đã phải chia xa.<\/p>\n<p>Cái chết của Mercutio là sự khởi đầu cho một phản ứng dây chuyền vì sau đó Romeo giết Tybalt để trả thù cho Mercutio, và bị Vương chủ trục xuất khỏi Verona. Nếu không có Mercutio, số phận của Romeo và Juliet có lẽ sẽ không đến mức bi thảm như vậy. Cái chết của Mercutio chỉ là khởi đầu cho bi kịch trong vở kịch.<\/p>\n<p><em><strong>* Benvolio<\/strong><\/em><\/p>\n<p>Là một trong những người bạn của Romeo nhưng trái ngược với Mercutio, Benvolio lại là người điềm tĩnh hơn. Trong vụ xô xát giữa Mercutio và Tybalt, anh cũng là người cùng với Romeo rút kiếm ra ngăn cản. Tuy nhiên, nhân vật này cũng góp phần vào bi kịch của Romeo và Juliet. Khi thấy Romeo luôn chìm đắm trong đau khổ bởi tình yêu dành cho Rosaline nhưng lại không được đáp trả, anh đã rủ Romeo tới buổi dạ tiệc nhà Capulet để biết đâu, ở đó anh sẽ gặp được một người con gái khác đẹp hơn, khiến anh có thể quên đi tình cảm dành cho Rosaline: <em>“Đến buổi dạ yến này, tôi sẽ chỉ cho anh một trang tuyệt thế giai nhân để anh bắc lên hai cái đĩa cân pha lê kia mà so thì anh sẽ thấy người mà giờ đây tưởng là đẹp nhất thật ra chẳng đẹp là bao”<\/em>. Romeo cuối cùng cũng đồng ý và chính tại buổi dạ tiệc nhà Capulet, Romeo và Juliet đã trúng phải tiếng sét ái tình ngay từ ánh nhìn đầu tiên.<\/p>\n<p>Như vậy, chính Benvolio là người đã rủ Romeo đến buổi dạ hội nhà Capulet mà dẫn đến việc gặp gỡ giữa Romeo và Juliet.Nếu không có việc này xảy ra, có lẽ hai người họ đã không có cơ hội gặp nhau mà tạo nên một tình yêu đầy ngang trái này.<\/p>\n<p><em>* <strong>Nhũ mẫu<\/strong><\/em><\/p>\n<p>Chúng ta có thể xem nhũ mẫu chính là người mẹ thứ hai của Juliet. Bởi vì ngoại trừ việc sinh cô bé ra thì từ nhỏ đến lớn, người luôn ở bên quan tâm, chăm sóc và hiểu Juliet nhất chính là nhũ mẫu. Người có thể quên bất cứ thứ gì nhưng tất cả những sự kiện, những kỉ niệm từ thuở thơ ấu của Juliet, người nhớ như in trong đầu như: cô sinh vào đêm hôm trước ngày Hội Mùa, ngày cô bé chập chững biết đi đã bị ngã bươu cả trán… Trong bi kịch tình yêu của Romeo và Juliet, nhũ mẫu cũng có là một trong những người tác động vào bi kịch ấy khi bà khuyên Juliet đi tìm tình yêu. <em>“đi đi em. Đi tìm lấy những đêm vui để thêm vào chuỗi ngày vui của em”<\/em>. Khi biết Romeo chính là người mà<\/p>\n<p>Juliet yêu, bà đã không ngăn cản mà còn trở thành người đưa truyền thông tin giúp cho cặp đôi này.<\/p>\n<p>Nhũ mẫu cũng là một trong những người có ảnh hưởng nhất định tới bi kịch của tình yêu của Romeo và Juliet. Việc giúp cho Romeo và Juliet đã cho thấy bà ủng hộ tình yêu thầm kín ấy mặc dù bà biết đó là mối duyên, cuộc hôn lễ chưa có sự cho phép của gia đình, ngược lại với mối quan hệ của hai dòng họ Montague và Capulet.<\/p>\n<p><em>*<strong>Vương chủ thành Verona<\/strong><\/em><\/p>\n<p>Tuy là nhân vật ít xuất hiện nhất trong tác phẩm nhưng cũng có những ảnh hưởng nhất định tới bi kịch tình yêu của Romeo và Juliet. trong thành Verona có nhiều dòng họ nhưng chỉ có hai dòng họ Montague và Capulet là cái mối thù hận từ rất lâu đời. Là một người đứng đầu, nắm quyền lực cao nhất nhưng Vương chủ lại không quản lí tốt trật tự xã hội, đưa ra những hình phải không triệt để, giải quyết dứt điểm cho mối hận thù hai họ. Chính vì điều này nên mới xảy ra những cuộc gây gổ, tranh cãi trên đường phố của các gia nhân, cuộc đánh nhau giữa Tybalt với Romeo và bạn của mình rồi kéo theo hàng loạt hậu quả nghiêm trọng và hai nhân vật chính phải chết. Phải cho đến cuối vở kịch, khi cả Romeo và Juliet chết, ông mới nhận ra và hối hận trong muộn màng vì bản thân ông cũng đã<em>“đã nhắm mắt làm ngơ trước chuyện bất hoà giữa các ngươi, nên cũng thiệt mất hai người thân thích”<\/em>. Và cả tất cả mọi người đều đã bị trừng phạt, đó là mất con, mất đi người thân…<\/p>\n<p><em>2.1.3. Những chuẩn mực đạo đức trong xã hội<\/em><\/p>\n<p>Nếu như từ quan điểm tôn giáo thời đó xem xét, bi kịch tình yêu của Romeo và Juliet là định mệnh, họ đã bị Thượng đế trừng phạt vì <strong>đạo đức ô uế<\/strong>.<\/p>\n<p>Một trong những tội lỗi của Romeo là <strong>không kiềm chế dục vọng.<\/strong> Trước khi gặp Juliet, anh từng yêu say đắm Rosaline. Dù đây một tình yêu đơn phương nhưng nó khiến Romeo phải u sầu khổ não tới mức cha chàng từng phải thốt lên <em>“nhiều buổi sáng ta gặp nó ở đó, hạt lệ đầm đìa làm thêm ướt giọt sương”<\/em>. Nhưng khi vừa nhìn thấy Juliet, anh liền lập tức từ bỏ tình yêu trước đây của mình. Trong bộ phim, anh từng nói: Tình yêu trước đây là giả không phải thật, tối nay ta đã gặp được tuyệt thế giai nhân. Vì Juliet quá xinh đẹp, mỹ lệ, chàng Romeo đã quên ngay người con gái chàng từng ngày đêm mong nhớ trước kia. Cha Lawrence cũng có một nhận xét thấu đáo về điều này: <em>“Thật là sự thay đổi nhanh chóng! Không phải Rosaline thân yêu của con đột nhiên bị con bỏ rơi sao? Xem ra, tình yêu của những người trẻ tuổi thật kỳ lạ. Không chân thành, hóa ra là dựa vào đôi mắt…<\/em>”. Tội ác thứ hai của Romeo là anh đã <strong>giết Tybalt, anh họ của Juliet<\/strong> khiến cho mẫu thuẫn của hai dòng họ không những không hóa giải mà còn thêm sâu sắc.<\/p>\n<p>Về phần Juliet, lúc ấy nàng mới có <strong>13 tuổi đã theo đuổi tình yêu mù quáng<\/strong>. Khi biết rằng Romeo là người của dòng họ kẻ thù với gia đình mình, Juliet đã đến ban công và thốt lên: <em>“Khốn khổ thân tôi. Romeo? Sao chàng lại là Romeo? Hãy từ bỏ gia đình, hãy từ bỏ tên họ đi. Hoặc chàng hãy hứa yêu em, rồi em sẽ chẳng còn là người thuộc dòng họ Capiulet nữa”<\/em>. Như vậy chẳng phải mù quáng sao? Sẵn sàng từ bỏ gia đình để đi theo một “tình yêu chớp nhoáng”.<\/p>\n"], ["2.2. Nhân vật bi kịch: Romeo và Juliet - Kiểu con người thân phận", 4, "<p><em>2.2.1. Nhân vật bi kịch<\/em><\/p>\n<p>Nhân vật bi kịch còn được gọi là nhân vật anh hùng (heros), “là một con người quá khổ, ta muốn nhận biết nó thì phải đo bằng cái thước của nó, chứ không phải của ta”. Nhân vật bi kịch bao giờ cũng là những con người lương thiện, dũng cảm, cao thượng, đấu tranh vì mục đích tốt đẹp, vì lí tưởng cao quý, nhưng đồng thời cũng có những yếu đuối tiềm tàng trong nhân vật ấy và có khả năng đẩy nhân vật đến lỗi lầm. Nó, như Aristote quan niệm: Đó là những bi kịch diễn tả những con người sa vào tình trạng bất hạnh không phải vì sự xấu xa của người. Mà là vì một lỗi lầm nào đó, cái lỗi lầm mà Aristote gọi là lỗi lầm bi kịch. Như vậy, con người chỉ trở thành nhân vật bi kịch khi họ là một tính cách cao cả nhưng mắc một lỗi lầm nào đó có khả năng gây ra những hậu quả ghê gớm.<\/p>\n<p><em>2.2.2. Kiểu con người thân phận - Romeo và Juliet<\/em><\/p>\n<p>Nhân vật bi kịch trong Romeo và Juliet có thể được định danh là “kiểu người thân phận” - sản phẩm của hoàn cảnh xã hội, của điều kiện sống.<\/p>\n<p>“Kiểu người thân phận” trong bi kịch của Shakespare gắn với sự ra đời của chủ nghĩa hiện thực trong văn học thế giới mà ông được xem là người đặt nền móng. Đó là thời điểm mà theo B.Xuskov “con người nhận ra rằng–ban đầu có tính chất tự phát, sau đó thì tự giác– những hành động và tình cảm, cả bi kịch của con người không phải là hệ quả của những say mê hoặc ý đồ thần linh mà chúng bị quyết định bởi những nguyên nhân thực tại, hoặc nói đúng hơn, những nguyên nhân vật chất”. Vì thế, nếu số phận làm nên bi kịch cho con người ở thời cổ đại, thì <em><strong>hoàn cảnh sống, điều kiện sống<\/strong><\/em> lại đẩy con người đến những tấn bi kịch ở thời cận đại. B.Xuskov nhận xét: “Những xung đột bi kịch của những nhân vật của Shakespeare không có tính chất định mệnh và không mang tính tiền định phi lý: bao giờ chúng cũng bị quyết định bởi những nguyên nhân vật chất, trước hết là bản thân những điều kiện lịch sử cụ thể của cuộc sống”.<\/p>\n<p>Đầu tiên, chúng ta đang nói ở đây không chỉ về những trở ngại bên ngoài ngăn cản tình yêu của hai nhân vật Romeo và Juliet, mà về một thái độ cơ bản mới đối với tình yêu nảy sinh trong thời kỳ Phục hưng. Thời kỳ Phục hưng đang phấn đấu cho sự thống nhất của tình yêu và hôn nhân. Trong tất cả các bộ hài kịch của Shakespeare, sự hiểu biết của thời kỳ Phục hưng về tình yêu, vốn được đặt lên hàng đầu với hôn nhân được khẳng định. Romeo và Juliet cũng muốn như vậy. Bằng chứng tình yêu đầu tiên mà Juliet yêu cầu là Romeo đồng ý kết hôn ngay lập tức, và anh vui vẻ làm theo điều đó. Nhưng, như chúng ta biết, họ không được hưởng hạnh phúc thời Phục hưng đơn giản nhất trong mắt mọi người - một sự thừa nhận về tình yêu của họ và được đăng ký hợp pháp trong hôn nhân. Điều này mang lại sự nhạy cảm đặc biệt cho tình cảm của đôi trai gái, vốn luôn là kết quả của những trở ngại khiến những người yêu nhau không thể hạnh phúc trọn vẹn. Sự thù hận của các gia đình xâm chiếm thế giới cảm xúc của các nhân vật bi kịch.<\/p>\n<p>Như đã được phân tích ở trên, Romeo và Juliet là đôi trai gái được sinh ra từ hai gia tộc: Montague và Capulet có thù oán với nhau từ lâu đời.<\/p>\n<p>Hoàn cảnh sống - Mối bất hòa giữa hai gia đình đã tạo nên một bi kịch cho 2 nhân vật Romeo và Juliet. Nếu cha mẹ họ sống trong hòa bình thì tình yêu của con cái cũng sẽ hòa hợp. Nhưng Romeo và Juliet hoàn toàn nhận thức được rằng hoàn cảnh bên ngoài khiến tình yêu của họ mâu thuẫn với điều kiện sống của mình. Điều này được nhấn mạnh trong lời của Dàn hợp xướng giữa tiết mục thứ nhất và thứ hai:<\/p>\n<p><em>Romeo yêu và được yêu bởi một người đẹp<\/em><\/p>\n<p><em>Ở cả hai, vẻ đẹp làm nảy sinh niềm đam mê.<\/em><\/p>\n<p><em>Anh ta cầu xin kẻ thù; từ một chiếc cần câu nguy hiểm Cô ấy phải cướp miếng mồi vì tình yêu.<\/em><\/p>\n<p><em>Là kẻ thù không đội trời chung của gia đình, anh không dám Trước những lời dịu dàng và lời thề yêu thì thầm của cô ấy.<\/em><\/p>\n<p><em>Hơn nữa, nó không có cơ hội<\/em><\/p>\n<p><em>Cô ấy sẽ gặp anh ta ở đâu đó.<\/em><\/p>\n<p><em>Nhưng đam mê sẽ cho sức mạnh, thời gian sẽ cho một ngày Và ngọt ngào sẽ làm dịu mọi đau khổ của họ.<\/em><\/p>\n<p><strong>* Romeo<\/strong> là một thanh niên lương thiện, tốt, bụng, lịch sự, đẹp trai đã hôn tay Juliet một cách kính mến và gọi người đẹp là nàng tiên. Nhiều người đã yêu thích Romeo và ngay cả Hầu tước Capulet đã gọi chàng là “người trẻ đức hạnh, biết kiềm chế”. Thế nhưng bi kịch đến với nhân vật này từ những tình huống xung đột. Hoàn cảnh biến động phức tạp hơn và hoàn toàn bất lợi cho tình yêu của hai người.<\/p>\n<p>Khi Romeo, sau lễ xe duyên bí mật với Juliet, đối mặt với Tybalt, anh cố gắng xoa dịu, hòa hoãn với anh ta:<\/p>\n<p><em>“Anh Tybalt hỡi! ý do khiến tôi yêu mến anh làm cho tôi có thể tha thứ sự giận dữ chứa đựng trong lời chào hỏi này. Anh ơi, tôi chẳng phải loại khốn nạn đâu.” “Tôi xin phân bua rằng chưa từng bao giờ tôi nhục mạ anh; trái lại, trước khi anh biết vì sao tôi quý mến anh thì anh chưa thể hiểu tôi quý anh đến chừng nào.”<\/em><\/p>\n<p>Nhưng sự việc giết chết Mercutio đã chấm dứt thái độ hòa giải của Romeo.Anh ta chiến đấu với Tybalt và đã giết anh ta để trả thù cho bạn mình.<\/p>\n<p><em>“Thế là vì ta mà chàng thanh niên quý tộc này, nhân thích của Vương chủ, bạn chí thân của ta, đã bị trọng thương; danh dự của ta bị Tybalt bôi nhọ, Tybalt mà từ một tiếng đồng hồ trước đã là biểu huynh của ta…”<\/em><\/p>\n<p>Romeo đang phải trải qua cơn bão lớn trong trái tim: tình yêu với một người bạn va chạm với tình yêu dành cho Juliet. Vì lợi ích của Juliet, anh ta sẽ không thể trả thù người họ hàng của cô, nhưng tình bạn và một món nợ danh dự đòi hỏi phải có mặt khác. Không nghĩ đến hậu quả, Romeo hành động vì cái chết của Mercutio. Romeo, người muốn thực hiện bước đầu tiên để hòa giải hai gia đình và đưa tay về phía Tybalt, nhưng Romeo đã giết chết anh ta và phơi tội lỗi mình trước sự trừng phạt của vương chủ. Tuy nhiên, Romeo không bị xử tử, mà chỉ bị trục xuất, nhưng đối với anh ta, việc tách khỏi Juliet tương đương với cái chết.<\/p>\n<p><strong>*Juliet là<\/strong> một thiếu nữ trẻ, đang dần dần trưởng thành. Theo cốt truyện Ý, Juliet 18 tuổi rồi qua tập thơ của Arthur Brooke, cô ở tuổi 16 xuân xanh nhưng trong vở kịch của Shakespeare, Juliet mới chỉ 13 tuổi, đầy thơ ngây và ôm nhiều hi vọng, Juliet rất đẹp và Romeo đã bị mê hồn lúc mới gặp nàng. Rồi ngay cả khi nằm trong ngôi nhà mồ, khi ngắm nhìn xác của Juliet, Romeo đã phải than rằng “Tử thần đã hút đi mật ngọt trong hơi thở của em, nhưng bất lực trước sắc đẹp của em!”<\/p>\n<p>Juliet cũng không tránh khỏi cuộc xung đột gia đình. Giống như Romeo, cô ấy cũng vậy, thoạt đầu nghĩ rằng rào cản ngăn cách gia đình họ rất dễ vượt qua. Đối với cô, dường như Montague chỉ là một cái tên và bản chất con người quan trọng hơn mâu thuẫn gia đình. Nhưng khi biết rằng Romeo đã giết Tybalt, Juliet bùng lên với sự tức giận như một Capulet thực sự.<\/p>\n<p>Juliet là một con người thực tế trong khi Romeo thuộc loại người lãng mạn. Trên bao lơn thơ mộng, Romeo thốt ra lời yêu đương thì Juliet nói tới hôn nhân. Juliet đã muốn chiều lòng mẹ cha trong cuộc hôn nhân mai sau, nhưng nàng đã suy nghĩ và hành động cho chính mình khi gặp Romeo.Trong tiến trình vở kịch, sau khi Romeo bị trục xuất khỏi Vérone vì phạm tôi giết người, Juliet bị cha mẹ ép phải kết hôn với chàng Paris mà nàng đã phản đối vì “<em>chưa từng trò chuyện với người ta bao giờ”<\/em>, nhưng vẫn không thuyết phục được mẹ cha. Điều khủng khiếp nhất có thể xảy ra - đó là phải làm vợ một người mà nàng không yêu và phải xa vĩnh viễn người nàng yêu say đắm - đã dẫn Juliet đến gặp cha Lawrence, nhờ cha giải thoát. Nàng hiểu rằng có rất nhiều vấn đề trên đời này, nhưng vẫn tin “tình yêu” có thể giúp cho con người vượt qua được mọi trở ngại. Juliet không còn là một cô gái dễ vâng lời, mà trở thành một phụ nữ trẻ chịu trách nhiệm về cuộc đời của chính mình. Shakespeare đã đặt người con gái liễu yếu đào tơ Juliet trước những thử thách vô cùng khốc liệt để qua đó nhằm khẳng định lòng chung thủy của nàng.<\/p>\n<p>🡺 Hành động nối tiếp hành động, những suy nghĩ nối tiếp suy nghĩ. Có thể thấy ở cả hai nhân vật bi kịch Romeo và Juliet, những tác động bên ngoài, điều kiện sống đã tác động rất lớn tới những hành động, suy nghĩ của họ. Từ đó góp phần gây ra những lỗi lầm bi kịch - đặc điểm cơ bản nhất của nhân vật bi kịch. Đặt trong bối cảnh của thời đại Phục hưng, thời đại của những tư tưởng nhân văn chủ nghĩa, chúng tôi nhận thấy sự hợp lí trong nhận định của John Peck và Martin Coyle: “Như trong Romeo và Juliet, ông<\/p>\n<p>(Shakespeare) cho thấy bản năng tự nhiên của con người, nó thách thức hoặc phản ứng chống lại những sức ép và sự mong đợi của xã hội mà họ đang sống” Chúng tôi cho rằng những tư tưởng về một tình yêu tự do trong Romeo và Juliet đã gặp phải một sức ép từ phía “xã hội mà họ đang sống”. Thù hận chỉ thể hiện được phần nào sức ép vô hình nhưng mạnh mẽ đó. Nó không trực tiếp xuất hiện nhưng lại tồn tại ở mọi nơi mọi lúc, thậm chí có khi thoáng qua trong suy nghĩ của đôi tình nhân, như bầu không khí đe doạ bao bọc quanh tình yêu.<\/p>\n"], ["2.3. Xung đột kịch trong Romeo và Juliet", 4, "<p>Lý luận về xung đột kịch cho thấy, những xung đột trong cuộc sống là tiền đề cho những xung đột trong văn chương. Nhưng không phải xung đột nào cũng là bi kịch. Trong bi kịch Phục Hưng, nắm bắt bản chất của thời đại, Shakespeare đã “<em>phản ánh sự bế tắc và sự tan vỡ của chủ nghĩa nhân văn thời Phục Hưng trước sức mạnh tàn phá của những thế lực phản nhân văn<\/em>”. Ông đã khắc họa chính xác qua xung đột kịch, những biến cố xã hội và cả những biến động trong đời sống tâm lý của con người. Đặc biệt xung đột nội tâm của nhân vật Shakespeare có ý nghĩa phổ quát to lớn. Xung đột kịch của ông không phải là xung đột giữa con người với định mệnh, mà đó là xung đột giữa con người với chính nó, dục vọng của bản thân.<\/p>\n<p>Và đến với vở Romeo và Juliet, đặc biệt về bi kịch tình yêu mà nhóm chúng tôi lựa chọn, bi kịch không xuất phát từ những cuộc đôi co, mâu thuẫn trong chuyện tình ái mà nó xuất phát từ trong chính bản thân nhân vật, xung đột bây giờ đi ngược vào trong. Phải bóc tách, luồn lách thậm chí nhập tâm vào vai diễn thì chúng ta mới thấy rõ được xung đột của vở kịch này.<\/p>\n<p>Mở đầu cho Hồi thứ II của vở kịch, lời dẫn của ban đồng ca như chất chứa những ngậm ngùi và dự kiến cho một cuộc tình đầy nghịch lí:<\/p>\n<p><em>“Romeo yêu và được yêu tha thiết<\/em><\/p>\n<p><em>Đôi mắt cùng nhìn, đôi lòng cùng mải miết. Nhưng tưởng đâu <strong>yêu đương gặp cừu hận Mùi ái ân pha trăm nỗi ngậm ngùi<\/strong>:<\/em><\/p>\n<p><em><strong>Là người thù<\/strong>, chàng <strong>chẳng thể tới lui<\/strong><\/em><\/p>\n<p><em>Để hẹn thề non như tình nhân từ vạn cổ<\/em><\/p>\n<p><em>Nàng Juliet <strong>yêu đương trong đau khổ<\/strong> Gặp bạn tình, biết tìm đến nơi nao?”<\/em><\/p>\n<p>Trong nghịch cảnh trớ trêu này, tại thời điểm xã hội lúc ấy, đứng giữa gia đình và ân ái tình yêu, con người ta chẳng phải lấn cấn nhiều điều, nhất là khi đôi bên gia tộc không đội trời chung, hằn thù còn sâu đậm. Nhưng nhân vật của Shakespeare không bị ràng buộc bởi quan điểm đó, chàng Romeo và nàng Juliet đã bứt phá khỏi tấm lá chắn đầy những gai góc hằn thù, đấu tranh tư tưởng giữa biên giới phân chia một bên là danh dự của gia tộc, một bên là khởi nguồn của yêu đương.<\/p>\n<p>Trước hết, với chàng Romeo đầy nóng vội, trót đê mê trước vẻ đẹp lộng lẫy như <em>“viên ngọc quý óng ánh bên tai một thiếu nữ xứ Ethiope”<\/em> của nàng Juliet từ cái nhìn đầu tiên. Dẫu biết rằng nhân duyên này biết bao bộn bề vướng mắc nhưng chỉ trong tích tắc thôi, chàng như bị mê hoặc, xao xuyến vì người đẹp. Ngay khi biết rằng, nàng là con gái của người mang mối thù không đội trời chung với gia đình mình, lời chàng thốt lên đầy ngổn ngang, bối rối <em>“Nàng là người họ Capulet sai? Ôi, oan trái yêu quý, đời sống của ta nay nằm trong tay người thù”<\/em>. Lời của chàng chứa đựng hai điều mâu thuẫn, một bên là sự vướng mắc về mối thù còn tồn tại, một bên là ta khao khát quá cái tình yêu trớ trêu kia. Dẫu nhận thức rằng mối lương duyên này là một ngõ cụt, nhưng trong chính bản thân Romeo vẫn tồn tại sự đấu tranh, cố chấp muốn tiến tới bên <em>“thánh nữ thân yêu”<\/em> của mình.<\/p>\n<p>Sau cùng, chàng vẫn lựa chọn bước đi theo con tim dẫn lối. Chàng vượt tường nhảy vào trong nhà họ Capulet bởi chính <em>“đôi cánh của tình yêu”<\/em>. Trong chính Romeo dù ít hay nhiều hẳn vẫn sẽ có sự tồn tại về khúc mắc giữa hai bên dòng tộc, nhưng tình yêu ấy thu hút quá, lôi cuốn quá khiến chàng chẳng muốn lựa chọn thêm nữa. Nếu được yêu, chàng đồng thuận thay tên đổi họ, thù ghét chính cái tên mình. Sự hiện diện tuy lén lút của Romeo trong nhà họ Capulet với vô vàn nguy hiểm đang rình rập xung quanh <em>“Nếu bị họ hành nhà em bắt gặp nơi đây thì chàng khó lòng thoát chết”<\/em> nhưng chàng vẫn không hề e sợ. Bởi với chàng, chỉ cần ánh mắt Juliet nhìn chàng <em>“yêu thương”<\/em> là chàng <em>“chẳng ngại gì hằn thù nữa”<\/em>. Với chàng lúc này, nếu chết vì lòng căm thù ấy cũng không vướng bận bằng việc <em>“chẳng được nàng đoái hoài”<\/em>. Giữa hai bên ranh giới giữa gia đình và tình yêu, Romeo vẽ ra hàng ngàn lí do để gạt đi mọi thù hận và tiến tới tình yêu.<\/p>\n<p>Việc chàng ta lựa chọn <em>“yêu đương trên thù hận”<\/em> như vậy thật là một sự dũng cảm và liều lĩnh. Khi mà từ cha mẹ, họ hàng, anh em đến cả gia nhân của hai bên dòng tộc đều coi nhau như cái gai trong mắt thì Romeo lòng <em>“không muốn oán thù”<\/em>. Khi chàng cầu xin tu sĩ Laurence chữa lành cho vết thương mà cả chàng và Juliet đang phải chịu, là lúc ấy, trong sâu thẳm của mình, chàng chỉ khao khát một điều rằng yêu thôi đừng tồn tại những oán hận. Một ánh sáng như hé mở khi Cha Laurence sẵn sàng giúp đỡ vì một lí do: <em>“Có thể vì mối duyên lành này mà oán thù giữa hai họ đổi thành tình sâu nghĩa nặng chăng!”<\/em>. Nơi nhà thờ thiêng liêng ấy, tình yêu chóng vánh đã gắn kết hết sức vội vàng với mong muốn xóa tan hằn thù.<\/p>\n<p>Đôi bạn trẻ ấy sung sướng trên đỉnh cao của hạnh phúc chưa được bao lâu thì cái chết của Tybalt – người họ hàng nhà Capulet dưới lưỡi kiếm của Romeo làm cho tình duyên ấy đã trắc trở, còn chênh vênh hơn bội phần. Romeo trong trạng thái dằn vặt và đau khổ sợ rằng nàng Juliet sẽ khước từ mình, sẽ coi mình như một kẻ giết người điên rồ, hơn nữa người tử thương lại là họ hàng của nàng. Gạt bỏ hận thù ra khỏi tâm trí chưa được bao lâu thì nó lại quay trở về. Nó trở lại khi tình yêu ấy đã được se duyên, chứng dám, khi đã có một sợi dậy ràng buộc đôi bên. Romeo sợ rằng, chính chàng là người đã gây thêm oán thù và cũng chính chàng là người làm tan nát trái tim và sự tin tưởng của Juliet.<\/p>\n<p>Và khi đã phải biệt xứ ở Mantua, nghe tin nàng Juliet của mình đã chết, chàng như mất hết lí trí <em>“Ôi sao kẻ tuyệt vọng dễ nghĩ đến chuyện điên rồ!”<\/em>. Con tim ấy đã héo mòn và đầy tuyệt vọng khi nàng Juliet của chàng không còn ở trần gian nữa (dù chưa biết thật giả ra sao). Và khi tận mắt chứng kiến nàng Juliet bất động ở nơi hầm mộ tăm tối và u ám ấy, xung đột trong con người Romeo đã đạt tới đỉnh điểm, chàng như <em>“giằng ra khỏi xiềng xích của các hung tinh nắm xương thịt đã chán mùi trần thế”<\/em>.<\/p>\n<p>Romeo đã thật sự muốn giải thoát mình khỏi ranh giới giữa hai sự lựa chọn cứ quẩn quanh mãi bên mình. Trong giây phút chua chát ấy, chàng đã dốc hết liều <em>“thuốc bổ”<\/em><\/p>\n<p><em>“đuổi hơi thở ra khỏi cơ thể nhanh và mạnh”<\/em> mua của một thầy lang thật thà. Đến đây, xung đột trong nội tâm của chàng Romeo chung thủy, liều lĩnh nhưng tội nghiệp cũng đến hồi kết thúc.<\/p>\n<p>Hơn cả Romeo, nàng Juliet mới lớn – một cô gái lần đầu chạm ngưỡng cánh cửa tình yêu còn phải vật lộn gấp trăm vạn lần. Mũi tên ái tình trong đêm tiệc cũng dẫn nàng lao thẳng tới những xung đột hết sức giằng xé. Khi biết rằng, vị công tử mà nàng lỡ mê mẩn là Romeo – họ nhà Montague – <em>“là con một của kẻ thù họ nhà ta”<\/em>, nàng đã thốt lên mấy câu thơ rằng:<\/p>\n<p><em>“<strong>Một mối thù sinh một mối tình<\/strong>,<\/em><\/p>\n<p><em>Vội chi sớm gặp, biết đành muộn sao! <strong>Tình đâu trắc trở gian lao<\/strong><\/em><\/p>\n<p><em><strong>Hận thù mà hóa khát khao ân tình!<\/strong>”<\/em><\/p>\n<p>Lời của nàng đầy những mâu thuẫn và hoang mang. Nàng đã yêu rồi sao! Cũng vội vàng như chàng Romeo vậy. Bởi vì sự rung động đó mà biên giới giữa thù hằn gia tộc và ân ái yêu đương hình thành. Nàng đứng giữa bờ vực của hai sự lựa chọn khó nhằn bắt buộc phải cân nhắc kĩ lưỡng. Với một cô gái trẻ và mới chớm lớn như nàng, lựa chọn an toàn nhất là gia đình. Nhưng ngược lại, tuy trong tâm cảm, nàng vẫn lo sợ về mối oán hận còn dang dở nhưng tình yêu như một sự thu hút diệu kì dẫn lối nàng đi đến cánh cửa của yêu đương. Đứng giữa ranh giới ấy, nàng dường như đổ hướng về tình yêu <em>“Hãy thề là chàng yêu em đi, em sẽ không còn là con cháu nhà Capulet nữa”<\/em>; <em>“Chỉ có tên họ của chàng là thù địch của em thôi”<\/em>. Phải chăng nàng nghĩ rằng khi chẳng còn mang tên họ của gia tộc nữa, rung động ấy, tình yêu ấy sẽ chẳng phải đắn đo, chẳng mang tội lỗi? Nhưng sự sợ hãi vẫn luôn thường trực ở đấy <em>“Nếu bị họ hàng nhà em bắt gặp nơi đây thì chàng khó lòng thoát chết”<\/em>; <em>“họ giết chàng mất”<\/em>. Những lời mạnh miệng ban đầu cũng phải rén sợ vì sự đeo bám của mối thù gia tộc. Nhưng tình yêu như làm mờ mắt <em>“kẻ si tình”<\/em>, chính Juliet vội vã đưa ra lời đề nghị hôn ước <em>“Nếu tình ai kia là của người chính nhân quân tử, nếu ý chàng là người muốn cùng em xen tơ kết tóc, thì ngày mai em sẽ cho người đến gặp chàng; chàng sẽ cho biết chàng muốn hôn lễ cử hành ngày nào, chỗ nào. Lúc đó em xin trao thân gửi phận trong tay chàng và nguyện theo phu quân tới nơi chân trời góc biển”<\/em>. Nàng đã thật sự lựa chọn và giải thoát mình khỏi sự chênh vênh, mâu thuẫn rồi sao?<\/p>\n<p>Tưởng chừng như Juliet đã yên bình và hạnh phúc với người nàng yêu nhưng mâu thuẫn lại tiếp tục xuất hiện khi nàng nghe tin biểu huynh Tybalt chết dưới lưỡi kiếm của Romeo – vị hôn phu mới được ba tiếng đồng hồ của nàng. Ban đầu, nàng còn ngỡ ngàng và thất vọng, buông lời trách cứ <em>“Ôi, quân cường bạo mà sao dễ thương, giống quỷ ma mà đẹp tựa thiên thần!”<\/em>; <em>“phong thái thần tiên mà tội đáng đày nơi hỏa ngục, kẻ thất phu mà cốt cách hào hoa!”<\/em>, nàng như vỡ mộng, bởi chính người mà mình yêu nhất lại chính là người làm xoáy lại trong nàng những phân vân và giằng xé giữa hai sự lựa chọn. Nhưng khi nhũ mẫu buông những lời sỉ nhục Romeo, nàng lập tức bênh vực chàng và tự lí giải nguyên do cái chết của Tybalt là <em>“vì tên anh họ hung bạo của ta định giết chồng ta…”<\/em>. Nước mắt nàng rơi nhưng không phải đau buồn cho người anh tử thương mà những <em>“giọt châu”<\/em> ấy để dành cho Romeo – người bị đày đi biệt xứ. Âm dương cách biệt cũng không đau đớn bằng việc phải xa người đàn ông mà nàng tôn thờ như một vị thần.<\/p>\n<p>Nỗi đau buồn vì phải xa cách nghìn trùng vạn dặm chàng trai mà mình yêu chưa nguôi, Juliet đã phải nhận thêm một cú sốc, cha cô gả cô cho bá tước Paris một cách đột ngột. Với nàng, chỉ có Romeo, người mà nàng yêu say đắm, những lời thề hẹn ước với chàng còn giang dở, em là vợ chàng thì làm sao em có thể làm trái lẽ được. Juliet một mực từ chối sự sắp đặt của cha <em>“Sự vội vã của cha làm con nhạc nhiên quá; ai lại bắt con lấy một người khi con chưa từng trò chuyện với người ta bao giờ!”<\/em>; <em>“Con sung sướng sao được với một việc mà con căm ghét”<\/em>. Nàng tạ ân sự quan tâm và sắp xếp của cha nhưng nàng không thể đánh mất hai chữ <em>“chung thủy”<\/em> dành cho chồng mình. Lời đáp lại cha, Juliet không dám kèm theo lí do vì sao nàng từ chối. Bởi dù cố gắng đấu tranh đến đâu, liều lĩnh đến nhường nào thì nỗi lo sợ về mối thù gia tộc vẫn bao vây nàng, chỉ cần cha nàng biết, ắt hẳn biến cố lớn sẽ xảy ra. Chỉ mới là lời từ chối thôi mà những lời chưởi rủa của cha nàng cũng đầy chì chiết <em>“Đồ chết dẫm, đồ đĩ dại, đồ mặt xanh nanh vàng”<\/em>; <em>“cái quân người nộm chỉ biết rên la”<\/em>. Nàng như tuyệt vọng trước quyết định của cha mình <em>“Chồng em còn ở trần gian, mà lời thề của em thì đã tới thiên đường”<\/em>.<\/p>\n<p>Khi nhũ mẫu – người thân cận nhất cũng không cho nàng được một lời khuyên tốt đẹp, nàng tìm đến Cha với niềm hy vọng cuối cùng. Nàng cầu xin, xung đột nội tâm trong nàng dường như đã lên đến đỉnh điểm khi hình ảnh <em>“lưỡi dao”<\/em> xuất hiện như một biểu hiện của sự phản kháng mãnh liệt. Thà rằng chết dưới con dao sắc nhọn kia còn hơn việc không giữ trọn danh dự với người nàng yêu. Tu sĩ Laurence hẳn cũng bởi đồng cảm với lòng chung thủy của nàng mà đưa ra một phương kế hết sức kì lạ và không kém phần đau đớn làm một việc <em>“giống như chết”<\/em> mà không phải chết. Juliet đồng ý ngay.<\/p>\n<p>Nàng chấp nhận đóng băng tạm thời cơ thể của mình để bảo toàn danh tiết. Dẫu rằng, khi đã sẵn sàng cho việc sắp sửa xảy ra, nhưng trong nàng vẫn vẩn vương những nỗi lo sợ <em>“thấm lạnh vào mạch máu”<\/em>, nàng sợ <em>“thuốc không kiến hiệu”<\/em>; nàng sợ <em>“nhỡ đây là thuốc độc mà ông thầy đa mưu kia muốn dùng để giết ta”<\/em>; nàng sợ khi tỉnh dậy, chàng Romeo vẫn chưa xuất hiện; sợ nơi hầm mộ tối tăm và u ám đầy khủng khiếp. Ôi, Juliet đáng thương! Nàng bé bỏng, cô đơn, yếu đuối, nàng bấn loạn là lẽ thường tình. Ai ở vào tình cảnh đó mà ung dung tự tại mới là kẻ không bình thường, mới là giả dối. Do đó, đây là nỗi sợ hãi mang tính người nhiều nhất mà nhà hiện thực chủ nghĩa Shakespeare đã phanh phui ra được, như một nhược điểm trong tâm lý của người đời. Nỗi sợ hãi này còn khủng khiếp hơn cả cái chết. Bởi nếu chết đi, nàng sẽ không còn phải sợ, không còn phải buồn, không còn phải tuyệt vọng... Điều đáng chú ý là dù tuyệt vọng như thế nhưng không mảy may Juliet nghĩ mình phải làm ngược lại để trốn chạy nỗi sợ. Có thể người con gái mỏng manh này thay đổi thái độ được lắm chứ (dù chỉ trong suy nghĩ): Tại sao nàng phải tự hành hạ mình? Chỉ cần nỗi sợ này chiến thắng, chỉ cần dừng tay lại, vứt lọ thuốc đi, Juliet sẽ có tất cả: sự sống, danh vọng, địa vị, tiền tài, bởi chàng Paris sẽ cho nàng tất cả những thứ kia. Đúng, nàng sẽ có tất cả, duy chỉ không có tình yêu. Tình yêu mà vì nó cả thân thể và tâm hồn nàng bị vò xé như thế này đây. Tình yêu mà từ ba hôm trước, đã trở thành lẽ sống của cả cuộc đời nàng. Vậy thì làm sao mà người con gái kiên cường này lại có thể phản bội tình yêu dù chỉ trong ý nghĩ! Quả Juliet đã không hề hèn nhát. Thậm chí trong tột cùng nỗi sợ của riêng mình, nàng vẫn lo lắng cho người yêu, sợ rằng người anh họ đã chết của nàng có thể báo thù người mà nàng yêu dấu: <em>“Ô kìa, hình như ta thấy bóng ma của biểu huynh bị gươm Romeo đâm thủng ngực đang đi tìm chàng...”<\/em>. Và nàng cuống quýt, như là để bảo vệ cho bằng được người yêu: <em>“Đứng lại, Tybalt! Hãy đứng lại!... Romeo hỡi, em đến đây!”<\/em>. Thế rồi lọ thuốc được đưa lên, còn Juliet thì ngã xuống...Đấu tranh tư tưởng, đến cuối cùng, nàng vẫn chấp nhận bốn mươi hai tiếng đồng hồ với cơ thể là một cái xác <em>“cứng đờ và lạnh ngắt”<\/em>.<\/p>\n<p>Ở cuối đoạn độc thoại nội tâm của Juliet, hình ảnh sau cùng mà nàng mang theo chính là hình ảnh chói lọi của Romeo. Chỉ nó thôi đã thiêu đốt nỗi sợ hãi của Juliet ra tro. Nếu tình yêu của Juliet dành cho Romeo chỉ là những tình cảm nhất thời, hẳn nàng sẽ chẳng đủ nghị lực để đương đầu với tất cả, những thử thách bên ngoài và cả những thử thách bên trong: mối thù dòng họ, lễ giáo phong kiến, xung đột anh em, sự trái ngang của duyên phận, sự tuyệt vọng trước chia ly, nỗi sợ hãi trong hầm mộ, ... Chính tình yêu đã cho nàng sức mạnh, đặc biệt là khi nàng phải đối diện với nỗi sợ hãi lớn nhất - đó là nỗi sợ không chế ngự được bản thân mình. Như thế tình yêu của Juliet dành cho Romeo thật đáng ao ước biết bao.<\/p>\n<p>Cũng có lẽ từ đây, nhờ biện pháp khắc họa tâm lý nhân vật tài tình của Shakespeare mà người đời tìm thấy mình trong nhân vật của ông. Shakespeare đã khái quát được những trạng thái tình cảm chân thực của con người, đặc biệt là người con gái khi yêu. Có phải thế chăng mà Flaubert mới nói: <em>“Virgile xây dựng người đàn bà yêu đương, Shakespeare thì xây dựng người con gái yêu đương, và tất cả những người phụ nữ yêu đương khác đều là bản sao ít nhiều xa gần so với Didon hoặc Juliet”<\/em>.<\/p>\n<p>Đến cuối cùng, khi tỉnh dậy, người nàng yêu cũng đã đổ gục bên nàng, nàng cùng chết bằng <em>“con dao quý báu”<\/em>. Chết như là một sự giải thoát, là cách để giải quyết những xung đột và mâu thuẫn luôn thường trực, đeo bám hạnh phúc của nàng. Cả một hành trình yêu đương ngắn ngủi, chóng vánh, hai nhân vật của Shakespeare chưa bao giờ ngừng đấu tranh, trong con người họ luôn tồn tại những mâu thuẫn, làm tan nát hai tâm hồn còn trẻ trung, khao khát yêu và được yêu cháy bỏng. Kết quả của chuỗi xung đột ấy là một thảm kịch đẫm máu và độc dược làm cho con người ta không khỏi xót xa, tiếc nuối cho một chuyện tình đẹp.<\/p>\n"], ["2.4. Tội lỗi bi kịch", 4, "<p>“Không có tội lỗi bi kịch, cũng như không có xung đột bi kịch thì không có tác phẩm bi kịch”. Kierkegaard khẳng định: “Nếu con người hoàn toàn vô tội, bi kịch mất hết lý thú, bởi vì sẽ mất đi sức mạnh của xung đột bi kịch; mặt khác, nếu nhân vật tự nó có tội hoàn toàn, thì nó sẽ không thể khiến ta quan tâm, xét từ quan điểm bi kịch”. Có nghĩa là nhân vật bi kịch phải vừa có tội, lại vừa không có tội. Mọi say mê của con người, nhất là những say mê chính đáng, cao thượng, giàu tính nhân văn, càng nồng cháy bao nhiêu thì càng tiềm ẩn nguy cơ này bấy nhiêu.<\/p>\n<p>Với thời đại khi mà lễ giáo phong kiến vẫn còn tồn tại và áp đặt lên những số phận bất hạnh, nhân vật của Shakespeare cũng không thoát khỏi sự đánh giá đầy khắc nghiệt và chì chiết của xã hội.<\/p>\n<p>Một giả thuyết rằng nếu Romeo – vị khách không được mời không bị rủ rê tới dự buổi dạ yến của nhà Capulet thì sự thể sẽ ra sao. Trước khi cuộc vui bắt đầu, lời của chàng như một sự dự báo <em>“Tôi linh cảm rằng một định mệnh nào đây, mà hiện nay còn treo lơ lửng trên đầu các vì sao, sẽ lấy đêm vui này làm <strong>màn đầu cho một tấn thảm kịch<\/strong>”<\/em>. Bởi chính sự có mặt của Romeo ngày hôm ấy, đã diễn ra một cuộc gặp gỡ “định mệnh trớ trêu”. Tình yêu nảy sinh trên thù hận, dẫu đôi bên đều nhận thức về oan trái ấy, nhưng họ vẫn lao vào nhau một cách vội vàng. Trong hoàn cảnh trớ trêu như vậy, hai số phận ấy đáng lẽ phải nhận thức được những hậu quả và biến cố mà họ phải đối mặt nếu quyết định tiến đến với nhau. Nhưng nào ai ngờ, đôi bạn trẻ ấy còn tăng tốc nhanh hơn ta tưởng. Dẫu biết rằng cuộc hôn nhân của họ sẽ không bao giờ được chấp nhận nhưng họ vẫn quyết định ràng buộc nhau trên danh nghĩa vợ chồng dưới sự chứng giám của Chúa trời chỉ sau một đêm gặp gỡ.<\/p>\n<p>Với đôi gái trai vừa tròn mười ba, mười bốn, hẳn rằng, chàng Romeo và nàng Juliet chưa thể đủ chín chắn và trưởng thành để có những suy nghĩ và quyết định đúng đắn. Ta có thể thấy họ dần dần mù quáng trong tình yêu và thậm chí phản kháng mãnh liệt với cha mẹ. Về phía Romeo, chàng ta như bị mờ mắt bởi vẻ đẹp tuyệt sắc của Juliet, chàng phá tan mọi xiềng xích, rào cản để bước tới, chấp nhận thay tên đổi họ, thậm chí <em>“thà để cho lòng căm thù của họ chấm dứt đời tôi còn hơn kéo dài kiếp sống mà thiếu tình nàng”<\/em> chẳng hề mảy may sợ hãi về cái chết đang rình rập. Và đỉnh cao của sự mù quáng, chàng lựa chọn cái chết khi nghe tin rằng người yêu của chàng đã đóng băng lạnh ngắt. Juliet còn mạnh liệt hơn, nàng cũng trót mê đắm bởi sự lịch thiệp và ngọt ngào của chàng Romeo trong lần đầu gặp gỡ. Dẫu biết rằng chàng là kẻ mà ta chẳng bao giờ được phép yêu đương nhưng nàng vẫn tiến tới, chủ động và mạnh mẽ hơn bao giờ hết. Nàng luôn tranh đấu để bảo toàn tình yêu của mình, vội vàng đề nghị hôn ước, bênh vực Romeo – kẻ đã giết người thân của mình, sẵn sàng giả chết để bảo toàn danh tiết với người mình yêu. Thời đại ấy, đặc biệt là với người thân phận con gái, việc cha mẹ <em>“đặt đâu ngồi đấy”<\/em> là một điều hiển nhiên phải tuân theo nhưng nàng Juliet thì không chấp nhận điều đó. Nàng xuyên qua mọi lễ giáo phong kiến, đạp đổ mọi bức tường đang cản bước nàng để trọn vẹn với hạnh phúc của mình.<\/p>\n<p>Nhân vật của Shakespeare mạnh mẽ, chủ động và hoàn toàn tự do. Họ tự thân lựa chọn và quyết định cho hạnh phúc của mình. Dù rằng, với định kiến xã hội lúc ấy, họ mang tội lỗi của kẻ nghịch tử nhưng ở thời điểm hiện tại, khi không còn sự tồn tại của những tư tưởng cũ, mọi sai lầm ấy lại chính là sự sáng suốt và gan dạ của đôi bạn trẻ một lòng nhiệt huyết với tình yêu.<\/p>\n"], ["2.5. Kết thúc bi kịch - Ý nghĩa của cái chết", 4, "<p>Nếu tiến trình của một vở kịch được triển khai chủ yếu qua ba bước: thắt nút, cao trào và mở nút thì kết thúc chính là mở nút. Cái kết, hẳn nhiên là việc khó nhất trong qui trình sáng tạo nghệ thuật nói chung. Với bi kịch, cái kết phô bày có khi là cái chết của các nhân vật với vô vàn ý nghĩa; cũng có khi nó là sự tồn tại của nhân vật, nhưng <em>“tệ hơn cả cái chết”<\/em>.<\/p>\n<p>Romeo và Juliet là hiện thân của một tình yêu đẹp, một tình yêu đích thực và lý tưởng, có sức lôi cuốn diệu kỳ và đánh thức mọi trái tim khao khát yêu đương. Qua bao thăng trầm, tình yêu ấy vẫn tỏa sáng, vẹn nguyên trong lòng khán giả. Có được thành công đó của tác phẩm, Shakespeare sáng tạo một cách tài tình ở từng chi tiết nghệ thuật lẫn ở sự lựa chọn đầy bản lĩnh về mặt thể loại. Tại sao ông lại biến đổi một cách tàn nhẫn câu chuyện có thật về kết thúc đẹp đẽ của chuyện tình chàng Romeo và nàng Juliet Trung cổ thành thảm thương đến vậy? Tại sao ông lại rời xa cảm hứng hài kịch cũng đã đem lại cho ông bao vinh quang trước đó? Trong đời thực, câu chuyện Romeo và Juliet được tiếp tục bởi cha Lawrence đã kịp thời ngăn chặn tai biến, hai người không chết, kết hôn, sống bình thường như những đôi vợ chồng khác trên đời. Nếu trung thành với tài liệu của cuộc sống, hẳn Shakespeare chỉ có thể viết nên một vở mélodrame (kịch tâm lý tình cảm) thông tục mà sức sống không thể dài bằng một bi kịch. Ở vào một thời điểm là thời đại Phục Hưng vốn đang thừa hưởng những thành quả rực rỡ của những kiệt tác bi kịch của người Hy Lạp cổ, không thể nói là Shakespeare không chịu ảnh hưởng từ di sản đó, trong khi bi kịch được đánh giá là một thể loại cao quý, một <em>“bông hoa tuyệt đẹp”<\/em>, hẳn Shakespeare có đủ lý do để biến một vở drame hôn nhân thành một bi kịch tình yêu.<\/p>\n<p>Có thể hiểu có hai lý do để Shakespeare kết thúc cuộc tình của Romeo - Juliet bằng cái chết. Thứ nhất, dù tình yêu đồng nghĩa với những gì lãng mạn nhất, nhưng tình yêu Romeo và Juliet không tồn tại ở một thế giới siêu nhiên nào, nó là sản phẩm của thời đại Phục Hưng, thời kỳ quá độ từ chế độ phong kiến lên chế độ tư bản chủ nghĩa, Shakespeare đủ sáng suốt để không sa vào ảo tưởng, ông biết chủ nghĩa nhân văn chưa thể cắm cờ toàn thắng. Lý do thứ hai có cơ sở từ lý do đầu tiên: đó là hiện thực cuộc sống thời Phục Hưng tràn đầy những mâu thuẫn xã hội khốc liệt phù hợp với loại hình bi kịch.Cái chết của Romeo và Juliet là kết quả những mâu thuẫn không giải quyết được của thời đại, hay để giải quyết mâu thuẫn, Shakespeare đã đưa ra giải pháp hy sinh những đứa con lý tưởng của mình, bởi những mặt trái xã hội đương thời như mối thù dòng họ, lễ giáo phong kiến không dễ gì xóa bỏ (bằng chứng là vương chủ bó tay, hai họ không kiềm chế được).Cả hai người đều nhận thức được một cách sâu sắc rằng họ sinh ra là để cho nhau, là để được hạnh phúc bình yên. Cho nên không được sống cùng nhau thì họ phải chết cùng nhau. Đây là một nhận thức có giá trị thức tỉnh những con người đang chìm đắm trong u mê của sự hận thù. Cho nên cái chết ở đây không tạo ra sự bi lụy đau thương mà tạo ra sự đồng cảm tạo ra sự định hướng cho hành động của người trong cuộc đời, hướng tới khát vọng vươn lên để làm chủ tình huống.<\/p>\n<p>Có thể Shakespeare cũng không ngăn nổi dòng lệ khi để cho Romeo và Juliet phải chết, nhưng với nhãn quan sáng suốt của mình, ông biết họ là những kẻ “tử vì đạo”. Ông buộc phải mượn cái chết của đôi trai gái để “giết” luôn một di sản đồi bại của chế độ phong kiến Trung cổ. Và ông đã làm được điều đó: <em>“Trên xác con cha mẹ mới quên thù”<\/em> (Tự ngôn, Hồi I). Cái chết của họ là một hồi chuông cảnh tỉnh cho toàn nhân loại phải tôn trọng sự tự do hạnh phúc, yêu đương của con người. Cái chết của họ còn tạo ra giá trị là xóa đi hận thù truyền kiếp. Có thể nói Romeo và Juliet chết đi cho tình người sống lại, cho con người trở về trong vòng tay thân ái của nhau, cho giá trị nhân văn được bảo toàn và khẳng định. Trong một hoàn cảnh u ám và lạnh lẽo, đôi tình nhân Romeo và Juliet vẫn ấm áp bởi vì họ có tình yêu. Tình yêu đem lại hơi thở và sức sống căng tràn cho tâm hồn nếu đó là tình yêu trong sạch. Đó cũng là ý nghĩa lạc quan của vở kịch. Nó tạo ra niềm tin cho con người vào sự thắng thế của cái tiến bộ, của cái cao cả.<\/p>\n<p>Bi kịch của Romeo và Juliet cũng đồng thời là tiếng nói nhân văn cao cả của Shakespeare đóng góp cho nền văn học Anh và văn học thế giới. Cái chết của Romeo và Juliet đánh dấu sự thắng lợi của lý tưởng nhân văn: Dù phải trả giá đắt, cái mới cần phải được xác lập. Tính chất chiến đấu của tác phẩm, vì thế càng trở nên mạnh mẽ. Từ đây nhân loại có thể bước vào kỷ nguyên của tình yêu tự do, hôn nhân tự nguyện, mà Romeo và Juliet là hai kẻ tiên phong.<\/p>\n"], ["2.6. Hiệu ứng bi kịch", 4, "<p>Trong giới thuyết của Aristotle về hiệu ứng tâm lý của bi kịch: Nó gây lo sợ và xót thương. Bi kịch kích gợi nỗi lòng. Sự lo sợ và thương xót được cấu thành từ hai nhân tố: sự đồng tình hoặc yêu quý đối với khách thể cùng nỗi tiếc thương nảy sinh trước cảnh thống khổ. Nhưng cái đó chưa đủ và không phải là cái chính. Hành động bi kịch phải dẫn đến sự thanh lọc những cảm xúc ấy. Trong sự giải thích của mình về sự thanh lọc, Aristote trình bày ngắn gọn như sau: nhờ sự lo sợ và thương cảm, bi kịch nảy sinh những tác động thanh lọc tâm hồn, tinh thần con người. Bi kịch chữa lành những cảm xúc bằng những cảm xúc tương tự nhưng không hoàn toàn trùng hợp nhau. Trong bi kịch đó là sự thanh lọc những nỗi lo sợ và thương cảm. Sự thanh lọc ở bi kịch vượt ra ngoài khuôn khổ sinh lí mà đạt đến sự thanh lọc nghệ thuật. Những gì đã được chứng kiến trên sân khấu khiến người xem sau khi xúc động cực điểm đã buộc họ phải suy tư.<\/p>\n<p>Đối với bi kịch tình yêu trong Romeo và Juliet, khán giả xem kịch đồng cảm, thương xót với nỗi đau của nhân vật: Nỗi đau cho tình yêu cao cả không trọn vẹn. Đối diện với kết cục của những nhân vật bi kịch, kết cục trả giá cho những lỗi lầm mà đỉnh cao là cái chết, ta bùi ngùi, thương cảm cho mối tình thật đẹp, dám bất chấp tất cả để “thách thức hoặc phản ứng chống lại”, bất chấp tất cả để vượt qua mối thâm thù của hai dòng họ, và khi đã vượt qua khỏi sự kiểm soát của sức ép, tình yêu tự do cũng không tránh khỏi những mất mát, đau đớn. Đó là sự hy sinh cần thiết cho tình yêu thăng hoa. Một khi tình yêu đủ lớn , nó sẽ xóa nhòa mọi thù hận, khi bị ngăn cản cũng không thể dập tắt được ngọn lửa tình mãnh liệt của đôi lứa còn đương độ xuân thì - đó chỉ là hành động tiếp thêm cho họ những rực cháy của tình yêu, những đam mê cháy bỏng và ước mơ được cùng ở bên nhau.<\/p>\n<p>Như vậy, cảm xúc bi kịch của Romeo và Juliet đem đến cho khán giả sau những lo lắng, thương cảm chính là niềm tin tất thắng và niềm lạc quan về quy luật nơi tận cùng của tan vỡ là hồi sinh. Hiệu ứng đích thực của bi kịch chính là niềm lạc quan, niềm tin vào các giá trị. Theo Hoàng Ngọc Hiến trong “Năm bài giảng về thể loại” thì “nếu như kết thúc bi thảm không có ý nghĩa lạc quan thì đó là bi thương, bi lụy nhưng chưa phải bi kịch”. Rõ ràng kết thúc vở kịch, cả Romeo và Juliet đều chết nhưng lí tưởng và sự tự do trong hạnh phúc yêu đương của họ vẫn còn tồn tại mãi mãi. Mối tình của Romeo và Juliet là minh chứng cho sức mạnh của tình yêu đích thực.<\/p>\n"], ["3. Nghệ thuật", 3, "<p><em><strong>3.1. Điểm gặp gỡ trong vở kịch Romeo và Juliet với thể loại<\/strong><\/em><\/p>\n<p><em><strong>* Dựa theo tích cũ và văn bản trước đó:<\/strong><\/em><\/p>\n<p>Cũng như nhiều vở kịch của Shakespeare, kịch bản Romeo và Juliet cũng dựa theo tích cũ và các văn bản được lưu hành trước đó. Câu chuyện về mối tình oan trái, bi thảm của Romeo và Juliet vốn là câu chuyện có thật, từng xảy ra ở thời trung cổ. Nó đã được một số nhà văn, nhà thơ Italia ghi chép lại, nhuận sắc thêm, nhờ vậy mà nó khá phổ biến, không những ở Italia mà còn ở Pháp, ở Tây Ban Nha qua các bản dịch hoặc phỏng tác của một số cây bút ở hai nước này. Như Pie Boato (Piere Boisteau) là người đã dịch ra tiếng Pháp thiên truyện bằng văn xuôi của nhà văn Italia Mateo Banđelô xuất bản năm 1554. Nhà thơ trẻ người Anh là Actor Bruce (Arthur Brooke) có thể là đã dựa vào bản dịch tiếng Pháp để biến câu chuyện này thành một truyện bằng văn vần dài ngót 3000 câu.<\/p>\n<p>Shakespeare đã mượn cốt truyện đó và dựng thành vở bi kịch. Để cho câu chuyện tình oan trái ấy càng thêm thương tâm, càng thêm phẫn nộ, ông đã dồn hết sự thông cảm, sự đồng tình của mình cho đôi uyên ương. Trước hết ông biến nó thành một bản tình ca say đắm nhất, dũng cảm và bất khuất vô cùng, dẫm đạp lên hận thù và lễ giáo phong kiến để giành lấy quyền tự do yêu đương và hưởng hạnh phúc. Ông cho họ tình cờ đến với nhau và cũng rất tình cờ những bất trắc liên tiếp xảy đến với họ. Romeo và Juliet cố gắng vượt qua được trở ngại này thì trở ngại khác lại đến với họ, điều này tạo tính li kì và hấp dẫn của vở kịch.<\/p>\n<p><em><strong>3.2. Cách tân thể loại trong kịch Romeo và Juliet<\/strong><\/em><\/p>\n<p><strong>* Hành động kịch:<\/strong> Ông không tự trói tay mình vào quy tắc tam duy nhất.<\/p>\n<p><strong>- Thời gian:<\/strong> ở đây tuy được dồn lại để làm tăng thêm tính chất gay gắt của mâu thuẫn nhưng cũng diễn ra trong bốn ngày đêm chứ không giống quy tắc chỉ diễn ra trong khoảng một ngày.<\/p>\n<p><strong>- Hành động kịch của ông:<\/strong> duy nhất nhưng không phải đơn nhất. Bên cạnh hành động chính, ông đưa thêm hành động phụ nhằm mở rộng và khoét sâu thêm mâu thuẫn khiến cho tấn bi kịch mà ông trình bày càng mở rộng về quy mô, kích thước càng gay gắt thêm về tính chất và mức độ.<\/p>\n<p><strong>- Địa điểm:<\/strong> diễn ra ở nhiều địa điểm như trong nhà, khi ở ngoài vườn nhà họ Capulet, hoặc trên đường phố, hoặc trong hầm mộ. Mỗi hồi diễn ra, thì thường được đổi cảnh liên tục.<\/p>\n"], ["* Nghệ thuật điển hình hoá tính cách nhân vật:", 3, "<p><em>Shakespeare thường đặt nhân vật của mình vào một chuỗi những tình huống mâu thuẫn, phức tạp, do đó mà toàn bộ tính cách được bộc lộ ra hết, bản chất của nó cũng được phơi bày rõ rệt. Trong khi xây dựng nhân vật ông chú ý đến việc mổ xẻ, phân tích diễn biến tâm lí của nó trước mỗi tình huống mà nó gặp phải.<\/em><\/p>\n<p>Ta có thể thấy nhân vật Juliet, đó là cô gái lần đầu bước vào ngưỡng cửa của tình yêu. Cái ngây thơ, hồn nhiên, trong trắng đã khiến cho hình tượng Juliet trở thành hình tượng thiếu nữ yêu đương đẹp nhất. Nàng phó thác cho trái tim đang rạo rực của mình dẫn dắt. Lí trí dù có lúc lên tiếng báo động nguy cơ thì cũng chỉ làm gợn lên một thoáng băn khoăn xe lẫn một chút hờn dỗi số phận éo le.<\/p>\n<p>Đối với Romeo, chàng là người không quan tâm đến hận thù, bên cạnh đó chàng có cả một lòng thuỷ chung với Juliet. Khi yêu Juliet, Romeo đã làm tất cả những điều phi thường để mong sao Juliet có được hạnh phúc. Chàng đã vượt qua bao bức tường cao của nhà Capulet, tức là vượt qua bóng đêm nghiệt ngã của sự hiềm khích hận thù thời trung cổ.<\/p>\n"], ["* Trộn lẫn bi kịch với hài kịch", 3, "<p>Vở kịch Romeo và Juliet là vở bi kịch đầu tay của Shakespeare ra đời giữa lúc ông đang hào hứng sáng tác kịch lịch sử và hài kịch. Nên vở kịch vẫn mang màu sắc pha trộn giữa cái hài và cái bi.<\/p>\n<p>Shakespeare phá vỡ quy luật nghiệt ngã phân biệt giữa bi kịch và hài kịch, không cho phép trộn lẫn cái bi với cái hài trong một vở kịch. Ông đã đưa nhiều yếu tố hài vào trong vở bi kịch này. Thậm chí đưa một số cảnh tràn đầy không khí lạc quan, vui vẻ vào trong đó.<\/p>\n<p>- Nhân vật nhũ mẫu là một ví dụ điển hình, đây là một nhân vật gần gũi với hài kịch hơn là bi kịch. Nhũ mẫu là một người phụ nữ tuy đã là một người đứng tuổi nhưng tính cách của bà thật vui vẻ, dí dỏm. Những câu nói đùa của bà khi bà nói tạo nên một không khí vui vẻ. Những lời bà nói với phu nhân Capulet, những lời nhận xét về Romeo, những câu đối thoại của bà với Juliet thực chất là những câu nói đùa trêu chọc vui vẻ, nói giúp cho Juliet và Romeo quên đi hận thù xung quanh.<\/p>\n<p><em>Trong hồi 1, cảnh 3:<\/em> Trong nhà Capulet khi C. Phu nhân nói chuyện với nhũ mẫu nói về Juliet.<\/p>\n<p><em>“Tôi xin cược ngay mười bốn cái răng của tôi, mặc dầu tôi chỉ còn có bốn cái răng thôi, khổ thân tôi là cô ấy chưa đến mười bốn tuổi…”<\/em><\/p>\n<p>Cũng trong cuộc đối thoại ấy Nhũ mẫu cũng có những câu nói mà người đọc, xem phải bật cười <em>“Thưa phu nhân, vâng. Nhưng cứ nghĩ đến lúc cô ấy im bặt rồi trở lời bố cháu Ừ đấy! là tôi không nhịn được cười. Mà lúc ấy, trán đã bươu lên bằng lên bằng quả cật gà…”<\/em> Nhũ mẫu nói khiến cho C. Phu nhân bắt im đi.<\/p>\n<p>Ngay cả khi bi kịch xuất hiện thì nhũ mẫu vẫn mang đến cho người đọc có sự buồn cười <em>“Tin gì được ở bọn đàn ông, họ có lương tâm danh dự gì đâu. Toàn những kẻ thề thốt gian dối, giở mặt như giở bàn tay…”<\/em> đây là lời thoại của nhũ mẫu với Juliet khi mà Nhũ mẫu báo tin Romeo đã giết chết Tybalt.<\/p>\n<p>Đáng chú ý hơn là việc ông chăm chút gây dựng bầu không khí rạo rực, ... nhằm bao bọc, chở che, đôi uyên ương chống lại bầu không khí hận thù đang tìm kẽ hở ùa vào và nhiều lúc ông đã để cho bầu không khí trong lành kia thắng thế.<\/p>\n<p>- Cảnh Romeo và Juliet trao gửi lời hẹn ước dưới trăng (Hồi 2- cảnh 2: Vườn nhà Capulet). Sau khi vũ hội hoá trang ở lâu đài nhà Capulet, Romeo cảm thấy yêu Juliet thật sự. Chàng quay lại, trèo hàng rào vào vườn nhà Capulet, hai người gặp nhau trên ban công trò chuyện, tỏ tình và hẹn ước:<\/p>\n<p><em>Romeo: - Thưa tiểu thư, tôi xin thề dưới mảnh trăng thiêng liêng đang dát bạc trên những ngọn cây trĩu quả…<\/em><\/p>\n<p><em>Juliet: - Em xin chàng đừng lấy trăng kia thề thốt. Vầng trăng nghiêng ngả, mỗi tháng lại thay đổi đường đi lối về. Em sợ tình chàng cũng như trăng kia thay đổi.<\/em><\/p>\n<p><em>Romeo: - Tôi phải lấy gì mà thề?<\/em><\/p>\n<p><em>Juliet: - Xin chàng đừng thề nguyền chi cả. Hay nếu chàng muốn thì chàng hãy đem tấm thân tuấn nhã của chàng mà thề- đó là vị thần mà em thờ phụng và em sẽ tin chàng.<\/em><\/p>\n<p><em>Romeo: - Tôi xin thề trên linh hồn…<\/em><\/p>\n<p><em>Juliet: - Xin nghìn lần chúc chàng đêm nay tốt lành (nàng rời cửa sổ đi vào phòng) Romeo: - Thiếu ánh sáng của nàng thì đêm tối hoá muôn nghìn lần xấu xa (chậm chạp quay ra). Tình yêu đi tìm tình yêu vui như cậu bé học sinh được rời xa sách vở. Tình yêu phải xa tình yêu buồn như cậu bé quay trở lại trường.<\/em><\/p>\n<p><em>(Juliet lại xuất hiện bên cửa sổ, hai người tình tứ và hẹn ngày giờ làm lễ tuyên hôn bí mật ở nhà thờ.)<\/em><\/p>\n<p>- Khi tu sĩ Lawrence làm lễ se duyên cho họ. (Hồi 2- cảnh 6: Tu phòng của tu sĩ Lawrence)<\/p>\n<p><em>“Tu sĩ Lawrence: - Cầu trời thương cho công việc thành kính của chúng ta, để sau này khỏi gây cảnh buồn phiền.<\/em><\/p>\n<p><em>Tu sĩ Lawrence: - Thôi hãy đi theo ta, việc xong ngay đây thôi. Xin lỗi hai con, ta chẳng thể để hai con một mình với nhau trước khi Nhà thờ thiêng liêng gắn hai người là một.”<\/em><\/p>\n<p>Những lúc ấy cái bi đã bị đẩy lùi, nhường chỗ cho một không khí chứa chan niềm vui, hạnh phúc.<\/p>\n"], ["I - Thời đại:", 2, "<p>Vào thế kỉ XVIII ở Châu Âu, một trong những phương tiện khá quan trọng để làm cho cuộc sống của con người ngày càng phát triển, cải biến để nhân loại ngày một tiến bộ hơn đó chính là việc tuyên truyền, phổ biến các tư tưởng tiến bộ, nâng cao các chuẩn mực đạo đức và tri thức khoa học (chứ không phải là tôn giáo, giáo điều có sẵn). Đó là thời kì của văn học ánh sáng. Nền văn học ánh sáng mang tính chất là một nền văn học phản phong và chống tôn giáo. Ở đó, không chỉ đòi hỏi cần giải phóng cá nhân khỏi sự ngu dốt, hướng tới sự phát triển cao về trí tuệ con người mà còn là sự giải phóng cá nhân khỏi sự gò bó, ép buộc về chính trị và kinh tế. Trong thời kì văn học ánh sáng, ở Châu Âu nổi lên rất nhiều những cái tên tiêu biểu. Một số nhà văn tiêu biểu của thời kì này phải kể đến Voltaire, Goethe, Defor…Nếu văn học Hi Lạp có Homer, văn học Ý có Dante thì văn học Đức có Goethe. Người ta thường coi ông là Homer hay Dante của dân tộc Đức. Goethe được đánh giá là một trong những thi hào lớn của nhân loại. Bài viết dưới đây nghiên cứu về một tác phẩm lớn có giá trị nhất trong di sản mà Goethe đã để lại cho nhân loại, đó là kịch Faust.<\/p>\n<p>Người ta thấy rằng văn học của Goethe có ảnh hưởng khá lớn đến đời sống cũng như tư tưởng nghệ thuật của các thế hệ mai sau. Kịch Faust của ông là một tác phẩm giàu giá trị. Nghiên cứu về kịch Faust, chúng ta có thể thấy được những giá trị nhân văn sâu sắc cùng với những chiêm nghiệm sâu xa về cuộc sống, về thời đại lịch sử lúc bấy giờ. Kịch khai sáng – Faust của Goethe đã rút ra được một chân lí đó chính là hành động. Điểm sáng của tác phẩm là con đường tìm ra chân lí của Faust từ “khởi thủy là lời” đến “khởi thủy là hành động”. Đi sâu khai thác tác phẩm giá trị này, người ta phần nào thể hiểu hơn về con người, về lí tưởng của nhà văn. Đó là một lí tưởng cao đẹp, đáng quý, nhất là trong tình cảnh xã hội mà theo ông là một thế giới nhàm chán, vô vị và tẻ nhạt. Hiểu được kịch Faust, tức là người ta đã có thể hiểu hơn về trách nhiệm của mình với cuộc sống, với cộng đồng. Việc ý thức được trách nhiệm, bổn phận của mình với cuộc đời không chỉ là vấn đề cần có ở những thế hệ đi trước, mà trong bất kì thời đại nào, xã hội nào thì con người cũng phải ý thức được điều đó. Kịch Faust đánh một hồi chuông rất mạnh vào tâm thức của thế hệ trẻ ngày hôm nay. Với những ai đã và đang sống một cuộc đời vô vị, thiếu khát vọng vươn lên; có lẽ con người đó cần phải có sự thay đổi, ít nhất là thay đổi ngay từ lúc này. Giá trị của kịch Faust qua bao nhiêu năm vẫn vẹn nguyên giá trị; dành thời nghiên cứu về kịch Faust của Goethe, chúng ta sẽ được nhiều hơn là mất. Sau đây, mời bạn tìm hiểu chi tiết về giá trị của kịch Faust – một kết tinh nghệ thuật đặc sắc bậc nhất của Goethe.<\/p>\n"], ["II- Tác giả Goethe", 2, "<p>Johann Wolfgang von Goethe (28 tháng 8 năm 1749 – 22 tháng 3 năm 1832) là một nhà thơ, nhà viết kịch, tiểu thuyết gia, nhà văn, nhà khoa học, họa sĩ người Đức.<\/p>\n<p>Cha mẹ ông là người thuộc tầng lớp tư sản, là luật sư Johann Caspar Goethe và luật sư Katharina Elisabeth. Ông sinh ra trong một gia đình khá giả, chính vì vậy ông được quan tâm và có sự giáo dục một cách toàn diện, chưa bao giờ phải lo lắng về mặt tài chính. Điều kiện gia đình đã giúp ông có được những tiền đề và cơ sở thuận lợi cho quá trình học tập của mình.<\/p>\n<p>Ông được học và biết nhiều thứ tiếng khác nhau ngay từ khi còn bé: lúc 7 tuổi ông học tiếng La tinh và Hi Lạp, lên 9 tuổi thì được học tiếng Pháp, 11 tuổi thì học tiếng Italia, 13 tuổi thì học tiếng Anh và tiếng Do thái. Học được nhiều thứ tiếng như vậy không phải chỉ là thành quả của điều kiện gia đình, mà đó còn là thành quả của sự thông minh và trí tuệ hơn người của ông. Ông tiếp thu sâu sắc những thành tựu rực rỡ của nền văn học cổ kim ở Châu Âu. Tới năm 16 tuổi, ông được gửi đến trường Đại học Leipzig. Đại học Leipzig là một trong những viện đại học cổ nhất ở châu Âu; là một thành phố lớn vừa nổi tiếng, vừa là trung tâm thương mại quan trọng của Châu Âu thời kì đó.<\/p>\n<p>Nổi tiếng, to lớn là thế, nhưng nơi đây vẫn khiến cho Goethe cảm thấy chán nản, chật chội, nặng nề. Ông nhận thấy được sự bê tha, xuống cấp của tầng lớp sinh viên; sự bế tắc, lỗi thời trong phương pháp và nội dung dạy học của ngôi trường đại học này. Nhận thức của ông được gửi gắm thông qua tác phẩm kịch nổi tiếng của ông – Faust. Faust tái hiện lại một cách sống động, chân thực những cảnh sinh hoạt và những bi kịch của con người trong môi trường đại học ấy. Trong hồi kí “Thơ và sự thật”, Goethe đã từng viết: “Do sự hiểu biết hạn chế của tôi, do tính thờ ơ của bạn bè, do sự lạc hậu của thầy giáo và sự sống tách biệt của những người dân có học thức, do cảnh vật thiên nhiên rất không đáng kể, cho nên tôi buộc phải tìm tất cả ở trong tôi. Nếu tôi muốn cho thơ của mình có một cơ sở thật sự, một cảm xúc hay một ý nghĩ, thì tôi phải tìm nó ở trong lòng”.<\/p>\n<p>Goethe là gương mặt điển hình của văn chương Đức đã thoát khỏi trường phái cổ điển (cuối thế kỷ XVIII - đầu thế kỷ XIX). Sự thay đổi của ông cũng trùng khớp với thời kỳ khai sáng và chủ nghĩa lãng mạn. Chính vì thế, sức ảnh hưởng và lan tỏa của ông đối với nền văn chương thế giới, đặc biệt là ở châu Âu là vô cùng lớn. Goethe đã để lại cho sự nghiệp văn học Đức với hơn 100 tác phẩm, ở nhiều thể loại khác nhau như thi ca, kịch, văn xuôi, dịch thuật, phê bình… Các sáng tác của ông đều rất nổi tiếng và giàu giá trị; đều là những áng thơ văn trường tồn cùng với thời gian.<\/p>\n<p>Ông là người khá sâu sắc và có nhiều câu nói nổi tiếng. Ví dụ như: “Knowing is not enough; we must apply. Willing is not enough; we must do - Biết là không đủ; chúng ta cần phải áp dụng. Ý muốn là không đủ; chúng ta cần phải thực hiện.”. Hay như: <em>“If your treat an individual... as if he were what he ought to be and could be, he will become what he ought to be and could be - Nếu bạn cứ chỉ luôn nhìn vào mặt xấu của một ai đó, điều đó sẽ làm anh ta ngày càng trở nên tồi tệ hơn. Nhưng nếu khuyến khích anh ta vươn tới những điều tốt, chắc chắn anh ta sẽ làm được.”<\/em> Những câu nói của ông đã thể hiện phần nào được tính cách, tư tưởng trong con người của ông; trở thành nguồn cảm hứng khá mạnh mẽ cho các thế hệ sau này. Đến với các sáng tác của ông, đặc biệt là qua kịch Faust, người ta thấy được lí tưởng của một con người luôn coi trọng hành động, luôn khao khát vươn lên được cái hạn hẹp, tầm thường để sống một cuộc đời ý nghĩa, cao đẹp hơn.<\/p>\n"], ["a. Vị trí:", 3, "<p>Có thể nói, kịch Faust là tác phẩm lớn có giá trị nhất trong di sản văn học mà Goethe đã để lại cho nhân loại. Faust là một kiệt tác của văn học thế giới và thường được đưa lên sân khấu kịch. Vì dung lượng của tác phẩm gồm 12.111 câu, có phần hơi dài và vượt ra khuôn khổ của một vở kịch, nên một số trường hợp người ta coi<\/p>\n<p>Faust là trường ca. Bài viết dưới đây vẫn tìm hiểu Faust như một tác phẩm kịch giàu giá trị, là “sáng tạo lớn nhất của tinh thần thơ ca” (Puskin), là Iliad của thời đại mới. Khi bình luận về kịch Faust, trong thơ của Schiller gửi Goethe vào ngày 23/6/1796 đã viết: <em>“Tính chất hai mặt của cá tính con người và sự cố gắng bất hạnh nó lại hợp nhất cái thần thánh và cái rất con người ở ngay trong cơ thể con người, điều đó người ta không thể bỏ qua được, vì rằng cốt truyện không và không phải đi theo một thể loại văn học nào cả, nhưng nó lại đi và phải đi tới ánh sáng chói chang của chân lý, do đó người ta không nên dừng lại ở đề tài câu chuyện, mà nó cần đi xa hơn nữa, tới tư tưởng của tác phẩm.”.<\/em> Khi bàn về kịch Faust, chính Goethe cũng có nhận xét rằng: “<em>Cốt truyện chẳng có gì quyến rũ lắm ấy cứ sống lại trong tâm hồn tôi với những nét đa dạng<\/em> - Trích trong tập Thi ca và sự thật”.<\/p>\n"], ["b. Bố cục:", 3, "<p>Kịch Faust có thể chia thành hai phần lớn. Phần I của bi kịch Faust được ra mắt độc giả vào năm 1808, phần II thì được hoàn thành vào năm 1832, trước khi tác giả từ biệt cõi trần gian.<\/p>\n<p>Kịch Faust là sản phẩm của sự lao động miệt mài, không ngừng nghỉ trong suốt cuộc đời sáng tạo nghệ thuật của Goethe. Faust chính là kiệt tác kết tinh tư tưởng, là đứa con tinh thần đáng quý của tác giả.<\/p>\n<p>Kịch Faust tổng cộng có 5 hồi, được viết bằng thơ, bao gồm 12111 câu thơ. Ông viết kịch Faust không theo trình tự các hồi, mà có sự xáo trộn. Ông viết hồi 3 trước (nói về bi kịch Helen), rồi mới viết các hồi 1, 2, 4. Còn hồi thứ 5, cũng là hồi cuối cùng thì được ông viết và hoàn thành vào ngày 22/7/1831. Goethe mất vào năm 1832, có thể thấy kịch Faust chính là tác phẩm gắn với hành trình cuối cùng của ông trên cuộc đời. Điều đó đủ để thấy được sự đặc biệt, ý nghĩa sâu sắc mà tác phẩm đem lại đối với chính cuộc đời của tác giả, hay cũng chính với độc giả. Kịch Faust có thể tóm tắt với 2 phần chính là Faust I và Faust II.<\/p>\n"], ["2. Tóm tắt kịch Faust", 3, "<p>Nhân vật chính của tác phẩm là Faust. Faust là một học giả thông minh, luôn miệt mài với công cuộc nghiên cứu khoa học của mình. Tuy vậy, chàng vẫn chưa thỏa mãn với điều đó. Chàng cho rằng kiến thức của mình còn quá hạn hẹp, sự thông minh của mình cũng chỉ đến thế mà thôi. Chàng tự thấy mình đã học đủ bốn khoa của trường đại học, có mười hai năm làm giáo sư, vậy mà sự thông minh vẫn chỉ như cũ. Lợi dụng lúc Faust đang băn khoăn, bế tắc, quỷ Mephisto đã hiện lên. Quỷ Mephisto đội lốt một con chó rồi chuyển hóa thành người. Vậy là giữa Faust và quỷ đã diễn ra một màn đánh cược. Quỷ Mephisto hứa với Faust là sẽ làm cho chàng thỏa mãn được mọi mong muốn, thú vui ở trên đời. Còn Faust, chàng vẫn luôn tin tưởng bản thân là một con người luôn cố gắng vươn lên, luôn khao khát được chinh phục cái mới, nên thành quả trong công việc của chàng chưa bao giờ là thỏa mãn, là điểm dừng. Chàng sẵn sàng bán linh hồn cho quỷ Mephisto, chuẩn bị khăn gói lên đường cùng quỷ để bước sang một thế giới mới. Quỷ đưa chàng vào cuộc đời trần tục, đầu tiên là tới quán trọ. Hắn đưa Faust đến đây để chứng kiến cảnh sinh hoạt bê tha của đám sinh viên. Sau đó quỷ dẫn Faust đến nhà mụ phù thủy; mụ phù thủy cho Faust uống thuốc để trở lại thành một anh chàng hai mươi tuổi trẻ trung. Rồi Faust cùng với quỷ đi dạo phố, tại đây chàng đã gặp Margarete, một cô bé 14 tuổi xinh xắn, sinh ra trong một gia đình nghèo khó. Faust và Margarete đã nảy sinh tình cảm với nhau, đó cũng là khởi nguồn của bi kịch tình yêu Margarete: mẹ Margarete chết vì lọ thuốc mê mà quỷ sứ trao cho Faust; anh trai của cô cũng bị Faust dùng kiếm của quỷ đâm chết. Lúc đó, Margarete đã có thai với Faust. Thế nhưng cô gái ấy lại rơi vào tình trạng bỏ rơi con của mình và sa vào tù tội. Chỉ vì sợ miệng lưỡi của thế gian, Margarete phải vứt lại con ở một vũng nước trong rừng. Đó cũng chính là lí do mà cô bị bọn thống trị bắt giam và chờ ngày để xử tử. Quỷ Mephisto dùng thú vui xác thịt để Faust có thể quên đi Margarete. Thế nhưng, chàng không thể nào quên được, và bắt quỷ phải đưa mình vào nhà giam để cứu được cô ấy. Thế nhưng, Margarete lại nhất định không chịu theo chàng ra ngoài. Trên đây là nội dung cơ bản của Faust I.<\/p>\n<p>Mở đầu Faust II là khung cảnh thiên thần múa hát say sưa. Nơi tiếp theo mà quỷ đưa chàng đến đó là triều đình. Tại đây, chàng chứng kiến được tình trạng thê thảm, bê tha của bọn vua quan: lương thực cạn kiệt, ngân khố trống rỗng, binh lính đào ngũ, giặc ngoại xâm lăm le dòm ngó ngoài biên giới. Vua ngỏ ý muốn được nhìn thấy mặt Helen nên Faust đã làm phép và triệu được nàng từ cõi âm trở về. Trước vẻ đẹp của Helen, Faust dường như bị mê mẩn. Thế nhưng, Helen lại biến mất khiến Faust phải mượn tiểu hình nhân của Wagner làm người dẫn đường. Faust cùng quỷ đi về thế giới Hi Lạp cổ đại và đã tìm được Helen. Hai người lấy nhau và có một người con, đặt tên là Euphorion. Nhưng đứa con vì nhảy cao quá mà cũng chết. Helen ôm xác đứa con bay về thiên đường, để lại cho Faust một tấm áo. Tấm áo này đã hóa thành đám mây đưa Faust và quỷ Mephisto về cõi dương ở phương Bắc. Được sự giúp đỡ của quỷ, Faust đã thành công đánh tan được giặc ngoại xâm và được vua ban thưởng một phần đất hoang trên bờ biển. Khi về già, Faust tiến hành công cuộc khai khẩn vùng đất này nhưng quỷ sứ ra sức ngăn cản. Quỷ lo lắng đã hà hơi khiến Faust bị mù lòa. Điều đó đã dẫn tới cái chết của chàng, vì chàng đã lầm tưởng những con người đi đào huyệt theo lệnh của quỷ sứ là những người dân đang lao động sản xuất. Chàng cảm thấy thỏa mãn và vui mừng về thành quả lầm tưởng ấy. Sau sự nhầm lẫn ấy, quỷ Mephisto đã mở cửa để bắt linh hồn Faust xuống địa ngục, nhưng may mắn rằng thiên thần đã kịp đưa linh hồn của chàng lên thiên đường.<\/p>\n"], ["1. Màn giáo đấu trên sân khấu và trên thiên đường", 3, "<p>Trước khi đi vào bi kịch Margarete, phần đầu tiên của vở kịch là một bài thơ “Đề tặng” bao gồm 32 câu. Tiếp đến, tác giả xây dựng một màn kịch với cuộc đối thoại giữa giám đốc nhà hát, nhà soạn kịch và một diễn viên hề. Tuy chưa đi sâu vào các tình tiết chính trong vở kịch, nhưng đây là phần không thể thiếu và có giá trị tư tưởng rất cao. Phần mở đầu được Goethe viết với mục đích nhằm giải thích lí do viết vở kịch này, cũng như việc sẽ định hướng, mở màn cho các sự kiện, tình tiết tiếp theo của vở kịch. Cuộc đối thoại diễn ra khá gay cấn, trong “Màn giáo đấu trên sân khấu” các nhân vật đưa ra quan điểm của mình và cố gắng phản bác, bảo vệ cho luận điểm của mình. Giám đốc nhà hát đưa ra quan điểm của mình đó là <em>“rất muốn làm hài lòng công chúng, đặc biệt là vì họ sống và để cho chúng ta cùng sống”.<\/em> Yêu cầu của ông ta đó là: <em>“đặc biệt là phải diễn ra cho thật nhiều chuyện, người ta đến đây là để được xem, người ta chỉ muốn nhìn thôi”.<\/em> Trước cái thị hiếu tầm thường ấy, nhà thơ đã phản bác lại ngay, ông cho rằng:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Ở đây, nhà thơ khá coi trọng đến những thứ có thể tồn tại mãi và có giá trị với thế hệ mai sau. Nhà thơ cho rằng cái hào nhoáng, xa hoa bề ngoài sẽ chỉ được sinh ra để thỏa mãn những giây phút ở hiện tại chứ không hề có giá trị lâu dài. Chỉ có những thứ chân chất, thật thà thì mới tồn tại mãi mãi và có giá trị thực tiễn với thời gian, với thế hệ mai sau. Sau luận điểm của nhà thơ, nhân vật hề lên tiếng rằng: “Giả sử tôi cũng lại nói đến thế hệ mai sau, Thì còn ai làm vui cho những người đang sống.”. Qua ý kiến của các nhân vật, có lẽ nhà văn Goethe muốn bày tỏ quan điểm của mình về sáng tác văn học của mình. Có lẽ cả ba nhân vật trên đều có cái đúng của mình, chỉ là cái đúng ấy chưa thực sự toàn diện và hoàn hảo. Do vậy, thống nhất ba ý kiến trên, Goethe giúp người ta nhận ra rằng: Quá trình sáng tạo tác phẩm nghệ thuật trước mặt phải phục vụ đời sống tinh thần, phải thỏa mãn nhu cầu của người thưởng thức, đồng thời cũng phải mang giá trị của thời đại, trường tồn cùng với thời gian. Sáng tạo nghệ thuật không phải là những sản phẩm tầm thường, vô giá trị, mà nhất định nghệ thuật phải vì con người, vì sự tiến bộ của loài người.<\/p>\n<p>Sau màn giáo đấu trên sân khấu là màn giáo đấu trên thiên đường. Ở cảnh này, các nhân vật xuất hiện bao gồm Thượng đế và các thiên thần. Cảnh diễn ra ở đây đó là lúc các thiên thần đang ca ngợi kì công sáng tạo của Thượng đế - Đấng tối cao. Giữa cảnh ấy, quỷ Mephisto đã xuất hiện, hắn phàn nàn về thế giới loài người với cái lí trí làm cho mình thú vật hơn mọi loài vật. Bản chất của quỷ là đối nghịch với cái lí trí đúng đắn của loài người. Chúa trời đã hỏi quỷ Mephisto rằng có biết Faust không. Và hơn ai hết, hắn biết rất rõ về Faust. Quỷ coi chàng là một gã điên tồi tệ vì có một trái tim luôn khao khát khám phá, một lí trí cao cả, một nỗ lực không ngừng nghỉ để vươn lên. Quỷ Mephisto rất bất bình với cái ý thức mạnh mẽ của Faust, hắn đã đánh cược với Chúa rằng sẽ đẩy đưa Faust vào con đường sai trái cho bằng được. Trong đánh giá của Chúa, Faust luôn là một người tốt, Ngài khẳng định rằng: <em>“Chừng nào hắn còn sống nơi đương gian. Con người còn nỗ lực vươn lên thì còn mắc sai lầm”.<\/em> Chúa tin tưởng Faust: <em>“Một con người tốt thì ngay trong phút giây ham say đen tối, Vẫn ý thức được con đường đúng đắn phải đi”.<\/em> Chúa đã nhận thức rất rõ và rất chắc chắn về con người của Faust. Đó cũng là niềm tin mà Chúa đã dành tặng cho con người. Mọi cám dỗ, mật ngọt có thể làm cho con người phút chốc sa ngã, ham mê nhưng tuyệt nhiên sẽ không thể khiến cho những người tốt mất đi ý thức của mình. Đã là người tốt, họ sẽ rất sáng suốt, họ biết tránh xa những cám dỗ bủa vây để giữ vững được sự ngay thẳng, con đường đúng đắn mà mình cần phải đi. Niềm tin của Chúa cũng được coi như một lời động viên đối với những ai đã và đang đứng trước những cám dỗ của cuộc đời. Đó là hay giữ vững lí trí của mình, một người tốt thực sự sẽ không bao giờ bị những thứ phù phiếm che mờ mắt của mình.<\/p>\n<p>Nếu cuộc đời không có thử thách, không có khó khăn thì quả thực khá nhàm chán. Cuộc sống này cũng đâu trải đầy hoa hồng trước mắt, thật khó để cuộc đời có thể suôn sẻ và không có cám dỗ nào. Bởi vậy, Chúa cho rằng quỷ sứ cũng là một nhân tố khá cần thiết cho con người. Quỷ sứ vây bám buộc con người phải mạnh mẽ, can đảm để vượt qua cám dỗ, giữ vững được sự ngay thẳng, giữ vững được mục tiêu mà mình đề ra. Không có quỷ sứ, con người sẽ không biết nỗ lực để đấu tranh và vượt qua chúng để tìm kiếm những thành công. Chúa đã đưa ra lí do cho sự xuất hiện cần thiết của quỷ sứ:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Lí do xuất phát từ chính hoạt động của con người. Do hoạt động của con người thường hay uể oải; con người chỉ mong muốn được nghỉ ngơi sớm nên sinh ra sự lười biếng. Bởi vậy, quỷ sứ xuất hiện giống như một thử thách khiến con người gạt bỏ đi sự lười biếng để biết nỗ lực vươn lên. Thông qua các màn giáo đầu trên sân khấu và trên thiên đường, Goethe đã phần nào dẫn dắt được tác phẩm đi đúng hướng. Tác giả hướng bạn đọc đến sự nhìn nhận về một sản phẩm nghệ thuật đích thực; đồng thời định hướng nội dung của vở kịch sẽ viết về ai, về điều gì. Faust là nhân vật được xuất hiện thông qua cuộc giáo đầu ở trên thiên đường nhưng lại là nhân vật chính được tác giả triển khai và xây dựng hình tượng, cuộc đời cụ thể. Màn đánh cược của quỷ Mephisto với Chúa cũng xoay quanh nhân vật trung tâm là Faust. Qua đó, người ta tự hình dung ra được những điều mà tác giả muốn xây dựng, diễn biến vở kịch của tác giả sẽ là hành trình quỷ Mephisto mê hoặc Faust theo đúng như những gì đánh cược với Chúa. Và quả thực là như thế, diễn biến tiếp theo của vở kịch chính thức có sự xuất hiện của nhân vật Faust – nhân vật chính của vở kịch.<\/p>\n"], ["2.1. Thế nào là “Khởi thủy là lời”, “Khởi thủy là hành động”?", 4, "<p>Trước khi khai thác sự chuyển đổi trên, ta cần làm rõ một vài khái niệm. Thứ nhất, thế nào là “khởi thủy là lời”? Khởi thủy được coi là cái đầu tiên, cái trước hết. Người ta thường gắn khái niệm này với một giai đoạn, gọi là giai đoạn khởi thủy. Còn “lời” ở đây tượng trưng cho lời nói của con người. Khởi thủy là lời, tức là cái đầu tiên cần có phải là lời nói, là yếu tố về ngôn ngữ, giao tiếp của con người. Còn “Hành động” được hiểu là hoạt động, là kết quả của sự vận động, làm việc của con người. Từ “khởi thủy là lời” đến “khởi thủy là hành động” là một quá trình thay đổi về nhận thức và tư duy của con người. Đó cũng chính là cái chân lí mà Faust đã tìm thấy được trong hành trình khám phá thế giới của mình. Trong vở kịch, để đi đến ý tưởng “Khởi thủy là hành động”, Faust đã đắn đo, trăn trở về một vài cách hiểu. Đó là các cách hiểu như “Khởi thủy là lời”, “khởi thủy là tư duy” hay “khởi thủy là sức mạnh”. Các cách hiểu này đều có những nguyên do chính đáng và hợp lí. Lời nói, tư duy nhận thức hay nguồn sức mạnh đều rất cần thiết để con người có thể vươn lên, vượt qua giới hạn của bản thân mình. Thế nhưng, Faust bỗng nảy sinh ý tưởng<\/p>\n<p>“Khởi thủy là hành động” và chàng đã cầm bút viết ngay mà không hề mảy may trăn trở. Có lẽ, chàng thấy rõ được vai trò và tầm quan trọng của hành động. Chỉ có hành động mới khiến cho con người thực sự thay đổi. Những thứ như lời nói, tư duy…chỉ đơn thuần là những thứ tồn tại một cách tĩnh lặng; thiếu đi sự tác động của con người thì chúng chỉ là những thứ lí thuyết suông, những thứ không tồn tại thực tiễn trong đời sống của con người. Ở đây, ta lại chợt nhớ tới quan điểm về sáng tạo nghệ thuật của Goethe. Chỉ có những thứ chân chất, thực tiễn; phục vụ cho thế hệ mai sau thì mới trường tồn với thời gian. Những cái hào nhoáng bên ngoài, những thú vui chốc lát sẽ chỉ là những thứ chợt đến rồi chợt đi. Duy chỉ có hành động thì giá trị của sáng tạo nghệ thuật mới thực sự được nâng lên. “Khởi thủy là lời” phải chăng cũng khá là cần thiết. Bởi trước khi làm một điều gì đó, chúng ta luôn cần vạch ra cho mình định hướng, con đường đúng đắn để đi. Thế nhưng, với nhân vật Faust, khởi thủy là lời dường như chưa thực sự thỏa mãn. Một con người luôn cảm thấy bế tắc, tù túng với những kiến thức sách vở khô khan, nằm sẵn trên trang giấy sẽ không cảm thấy bằng lòng với lời nói thay vì những hành động. Faust coi trọng hành động, coi trọng sức lao động của con người. Đó cũng chính là lí do mà chàng quyết định mình phải đứng lên, tìm cách gì đó để vượt qua được sự bế tắc, cùng đường của chính mình trên con đường tìm kiếm những miễn kiến thức mới. Như vậy “khởi thủy là hành động” chính là chân lí, là mục tiêu mà Faust theo đuổi trong suốt cuộc đời của mình. Đó cũng là chân lí mà Faust tìm kiếm trong suốt diễn biến của vở kịch.<\/p>\n"], ["2.2. Nhân vật Faust", 4, "<p>Như đã biết từ trên, vở kịch xoay quanh nhân vật chính đó là Faust. Faust là một chàng trai thông minh, tài giỏi, thế nhưng chàng vẫn luôn cảm thấy bất lực vì kiến thức của mình cũng chỉ đến vậy, sự thông minh của mình cũng chỉ như thế mà thôi. Lời của Faust vang lên như một sự bất lực, tuyệt vọng:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Có thể thấy Faust là con người không bao giờ thỏa mãn với những thành quả của bản thân. Chàng đã học và nghiên cứu đầy đủ cả bốn môn triết học, luật học, y học và cả thần học ở trong trường đại học. Chàng được người ta gọi là giáo sư, tiến sĩ; là người truyền đạt lại kiến thức của biết bao những thế hệ nối tiếp. Vậy mà 12 năm trời ấy, chàng vẫn cảm thấy chưa đủ hài lòng. Bởi chàng luôn khao khát được khám phá kiến thức mênh mông, vô tận của cuộc sống. Chàng ý thức rất rõ được những gì mà bản thân chưa thể với được. Nhìn qua, có vẻ Faust là một con người khá ngông cuồng và tự cao. Thành tích của chàng đâu phải muốn có là có được, đâu phải ai cũng có khả năng và bản lĩnh như chàng. Nhưng đằng sau cái vô lí, ngông cuồng ấy, người ta nhận ra ở con người này bản lĩnh, ý chí và khát khao cháy bỏng chiếm lĩnh thế giới. Cuộc sống này là vô tận, kiến thức mà con người biết được chỉ giống như một hạt cát giữa sa mạc rộng lớn. Đó chính là lí do mà Faust không bao giờ dừng lại, chàng đã bắt đầu hành động để vượt qua giới hạn của bản thân.<\/p>\n<p>Sau khi ngồi trong phòng làm việc, tự mình kiểm điểm lại những thiếu sót của bản thân, Faust quyết định mình phải làm điều gì đó để thay đổi. Chàng đã quyết định dùng đến con đường ảo thuật để có thể khám phá được những kiến thức mới trong trời đất. Nhưng thần Trái Đất lại hiện lên và với một thái độ rất phũ phàng khiến cho Faust cảm thấy tuyệt vọng vô cùng. Thần Trái Đất cho rằng, Faust không thể nào sánh được với tầm vóc của thần. Thần phũ phàng cho rằng chàng chỉ là một kẻ tầm thường. Thần Đất là đại diện cho sức mạnh phi thường, siêu nhiên mà con người chưa thể khám phá và lí giải được. Kiến thức của Faust vẫn chỉ là hữu hạn, nhỏ bé, tầm thường, hạn chế so với sự siêu nhiên của thần. Hiểu được điều đó, chính Faust cũng phải thốt lên:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Faust đã quá chán ngấy với lối học kinh viện trong nhà trường, những “lí thuyết xám ngắt” mà chỉ muốn rời bỏ nó để tìm về “cây vàng của cuộc đời tươi xanh”. Quá chán chường với cuộc đời, Faust đã có lúc muốn tự tử. Faust muốn nâng cốc thuốc độc mình đã pha sẵn để kết liễu cuộc đời mình nhưng tiếng chuông Nhà thờ vang lên báo hiệu ngày lễ Phục sinh đã tới, khao khát được sống lại trở về trong Faust. Có lẽ, muốn chết là biểu hiện cao nhất của niềm mong ước được sống. Niềm mong ước sống một cuộc đời có nghĩa không cho phép Faust chấp nhận sống một cuộc đời nhàm chán, vô vị và tẻ nhạt. Hẳn là Faust đã quá tuyệt vọng, bất lực với chính mình. Chính trong giây phút tuyệt vọng ấy, quỷ Mephisto đã đội lốt một con chó đen để tìm cách mê hoặc chàng Faust. Con chó đen đi theo Faust vào phòng làm việc rồi chuyển hóa thành người. Hắn đề nghị với Faust điều kiện là sẽ khiến Faust được thỏa mãn mọi mong muốn của mình, đem lại cho Faust sự hài lòng với cuộc sống. Vậy là một màn đánh cược đã diễn ra, Faust đánh cược với quỷ Mephisto rằng nó sẽ không bao giờ có thể ngăn cản được ý chí vươn lên, nỗ lực không ngừng nghỉ của chàng. Chàng tự biết rằng mình sẽ không bao giờ cảm thấy thỏa mãn với những gì bản thân đạt được. Chàng đã cược với quỷ rằng:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Vậy là Faust đã đánh cược cả mạng sống của mình để bảo vệ lẽ sống vươn lên của mình. <em>“Hỡi thời khắc, hãy khoan chân, mi đẹp quá”<\/em> là sự chấp nhận thực tại, thỏa mãn với thực tại. Đây chính là câu nói mà Faust nghĩ rằng mình sẽ không bao giờ có thể nói ra. Nhưng tới cuối vở kịch, Faust lại chết vì chính câu nói đó. Hiểu lầm rằng tiếng những người dân đang dùng cuốc xẻng để đào huyệt thành cảnh những người dân đang hăng say lao động sản xuất, Faust đã thốt lên một câu: “Đẹp quá thời gian ơi ngừng lại”. Vậy là chàng đã đi ngược lại với lời đánh cược của mình, trở thành kẻ thua cuộc trước quỷ Mephisto.<\/p>\n"], ["2.3. Cậu học trò Wagner", 4, "<p>Vở kịch còn đưa ra một nhân vật khá đối lập với Faust. Đó là cậu học trò Wagner. Wagner là một người rất ham học hỏi nhưng anh ta lại chỉ biết vùi mình vào sách vở. Anh ta rất giỏi về ngón tầm chương trích cú. Thời gian của anh ta chủ yếu đầu tư vào việc học, ngay cả khi đi dạo chơi ngoài đồng cùng với Faust, anh ta cũng sợ phí thời gian. Gã đam mê học đến nỗi, đêm khuya vẫn đến để xin lĩnh hội kiến thức của Faust vì nghĩ rằng chàng vừa nghiên cứu ra được điều gì mới. Cậu học trò này khiến Faust cảm thấy rất chán, vì lí tưởng của hai người khác nhau. Một người thì đam mê khám phá những điều mới mẻ, chưa từng được ai khai thác; một người thì tôn sùng sách vở, cố gắng học hỏi hết những thứ mà người đi trước để lại. Cả hai khát vọng đều đáng được trân trọng, tuy vậy chúng vẫn không tìm thấy điểm chung. Nhân vật Wagner giống như một nhân vật kích thích sự thay đổi và hành động của Faust. Việc chán ngấy kiến thức đại học, chán ngấy phong cách học tập của học trò, Faust mới có thể đứng lên để tìm cách, hành động để thay đổi nhận thức của chính mình. Wagner đại diện cho những kiến thức cũ kĩ, lặp đi lặp lại trên giảng đường đại học. Với Faust, Wagner chỉ giống như:<\/p>\n<blockquote>\n<p><em>Một cái đầu chỉ quen bám lấy những vật không hồn Biết bao hi vọng không tiêu tan hỏi nó! Với bàn tay thèm thuồng, hắn bới tìm kho của Và vui mừng khi bắt được con giun.<\/em><\/p>\n<\/blockquote>\n<p>Việc xây dựng nhân vật Wagner này càng làm sáng lên khát vọng có thể vươn lên của Faust. Có lẽ, Wagner là nhân vật đại diện cho tầng lớp sinh viên bấy giờ. Đó là thế hệ sinh viên thụ động; coi trọng lí thuyết sách mở hơn là việc tự nghiên cứu để phát triển bản thân. Cách học của Wagner không phải là sai, nhưng
