 cách đó có phần nhàm chán và có khả năng làm trì trệ kiến thức. Thử nghĩ xem, nếu thế hệ học trò nào cũng như Wagner, cũng chỉ biết học và làm theo thế hệ đi trước, thì kiến thức sẽ không được vận động; làm sao con người có thể khám phá được hết những kiến thức mênh mông, vô tận trong cuộc sống. Ngay ở những diễn biến tiếp theo của vở kịch, Goethe đã khéo léo cho thấy được sự thay đổi của Wagner. Thời gian trôi qua,<\/p>\n<p>Wagner sau này đã trở thành một giáo sư. Tuy chưa phải là sự thay đổi để đến với khát vọng cháy bỏng như Faust, nhưng ít nhất, cậu học trò Wagner cũng có sản phẩm nghiên cứu riêng của mình. Đó là tiểu hình nhân Homoculus. Chính tiểu hình nhân ấy đã làm người dẫn đường giúp Faust và quỷ Mephisto có thể trở về thế giới Hi Lạp cổ đại và gặp lại được Helen. Nhưng tiểu hình nhân ấy cũng chỉ đại diện cho kiến thức sách vở. Ra khỏi phòng thí nghiệm, tới đám cưới của con vua Thủy tề thì tiểu hình nhân lại chết. Hình ảnh đám cưới tượng trưng cho cuộc sống xanh tươi. Điều đó có nghĩa, trong cuộc sống ấy, những thứ tri thức sách vở như vậy sẽ không có giá trị và sẽ mau chóng bị phá hủy.<\/p>\n"], ["2.4. Quỷ Mephisto", 4, "<p>Quỷ Mephisto – con quỷ của địa ngục là một nhân vật quan trọng trong quá trình thay đổi nhận thức của Faust. Với một con người không bao giờ hài lòng và thỏa mãn về cuộc sống như Faust, quỷ Mephisto sẽ giống như một mồi lửa châm ngòi cho ngọn lửa trong Faust bùng cháy. Nếu trước đây, Faust xuất hiện như một con người tâm trạng trong căn phòng làm việc với đầy sự bất lực; thì trước sự xuất hiện của quỷ, Faust buộc phải thay đổi thành con người hành động. Bản chất của quỷ Mephisto được tái hiện như sau:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Như vậy, bản chất của quỷ chính là cái ác. Nhiệm vụ của nó là phá tan đi những khát vọng, ước mơ cao đẹp của con người; nó dẫn dắt con người đi tới điều ác, điều sai trái. Nhưng với Faust, quỷ Mephisto lại chính là một phép thử lớn, là một thử thách lớn mà chàng vô cùng muốn mình đối mặt và vượt qua. Quỷ sứ chính là hiện thân cho những tiêu cực, cái lầm lạc, cái thú vui tầm thường:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Đứng trước Mephisto, Faust hoàn toàn cảm thấy vui vẻ, chàng sẵn sàng đón nhận thử thách. Có lẽ rằng, chàng đã tìm thấy được sự thay đổi của chính mình. Thay vì bất lực, buông xuôi tìm đến cái chết, chàng đã biết hành động để làm phong phú thêm cuộc đời của mình. Cái cốt lõi mà Faust thấy được ở đây chính là vai trò của hành động. “Hành động” khiến Faust cảm thấy vui vẻ hơn, khiến cuộc đời của chàng bước vào một hành trình mới – một hành trình bí hiểm, đầy rẫy những thử thách nhưng vô cùng thú vị và ý nghĩa. Đây chính là bước đầu cho thấy sự biến đổi, chuyển dịch từ “khởi thủy là lời” để trở thành “khởi thủy là tư duy, là sức mạnh” và đi đến kết luận <em>“<\/em>khởi thủy là hành động”. Chính những tư duy, lời nói của Faust là động lực to lớn để chàng có thể hành động. Chàng nhận ra rằng, những gì thuộc về suy nghĩ, tư duy nếu không biết đưa vào hành động thì thực sự không có ý nghĩa gì cả.<\/p>\n<p>Bởi vậy việc đi đến “khởi thủy là hành động” của Faust hoàn toàn là có căn cứ hợp lí. Việc thực hiện giao kèo với quỷ sứ cho thấy sự quyết tâm của Faust trên con đường tìm kiếm tri thức và tìm kiếm giới hạn của bản thân. Đặt trong bối cảnh xã hội phong kiến của nước Đức bấy giờ, cuộc giao kèo còn giống như cuộc đấu tranh để chống lại xã hội ấy. Đó là cái xã hội phong kiến lạc hậu, nền học vấn hạn hẹp, bế tắc. Đó là một cái xã hội mà giáo sư, tiến sĩ cũng phải bất lực vì khả năng hạn hẹp của mình. Một người thông minh, học cả bốn bằng đại học, là giáo sư, tiến sĩ như Faust cũng trở nên bất lực. Đó là một xã hội cần được cải tạo, cần phải thay đổi. Faust thực hiện cuộc giao kèo cũng như bày tỏ sự bất bình của mình trước thực tại. Chàng khao khát sẽ có được sự thay đổi trong tương lai. Nhà văn Goethe dường như đã dùng nhân vật Faust để có thể nói lên tiếng nói của mình. Ông luôn khao khát hướng tới thay đổi thực tại, luôn khao khát được khám phá những điều mới mẻ. Ông đặt niềm tin vào tương lai, vào một thế giới mà ở đó, con người có thể tiến bộ, văn minh hơn. Như vậy, tác giả đã khéo léo biến cuộc giao đấu giữa một con người với quỷ để gián tiếp thể hiện cuộc đấu tranh của cả xã hội với cả một thời đại bấy giờ. Đó chính là dụng ý nghệ thuật của Goethe. Quả thực, sáng tác của Goethe không chỉ nằm trong trang sách mà luôn có ý nghĩa thực tiễn, luôn hướng tới giá trị nhân văn.<\/p>\n"], ["2.5. Bi kịch Margarete.", 4, "<p>Bi kịch Margarete xuất hiện trong Faust I. Để bắt đầu tham gia “hành động”, Faust chuẩn bị khăn gói và cùng quỷ sứ đi tới một vài địa điểm. Quỷ Mephisto đã cố ý đưa Faust tới những nơi có cảnh bê tha của con người, nhằm làm mờ đi khát vọng nỗ lực của Faust. Nơi đầu tiên mà Faust đến là quán trọ. Tại nơi đây, Faust được chứng kiến cảnh sinh hoạt bê tha, cẩu thả của tầng lớp sinh viên. Quỷ Mephisto định quyến rũ Faust bằng những cuộc vui vô bổ, hát hò, nhậu nhẹt. Đây là kiểu dùng vật chất để cám dỗ Faust, nhưng nó lại quá tầm thường so với chàng. Faust không thích và đã đứng ngoài mà không vào. Còn quỷ Mephisto thì tham gia cuộc vui và hát bài ca con bọ chó. Bỗng nhóm sinh viên nhận ra Mephisto là quỷ và toan dùng dao tấn công hai người. Nhờ pháp thuật của Faust, hai người đã kịp thời trốn thoát. Hai người đã rời đi trong sự sửng sốt, bàng hoàng của đám sinh viên: « Ai bảo đời này không có phép màu? ». Sau đó, quỷ dẫn Faust đến nhà mụ phù thủy. Tới nhà bếp các nữ phù thủy cho Faust uống một loại thần dược, ban đầu Faust từ chối. Nhưng trước sự nỉ non của quỷ sứ, Faust đã nghe theo. Chàng nhìn thấy hình ảnh của một người phụ nữ đẹp trong một chiếc gương vỡ. Khát vọng tình yêu vực dậy bởi sức mạnh của thần dược, chàng nhìn người phụ nữ nào cũng thấy đẹp. Mụ phù thủy cho Faust uống thuốc và trẻ lại thành một thanh niên hai mươi tuổi. Cũng chính từ đây, trong một lần dạo phố, Faust đã gặp Margarete. Và bi kịch Margarete đã bắt đầu.<\/p>\n<p>Margarete là một cô bé 14 tuổi, là con một nhà nghèo, xinh xắn. Đó là một cô gái ngây thơ, trong trắng. Cuộc gặp gỡ giữa Faust và cô gái này cũng là do quỷ Mephisto sắp xếp nhằm quyến rũ, mê hoặc chàng. Quỷ toan tính rằng sẽ khiến cho Faust vì tình yêu mà từ bỏ con đường khám phá tri thức của mình. Faust thực sự đã đem lòng yêu cô gái nhỏ này. Và cùng với sự giúp sức của quỷ Mephisto, chàng đã thành công quyến rũ và chiếm được tình cảm của Margarete. Tình yêu giữa họ ngay từ đầu đã bị quỷ chi phối, dẫn tới việc phải trải qua biết bao nhiêu sóng gió, biến cố.<\/p>\n<p>Lọ thuốc mê mà quỷ đưa cho Faust dùng để quyến rũ cô gái đã khiến cho mẹ của cô ấy chết vì thuốc quá nặng. Anh trai của Margarete đang đi lính thấy mẹ mất thì vội vàng quay về, nhưng cũng lại phải chết dưới kiếm của Faust. Lúc ấy, Margarete đang có thai với Faust. Lúc sinh con ra, vì sợ miệng lưỡi của người đời nên cô đành phải vứt con vào một vũng nước ở trong rừng. Có bản kể lại rằng, vì Faust giết chết anh trai của mình rồi bỏ trốn, nên Margarete đã tưởng rằng mình bị lừa dối và đã hóa điên dại. Chính vì điên dại mà cô đã dìm con của mình ngay khi đứa trẻ vừa mới ra đời. Người mẹ ấy mang danh kẻ sát nhân, bị bọn thống trị trong vùng bắt giam vào ngục chờ ngày xử tử.<\/p>\n<p>Bi kịch tình yêu Margarete là hiện thân cho một tình yêu chân thành. Trước yêu cầu đòi đến gặp được cô gái Margarete xinh đẹp của Faust, quỷ sứ đã rất vui mừng. Hắn nghĩ rằng mình sẽ thành công thu phục được Faust bằng dục vọng của tình cảm trai gái. Nhưng hắn không biết rằng, tình yêu giữa hai con người ấy lại là thứ tình cảm thuần khiết, chân thành. Vậy là Faust sẽ không bị cám dỗ mê hoặc bởi những thứ thấp hèn. Nếu vở kịch kết thúc tại đây thì sẽ không còn gì là nổi bật nữa. Nếu dừng lại ở tình yêu tuyệt đẹp giữa Faust và Margarete thì con đường đi tìm chân lí của Faust không thể tiếp tục được nữa. Do vậy, việc Goethe xây dựng bi kịch tình yêu Margarete là rất hợp lí và cần thiết. Một mối tình đơn thuần sẽ không thể làm nên được việc lớn, chính vì thế tấn bi kịch tình yêu giữa họ rất cần phải được xảy ra.<\/p>\n<p>Ở đây, mối tình giữa họ cũng đã kết thúc như biết bao những mối tình khác. Margarete sau khi bị bắt, dù Faust tới nhà giam cứu cô, nhưng cô nhất quyết không chịu ra ngoài. Cô cho rằng, cái xã hội phong kiến rộng lớn ngoài kia cũng không hề tốt hơn so với trong tù ngục, thực chất thì cái xã hội ấy cũng chỉ là một nhà tù lớn hơn mà thôi. Cô nói rằng: “Trốn thì có ích gì? Ở mọi nơi chúng nó rình mò?”. Nhận thức ấy của cô phần nào tố cáo xã hội vô nhân tính ngoài kia. Mối tình của cô dừng lại cũng có nghĩa là ở cái xã hội ấy, tình yêu chân thành của con người sẽ luôn bị vùi dập, bị cản trở. Đó không phải là nơi lí tưởng để nuôi dưỡng những mối tình đẹp. Ngay trong chính nhận thức của cô cũng là một chuỗi những bi kịch đau đớn. Ngay ở tuổi 14, cô gái ấy đã rơi vào câu chuyện tình dưới bàn tay chỉ đạo của tên quỷ sứ, cuộc đời của cô nếu không phải là cái nghèo về vật chất thì là những nỗi đau về mặt tinh thần. Quả thực rất đáng thương. Cô cũng giống Faust, đều cảm nhận được sự tù túng, bí bách của cuộc sống. Nếu Faust cảm nhận căn phòng làm việc của mình như một nhà tù thì Margarete cảm nhận cái xã hội ngoài kia chính là một nhà tù. Nhưng Faust đang tìm kiếm chân lí của cuộc đời mình, còn Margarete thì đã tìm thấy chân lí của cuộc đời mình, đó chính là tình yêu. Vậy nên, tình yêu giữa họ ngay từ đầu đã mang bi kịch:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Khát vọng của Faust quá lớn so với chân lí mà Margarete theo đuổi. Vì không có chung một con đường nên họ đành phải chia đôi. Bi kịch tình yêu trên chính là sản phẩm của xã hội phong kiến thối nát bấy giờ. Viết nên bi kịch này, Goethe muốn thể hiện sự tố cáo, lên án cái xã hội phong kiến thời đó. Ông mong muốn đẳng cấp thứ ba sẽ có một cuộc đấu tranh để xóa bỏ được nền đạo đức phản động của bọn quý tộc và xây dựng được chế độ tư bản và nền đạo đức tư sản. Xã hội phong kiến bấy giờ chỉ giống như một cái nhà tù lớn, giam hãm, trói buộc con người. Ở đó, con người không có tiếng nói, không có sự phát triển; tình cảm của con người cũng không được trân trọng, bị vùi dập một cách tuyệt tình. Chính những luật lệ hà khắc, sai trái ăn sâu vào trong gốc rễ của con người, truyền từ đời này qua đời khác khiến con người trở nên kém cỏi, xã hội ngày một yếu kém, suy vong.<\/p>\n"], ["2.6. Bi kịch Helen", 4, "<p>Bi kịch Helen xuất hiện trong Faust II. Mở đầu Faust II là khung cảnh mà Faust đang nằm trên bãi cỏ, xung quanh đang có các thiên thần múa hát say sưa. Lúc Faust tỉnh dậy, một ánh sáng của vầng dương phát ra chói chang. Ánh sáng ấy đại diện cho ánh sáng của cuộc cách mạng tư sản Pháp năm 1789. Đây là cuộc cách mạng lật đổ chính quyền quân chủ chuyên chế, thủ tiêu mọi tàn dư phong kiến ở nước Pháp. Cuộc cách mạng này có ảnh hưởng rất lớn đối với châu Âu, khiến cho chế độ phong kiến bị lung lay ở khắp châu Âu. Là một nhà ánh sáng, Goethe rất ủng hộ cuộc cách mạng này nhưng ông lại không muốn đất nước Đức phải diễn ra một cuộc đấu tranh như vậy. Faust II bắt đầu được mở ra với cảnh quỷ Mephisto dẫn<\/p>\n<p>Faust đến triều đình. Faust được chứng kiến cảnh bọn vua quan đang rơi vào tình trạng khủng hoảng, bi đát vô cùng. Cụ thể đó là: Kho lương thực thì cạn kiệt, ngân quỹ thì trống rỗng, binh lính thì đào ngũ, giặc ở biên giới thì đang lăm le xâm chiếm. Faust và quỷ sứ đã dùng pháp thuật để cứu triều đình khỏi tình cảnh nguy cấp bấy giờ. Lúc ấy, cảnh tượng phồn vinh giả tạo hiện lên: <em>“Và một lũ bê vàng/ Sẽ rời lòng đất kéo nhau ra./ Rồi, với niềm yêu thích và không phút giây do dự/ Bệ hạ sẽ trang điểm cho mình và cho ái phi nữa./ Kim cương, hồng ngọc đủ màu sắc long lanh/ Sẽ tôn thêm sắc đẹp cũng như uy quyền.”.<\/em> Đây cũng là mở màn cho sự xuất hiện của bi kịch Helen. Vua ngỏ ý muốn được gặp Helen, chính vì thế Faust đã làm phép để triệu được nàng từ cõi âm trở về. Lúc Helen hiện lên, Faust bị mê mẩn bởi sự xinh đẹp và lộng lẫy của nàng. Nhưng Helen lại biến mất, còn Faust thì lại trở về trường đại học cũ của mình. Faust đòi quỷ đưa mình đi tìm Helen. Chàng cùng với quỷ sứ đã mượn được tiểu hình nhân của Wagner để làm người dẫn đường. Cuối cùng, khi trở về thế giới Hi Lạp cổ đại, họ đã tìm thấy được Helen. Faust và Helen đã nhanh chóng lấy nhau và sinh được một người con trai, có tên là Euphorion. Bi kịch Helen cũng từ đây mà bắt đầu. Cuộc sống vợ chồng của Faust và Helen không được suôn sẻ mà gặp nhiều biến cố. Hàng chuỗi các bi kịch xảy ra. Tiểu hình nhân chết, đứa con duy nhất của hai người cũng vì nhảy cao quá mà chết. Helen ôm xác đứa con của mình bay về thiên đường, để lại cho Faust một tấm áo; tấm áo này biến thành đám mây đưa Faust và quỷ sứ đi về cõi dương ở phương Bắc. Helen đã ôm Faust để tạm biệt và nhận xét: <em>“Một câu nói cũ trở thành sự thật rằng hạnh phúc không phải là cùng với vẻ đẹp...”.<\/em> Sự biến mất, ra đi của Helen, như thể biểu thị tính nhất thời của vẻ đẹp tuyệt đối. Trong tình hình ấy, vua và triều đình đang đứng trước nguy cơ bị giặc ngoại xâm xâm chiếm. Được sự giúp đỡ của quỷ Mephisto, Faust đã đánh thắng được quân giặc, được vua ban tặng cho một bãi hoang ở bờ biển. Khi ấy, Faust đã già. Nhầm tưởng rằng người dân đang hăng say lao động sản xuất mà thực chất lại là đang đào huyệt cho chính ông, Faust đã thốt lên một câu: “Đẹp quá thời gian ơi dừng lại”. Vậy là sự nhầm lẫn ấy đã khiến Faust trả giá bằng cái chết của chính mình. Trong màn cược với quỷ Mephisto, có lẽ Faust đã thua khi nhầm lẫn như vậy. Thế nhưng, trước khi quỷ mở cánh cửa để bắt Faust xuống địa ngục thì thiên thần đã kịp thời đưa linh hồn của chàng lên thiên đường.<\/p>\n<p>Cuộc đời của Faust chính là minh chứng cho giá trị thực tiễn của hành động. Hành động có vai trò quyết định rất lớn đối với cuộc sống của con người. Hành động đưa con người tới niềm vui, tới những lỗi lầm, cũng là ánh sáng để con người vượt qua được cám dỗ. Sự xuất hiện của Helen chính là sự sắp đặt của quỷ Mephisto. Mục đích của quỷ là đưa ra những cám dỗ mật ngọt về danh vọng và tiền tài để mê hoặc Faust. Quỷ muốn thực hiện mục tiêu là làm cho Faust có thể mất đi khát vọng, sự nỗ lực khám phá khoa học của mình để thỏa mãn với cuộc sống. Thế nhưng, tình hình đã nằm ngoài mọi dự đoán của quỷ khi bi kịch Helen xảy ra. Bi kịch Helen xảy đến buộc Faust không thể sống một cuộc đời yên bình với một người vợ và một người con. Điều đó cũng có nghĩa hành trình của Faust vẫn chưa thể dừng lại. Nhân vật Helen là người đại diện cho cái đẹp. Khát vọng muốn được gặp mặt Helen chính là khát vọng được tìm thấy cái đẹp của nhân vật Faust. Faust muốn tìm gặp Helen, hay cũng chính là Goethe đang muốn tìm kiếm một tác phẩm thực sự giá trị trên con đường nghệ thuật của mình. Đứa con của Faust và Helen cũng giống như sản phẩm của tình yêu nghệ thuật. Con đường tìm kiếm sản phẩm ấy không hề tầm thường mà cùng hiểm hóc, gian nan. Đó cũng giống như con đường mà Goethe cũng như những nhà ánh sáng người Đức bấy giờ muốn tìm kiếm để có thể đưa nước Đức thoát ra khỏi chế độ phong kiến lỗi thời, lạc hậu.<\/p>\n"], ["3.1. Giá trị nội dung", 4, "<p>Muốn đưa đất nước Đức thống nhất trên bình diện ý thức, trở nên tiến bộ hơn, đòi hỏi sự nỗ lực rất lớn của các nhà ánh sáng. Goethe ý thức rất rõ được điều đó, vì vậy ông đã khéo léo để nhân vật của mình có thể đem tới được cái nhìn tích cực, sản phẩm nghệ thuật của ông có thể làm thay đổi nhận thức, làm trong sạch được tâm hồn của con người. Chân lí mà nhân vật Faust tìm ra được chính là “hành động”. Chỉ có hành động thì con người mới có thể cải tạo thế giới, tạo ra được sản phẩm lao động. Ở thời đại ánh sáng, người ta rất cần đến lao động của con người. Con người có thể khẳng định giá trị của bản thân thông qua hành động. Qua Faust, Goethe thể hiện được niềm tin vào khả năng của con người. Không phải qua sáng tác của Goethe thì khả năng của con người mới được đề cao. Terenz (195 – 159 TCN) đã cho rằng: “Tôi là con người nên không có gì thuộc về con người mà xa lạ với tôi!”. Cái tinh thần không sợ mạo hiểm, dám chấp nhận thử thách của nhà thơ lớn La Mã – Horace đã trở thành khẩu hiệu của thế kỉ ánh sáng: “Bắt tay vào việc là đã thắng lợi một nửa! Không thể há miệng chờ sung hay để cho nước nhảy qua cầu!. Faust ra đời trong thế kỉ XVIII, thế kỉ được mệnh danh là thế kỉ khai sáng. Tư tưởng khai sáng phát huy mạnh mẽ, là cơ sở cho sự chuẩn bị về một cuộc cách mạng tư sản trong tương lai. Đó là cuộc đấu tranh lật đổ chế độ phong kiến chuyên chế với những thể chế lạc hậu, lỗi thời, hà khắc. Ở đây, giai cấp tư sản đã nhận thức rõ được rằng “Khởi thủy là hành động”. Tức là, trên con đường chống lại Nhà nước phong kiến chuyên chế, con người cần phải biết đứng lên để hành động, không có hành động thì sẽ không có sự thay đổi. Lời nói, nhận thức là một yếu tố khá quan trọng để con người có thể hành động. Nhưng không có hành động thì sẽ không có khởi đầu nào cả. Vì vậy, việc chuyển biến từ “Khởi thủy là lời” sang “khởi thủy là hành động” là hoàn toàn hợp lí.<\/p>\n<p>Kịch Faust có giá trị nhân đạo rất sâu sắc. Tác phẩm phản ánh quá trình đấu tranh của con người giữa hai mặt tốt và xấu. Muốn vượt qua được cám dỗ, con người cần phải biết vươn lên, biết hành động. Đó cũng chính là lí do mà Faust không dịch giống như Kinh thánh “Khởi thủy là lời” mà lại dịch thành “Khởi thủy là hành động”. Hành động chính là chân lí mà Faust đã tìm thấy và cố gắng để chứng minh điều đó. Lí tưởng của Goethe chính là hành động. Ông cho rằng văn học nghệ thuật phải là con người lao động: “niềm vui chân chính của con người là lao động.”. Tác phẩm còn là sự lên án, tố cáo xã hội phong kiến. Đó là cái xã hội với một nền giáo dục bế tắc, với những quan điểm cũ kĩ, lỗi thời và lạc hậu. Trường đại học phong kiến, theo Faust thì đó chẳng khác gì tù ngục: “Trốn đi! Vùng lên! Lao tới cõi trời bao la!”. Dưới con mắt của Goethe thì Nhà nước phong kiến chỉ giống như một “con bọ chó chuyên đi hút máu người”. Triều đình phong kiến cũng thối nát, mục ruỗng, cũng chỉ là loài sâu mọt mà thôi…Phê phán những điều này, tác giả như đang tạo nên động lực để thôi thúc đẳng cấp thứ ba đấu tranh, vùng lên lật đổ chế độ phong kiến thối nát ấy.<\/p>\n"], ["3.2. Giá trị hình thức", 4, "<p>Goethe đã có phương pháp xây dựng nhân vật khá độc đáo và thành công. Faust và quỷ Mephisto tuy được tạo ra như hai thực thể khác nhau nhưng thực chất lại chỉ là một. Có lẽ Mephisto chính là sự phân thân của Faust. Faust là đại diện cho khát vọng, lí tưởng, sự nỗ lực khám phá cuộc sống; còn quỷ Mephisto chính là phần tiêu cực, phần tối làm trì trệ, ngăn cản sự tiến bộ, sự nỗ lực của chàng. Faust cũng đã ý thức được điều này:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Việc tạo ra sự đối lập ấy góp phần làm nên xung đột trong một con người. Ở trong con người ấy, cần tìm thấy được một giải pháp cụ thể, cần phải đấu tranh với cái xấu, cái tiêu cực để bảo vệ cái đúng, cái tiến bộ trong chính mình. Muốn khẳng định bản thân, con người cần phải biết “hành động”, đó là cách mà con người đứng lên để đấu tranh bảo vệ giá trị của bản thân mình. Ngay cả Chúa cũng rất tôn trọng và khẳng định sự tốt đẹp của con người. Chúa rất trân trọng khát vọng vươn lên, sự nỗ lực khám phá kiến thức, chinh phục và làm chủ cuộc sống của con người.<\/p>\n<p>Các cảnh trong kịch Faust được sắp xếp liên tục với nhau. Các cảnh có sự đứt đoạn, không liền mạch nhưng lại được gắn kết với nhau bằng hành động của Faust. Kết cấu dàn trải theo trật tự tuyến tính này ta đã bắt gặp trong Odyssey. Faust không được viết theo kết cấu của một vở kịch truyền thống. Các màn đều tồn tại một cách độc lập và hoàn chỉnh; chủ yếu làm nổi rõ được khát vọng đi tìm chân lí của Faust. Các tác phẩm nghệ thuật của thời kì khai sáng thường xây dựng những tình huống đặc biệt rồi đặt nhân vật vào trong đó, nhằm khẳng định tính cách của nhân vật. Như ở trong kịch Faust, ta thấy rằng, từ đầu tới cuối vở kịch, các tình huống được tạo ra đều nhằm khẳng định tính cách của Faust. Bản chất của Faust không hề thay đổi; còn khát vọng, sự nỗ lực của Faust chỉ ngày một sâu sắc, phát triển hơn mà thôi. Goethe xứng đáng là một thiên tài văn học. Kiệt tác của ông không chỉ có giá trị sâu sắc với thời đại mà còn trường tồn, vĩnh hằng với thời gian.<\/p>\n"], ["I - Khái quát về chủ nghĩa lãng mạn", 2, "<p>Chủ nghĩa lãng mạn vừa là trào lưu văn học, vừa là phương pháp sáng tác, hình thành ở Tây Âu vào sau Đại cách mạng tư sản Pháp năm 1789. Thời kì phồn thịnh là cuối thế kỉ XVIII- đầu thế kỉ XIX.<\/p>\n<p>Chủ nghĩa lãng mạn nảy sinh do nhiều yếu tố tác động, nhưng quan trọng nhất là tác động của kinh nghiệm lịch sử mới mà Đại Cách mạng Pháp đưa lại. Điều kiện lịch sử- xã hội ấy “đòi hỏi sự lí giải, kể cả lí giải bằng nghệ thuật và bắt buộc phải xem xét lại các nguyên tắc sáng tác”<em>.<\/em><\/p>\n<p>Chủ nghĩa lãng mạn đã “<em>cải tạo cơ bản cảnh quan tinh thần của thế giới phương Tây từ cuối thế kỉ XVIII<\/em>”. Octavio Paz định vị chủ nghĩa lãng mạn không phải chỉ như một trào lưu nghệ thuật, mà còn như một lối sống, một thời đại. Octavio Paz đã viết về tinh thần phê phán, phủ định của chủ nghĩa lãng mạn như sau: “<em>Chủ nghĩa lãng mạn là đứa con của Thời đại Phê phán, và sự thay đổi nhận trách nhiệm khai sinh nó, đồng thời là dấu hiệu bản sắc của nó. Không chỉ là sự thay đổi ở lãnh địa văn chương và nghệ thuật không thôi mà còn là sự thay đổi trong tưởng tượng, cảm giác, thị hiếu và tư tưởng. Chủ nghĩa lãng mạn là một thứ đạo lý, một chủ nghĩa dục tính, một thứ chính trị, nó là cách ăn mặc, là cách sống và cách chết. Như một đứa con nổi loạn, Chủ nghĩa lãng mạn là sự phê phán đối với truyền thống phê phán của chủ nghĩa duy lý. Đối với thời gian lịch sử, nó thiên vị thứ thời gian khởi nguyên, có trước lịch sử; đối với tương lai không tưởng, nó ưu ái hơn sự hiện diện tức thời của những đam mê, tình yêu và xác thân<\/em>”.<\/p>\n<p>Ở Việt Nam, định vị chủ nghĩa lãng mạn không chỉ bó hẹp trong phạm vi những sáng tác nghệ thuật đầu thế kỉ XX- Tự lực văn đoàn và thơ Mới mà còn như một cá tính, một lối sống của con người. Lãng mạn xuất hiện trong những diễn ngôn hết sức quen thuộc như để trỏ một cá nhân, một phong cách sống: vượt lên trên/ muốn thoát khỏi đời sống xã hội công nghiệp bon chen; đời sống tinh thần thi vị (yêu và thưởng thức nghệ thuật); mộng mơ, …<\/p>\n<p>Dù tồn tại những cách hiểu khác nhau và luôn vận động theo bước chuyển của thời gian, nhưng nhìn chung, các nhà nghiên cứu gặp gỡ nhau ở một vài đặc trưng sau đây của chủ nghĩa lãng mạn: Thứ nhất, chủ nghĩa lãng mạn đối lập với nguyên tắc “<em>bắt chước tự nhiên<\/em>” của chủ nghĩa cổ điển, nó đề cao tính tích cực sáng tạo, sự tưởng tượng của chủ thể sáng tác. Thứ hai, hạt nhân của chủ nghĩa lãng mạn là cái tôi cá nhân, tràn đầy cảm xúc. Thứ ba, chủ nghĩa lãng mạn được đánh dấu bằng những cách tân về nghệ thuật: phát triển ngôn ngữ đến chỗ rất mực phong phú; trong nguyên tắc miêu tả “<em>hướng đến giả tưởng, nghịch dị trào lộng, tích ước lệ lộ liễu của hình thức, mạnh dạn pha trộn chất đời thường và chất dị thường, chất bi và chất hài<\/em>”, …<\/p>\n<p>Với cách hiểu chủ nghĩa lãng mạn như vậy, các nhà nghiên cứu và độc giả lâu nay vẫn thừa nhận: cuộc đời Byron, thơ Byron là điển hình của chủ nghĩa lãng mạn.<\/p>\n"], ["II- Tác giả:", 2, "<p>George Gordon Byron có bố là người Anh, mẹ là người Scotland, đều dòng dõi quý tộc. Thời thơ ấu, Byron sống với mẹ tại Scotland trong hoàn cảnh gần như nghèo nàn. Năm lên mười, sau cái chết của một người ông bên họ nội, Byron được thừa kế tước hiệu Thượng nghị sĩ (Lord) và một gia sản lớn. Cuộc đời ngắn ngủi 36 năm, nhưng những tác phẩm mà Byron để lại đã được nhiều thế hệ sau đánh giá cao và thừa nhận,<\/p>\n<p>Cố nhiên, điều này đã được thừa nhận như một chân lí: thơ Byron là thơ lãng mạn. Nhưng chúng tôi muốn nói thêm: cuộc đời Byron cũng là một cuộc đời lãng mạn.<\/p>\n<p>Sinh ra với khiếm khuyết cơ thể (bị thọt chân), nhưng Byron luôn hăng hái luyện tập, trở thành một người chơi thể thao giỏi ở nhiều môn (bơi, đi ngựa, đánh bốc, chơi criket, …). Trong đời sống, Byron yêu nhiều: Mary Chaworth, John<\/p>\n<p>Edleston, Augusta Leigh, Lady Byron, Teresa Guiccioli, …; và hình như những người tình của ông đều được ông yêu chân thành. Byron từng yêu say đắm mối tình đầu là Mary Chaworth đến mức không nhận ra cô đang yêu một người đàn ông khác. Với nữ bá tước Teresa, trong một bức thư, Byron đã hứa cô là tình yêu cuối cùng của đời mình và quả thật là vậy. Với những mối tình, ông lao vào làm thơ như những con thiêu thân. Byron làm thơ, viết thơ, ngay giữa những đau khổ, u phiền vì ái tình; đó là lãng mạn.<\/p>\n<p>Đúng với nghĩa “<em>lãng mạn<\/em>” là sóng tràn bờ; trong thực tế đời sống, Byron luôn bất phục tùng và vượt trên thực tại tầm thường, thối nát. Khi ông trưởng thành, nước Anh là một trong những cường quốc đi áp đặt lối sống của mình lên các quốc gia khác. Là một người Anh nhưng Byron không chấp nhận những điều đó. Khi Hi Lạp bị Thổ Nhĩ Kì chiếm đóng, Byron bán sạch gia sản, chối bỏ luôn Huân tước, Nguyên lão Nghị viện để cùng nhân dân Hi Lạp đấu tranh giành độc lập. Byron như một hình mẫu của công dân toàn cầu. Mấy ai dám “lãng mạn” được như ông? Vì vậy, Belinsky ngợi ca: “<em>Byron là Promete của thời đại chúng ta, một thiên tài mãnh liệt trên đỉnh núi của mình đưa mắt nhìn về phía trước và tít mù sau chốn xa cùng lấp lánh, không nhận ra được dải đất hứa hẹn của tương lai, thi sĩ nguyền rủa hiện tại, tuyên bố với hiện tại mối thâm thù vĩnh viễn không đội trời chung của mình<\/em>”<\/p>\n"], ["1. Thơ Byron là thơ lãng mạn", 3, "<p>Từ lí thuyết những đặc điểm của chủ nghĩa lãng mạn, chúng tôi đồng ý với quan điểm thơ Byron mang đặc trưng của chủ nghĩa lãng mạn, và biểu hiện ở một vài điểm sau đây:<\/p>\n"], ["1.1. Chủ đề, đề tài", 4, "<p>Do có cơ sở ý thức triết học là chủ nghĩa duy lý của René Descartes, chủ nghĩa cổ điển coi lí trí là bá quyền còn thơ trữ tình, chủ nghĩa trữ tình nói chung không phải “<em>khẩu vị<\/em>”. Ngược lại, chủ tình, đề cao cái tôi lại là hạt nhân của chủ nghĩa lãng mạn. Hợp nhất với thơ lãng mạn là tình yêu. Thơ Byron thường viết về chủ đề tình yêu: đó là tình yêu gia đình (<em>Cuộc hành hương của Childe Harolds<\/em>- Khúc thứ ba); tình yêu giữa hai cá thể (<em>Tên cướp biển<\/em>- <em>The Corsair<\/em>; <em>Stanzas to Augusta<\/em> (I), <em>Stanzas to Augusta<\/em> (II), <em>Don Juan<\/em>).<\/p>\n<p>Một chủ đề khác, là dân tộc, đất nước. Khác chủ nghĩa cổ điển “<em>mô phỏng cổ đại<\/em>” (kịch của P.Corneille, J.Racine, Molière đều lấy cốt truyện bi kịch, hài kịch của mình từ trong các tác phẩm cổ đại), chủ nghĩa lãng mạn bước đầu thể hiện tính dân tộc với chủ trương khai thác đề tài trong lịch sử đất nước mình. Các tác phẩm: “<em>Cuộc hành hương của Childe Harold<\/em>” (“<em>Childe Harold’s Pilgrimage<\/em>”), “<em>Don Juan<\/em>” đều đề cập đến vấn đề đất nước, dân tộc. Vì Byron không đứng ngoài cuộc sống; không tách biệt với nhân dân, đất nước mình. Sau khoảng thời gian hai năm (1809-1811) thực hiện chuyến đi dài ngày đầu tiên đến vùng Địa Trung Hải, Byron trở về Anh và bắt đầu tích cực hoạt động chính trị. Byron bênh vực những người lao động, kịch liệt phản đối luật xử tử hình đối với công nhân phá máy “<em>Tôi đã đi qua những nơi bị chiến tranh tàn phá ở Tây Ban Nha và Bồ Đào Nha, tôi đã đến những miền cùng cực nhất trên đất Thổ, nhưng không nơi nào, ngay dưới ách của một chế độ độc tài nhất, tôi thấy một tình trạng bần cùng tuyệt vọng, bế tắc như ở đây, khi tôi trở về Tổ quốc…<\/em>” [1]. Byron căm ghét chính phủ Anh đương thời, phê phán chế độ hà khắc mà giới cầm quyền Anh thi hành ở Ailen, …<\/p>\n<p>Như vậy, cuộc đời Byron với tình yêu những người tình; với mối quan tâm với đất nước, dân tộc đã “phả” vào thơ ông. Cuộc đời thành chất liệu nghệ thuật.<\/p>\n"], ["1.2. Nhân vật trung tâm", 4, "<p>Hạt nhân của chủ nghĩa lãng mạn là “cái tôi”. Nhân vật trong thơ Byron là những nhân vật với tình cảm, suy nghĩ, hành động mang tính cá nhân- những con người vượt lên thực tại và nội tâm tràn đầy cảm xúc. Những nhân vật đó như là hình bóng của Byron và dù mang “<em>cái tôi<\/em>” nhưng ở một vài điểm, lại mang tính khái quát và điển hình. Pushkin nhận xét về Byron “<em>Byron trước sau chỉ sáng tạo một tính cách. Đó là những nét của bản thân Byron đem san sẻ cho nhân vật của mình, đem lòng tự tôn cho nhân vật này, chí căm thù cho nhân vật nọ và nỗi u sầu cho nhân vật kia… Byron đưa mắt một chiều nhìn thế giới và bản tính loài người, sau đó thì quay mặt đi và rút vào bản thân mình<\/em>”. Pushkin cho rằng “<em>Byron sâu sắc nhưng đơn điệu<\/em>” là vì thế!<\/p>\n"], ["1.2.1. Nhân vật vượt lên thực tại", 5, "<p><em>a. Nhân vật quay lưng với thực tại<\/em><\/p>\n<p>Chủ nghĩa lãng mạn tích cực tăng cường ý chí con người đối với cuộc sống, thức tỉnh lòng bất phục tùng đối với thực tại, đối với mọi đè nén áp bức. Nhân vật trong thơ Byron cũng vậy. Childe Harold (“<em>Cuộc hành hương của Childe Harold<\/em>”-<\/p>\n<p>“<em>Childe Harold’s Pilgrimage<\/em>”) từ biệt Tổ quốc- nước Anh để tới những miền đất xa lạ. Thực tại mà Harold có- sung túc, giàu có có thể là niềm say mê và ham muốn của bao người, nhưng chàng không bằng lòng được với thực tại đó. Chàng thấy một đời sống vô nghĩa, chàng thấy mình buồn bã, cô độc dù “<em>Tiệc chàng khao không vắng bóng một khách mời<\/em>”. Vậy nên, Harold quay lưng và từ bỏ:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Tại sao chàng có thể quyết định và từ bỏ rồi ra đi nhanh chóng, dứt khoát (và dễ dàng) đến vậy? Dường như Harold chẳng có chút suy tính gì về tương lai phía trước: chàng sẽ làm gì, chàng sẽ sống một cuộc đời ra sao. Con người của chủ nghĩa lãng mạn là vậy. Hình tượng Childe Harold từ biệt quê hương Anh như một con người tự do là khao khát, là giấc mơ của chúng ta khi đương tồn tại trong một đời sống quá nhàm chán. Nếu Harold lựa chọn vượt lề bằng cách dịch chuyển không gian, thì nhân vật trữ tình trong “<em>Ta lại muốn trở thành em nhỏ<\/em>” lại lựa chọn “<em>trở thành em nhỏ<\/em>” (“<em>I would I were a careless child”<\/em>):<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Vì thực tại có quá nhiều cay đắng. Nó giống như diễn ngôn “<em>Cho tôi xin một vé đi tuổi thơ<\/em>” của Robert Ivanovich Rozhdestvensky.<\/p>\n<p><em>b. Nhân vật hướng về những điều đẹp đẽ<\/em><\/p>\n<p>Vượt lên thực tại đen tối, nhân vật trữ tình của Byron hướng về những điều đẹp đẽ. Không phải ngẫu nhiên, thơ lãng mạn của Byron lại được nhiều nhà nghiên cứu xếp vào thơ lãng mạn tích cực (phân biệt với thơ lãng mạn tiêu cực). Tất nhiên, việc phân chia chủ nghĩa lãng mạn thành hai phái là tích cực và tiêu cực tồn tại những hạn chế nhất định khi đứng trường quan điểm, lập trường giai cấp. Lãng mạn tích cực mà chúng tôi muốn đề cập đến ở đây là: dù sống với cái tôi cô đơn, chìm trong bóng tối nhưng nhân vật trữ tình vẫn nghĩ đến ánh sáng.<\/p>\n<p>“<em>Stanzas to Augusta<\/em>” (I) được viết vào năm 1816, khi Byron đương lúc chịu nhiều chỉ trích của dư luận, khủng hoảng tài chính, gia đình tan nát. Thực tối tối tăm mù mịt đối lập với ánh sáng từ tình yêu và hi vọng. Khi nhân vật trữ tình tôi (“<em>me<\/em>”) trong cảnh “<em>dear and dark<\/em>” (buồn thảm, thê lương và mù mịt, u ám) đã nghĩ đến “<em>em<\/em>”- như ánh sáng, xua tan bóng tối bủa vây “<em>dashed the darkness<\/em>” (“dash” là động từ có nghĩa va chạm rất mạnh).<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Nếu gắn bài thơ với cuộc đời của Byron thì hoàn toàn có thể hiểu Augusta vừa là người chị, người tình, vừa là người bạn tâm giao Byron có thể tin và dựa. Khi thế gian- mọi thứ đều quay lưng, chỉ còn một người ta có thể tin và dựa vào, đó là niềm tin chủ quan- đặc trưng của chủ nghĩa lãng mạn. Nhưng nó không thuộc về cái tôi riêng nào, mà là đặc điểm của con người muôn thời: nghĩ về những người chúng ta yêu trong những bế tắc, bi quan nhất của cuộc sống. <em>“Khi tất cả mất rồi anh vẫn được Còn có em và sẽ mãi còn em<\/em><\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Trong đời sống thực, mối tình Byron- Augusta là mối tính loạn luân, là tình yêu đi ngược với luân thường, đạo lí xã hội. Nhưng người tiếp nhận thơ, nếu tách văn bản khỏi tác giả (tác giả “chết”- Roland Barthes), bỏ qua những rèm pha, những tai tiếng quanh đời sống của Byron, thì thấy đó là một trái tim, một tiếng lòng đẹp đẽ. Và đó cũng có thể coi là một người đọc lãng mạn chăng?<\/p>\n<p><em>c. Nhân vật vươn tới lí tưởng<\/em><\/p>\n<p>Cũng nói về tình yêu, tình yêu giữa Juan và Haide (chương II, <em>Don Juan<\/em>) là một tình yêu lí tưởng. Tình yêu giữa Juan và Haide như chỉ có hai người sống trên thế gian mà không có thế lực nào ngăn cản được:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Thực tại ở đây là sự bất đồng về ngôn ngữ. Bố của Haide còn là một tên cướp biển, một người buôn nô lệ (mà ở chương sau, chính bố của Haide đã bán Juan sang Thổ Nhì Kì làm nô lệ). Với lí tính, tình yêu giữa hai người bất đồng về ngôn ngữ là không thể. Nhưng với chủ nghĩa lãng mạn, điều không tưởng lại là có thực:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Juan và Haide hành động như theo một “<em>động lực nội tại, theo những dục vọng mãnh liệt và không thể chế ngự được<\/em>” (Lăngxông). Khi nhân vật vượt lên thực tại và vươn tới lí tưởng, Byron dường như còn có hàm ý thể hiện tính chất tự do về tình yêu của con người. Tự do, đặc biệt là trong tình yêu, luôn là khát khao của con người nhiều thế hệ.<\/p>\n"], ["1.2.2. Nhân vật tự biểu hiện cảm xúc", 5, "<p>Nếu chủ nghĩa duy lí chủ trương sự lên ngôi của lí trí, thì chủ nghĩa lãng mạn đề cao chất trữ tình trong sáng tác. Cái tôi tự biểu hiện là quan trọng với lãng mạn. Nửa đầu thế kỉ XX, ở Việt Nam, sau thời gian quá dài sống trong khuôn khổ của “<em>cái ta<\/em>”, người ta lần đầu tiên được tiếp xúc với những cái tôi mà cảm xúc như vượt khỏi khuôn khổ câu thơ:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>(“<em>Vội vàng<\/em>”- Xuân Diệu)<\/p>\n<p>Ở phương Tây, các tác giả của chủ nghĩa lãng mạn cũng vậy. Thế giới nội tâm với những sắc thái tình cảm, cảm xúc khác nhau bộc lộ, như một sự phủ định chủ nghĩa cổ điển trước đó.<\/p>\n<p><em>a. Nhân vật nặng nề nỗi chán chường và cô đơn<\/em><\/p>\n<p>Như trên đã nói, nhân vật trong thơ lãng mạn là những con người không phục tùng thực tại- luôn vượt lề. Điều đó cũng đồng nghĩa với việc, họ mang tâm trạng chán chường khi chưa tìm được lí tưởng và cô đơn trong hành trình của chính mình. Don Quijote (“<em>Don Quijote<\/em>”- M. Cervantes) của thời đại Phục hưng đi ngược lại với số đông thì bị coi là gàn dở, điên rồ. Còn nhân vật của Byron thì cô đơn.<\/p>\n<p>Khúc ca thứ ba trong “<em>Cuộc hành hương của Childe Harold<\/em>” lấy hình thức là cuộc tâm tình giữa cha và con, người cha (Harold) bày tỏ nỗi cơ đơn của mình:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Nhân vật trữ tình trong “Ta lại muốn trở thành em nhỏ” cũng vậy. Không một ai bên cạnh:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p><em>b. Chủ đề tình yêu (giữa hai người yêu nhau)<\/em><\/p>\n<p>Với tình yêu của những người yêu nhau, nhân vật trữ tình trong thơ Byron cứ thế thổ lộ những cảm xúc của cá nhân mình mà không cần phải che đậy, che giấu. “<em>Miêu tả những tình cảm, cảm xúc cao đẹp của hồn người là thế mạnh của Byron. Trong thơ mình, ông luôn đặt con người trong hoàn cảnh tự nhiên và để cảm xúc phát triển theo logic khách quan của nó<\/em>” [10]. Byron dường như không khước từ một cung bậc cảm xúc nào trong tình yêu: say đắm, đau buồn, cô đơn, …Dù là tiếng lòng của một con người cụ thể, nhưng nó đã chạm tới tính phổ quát- tiếng lòng của những người yêu nhau. Qua một bài khúc đoạn trong “<em>Tên cướp biển<\/em>” (“<em>The Corsair<\/em>”); các bài thơ: <em>Stanzas to Augusta (I), Stanzas to Augusta (II),<\/em> “<em>When we two parted<\/em>”, …có thể thấy điều này.<\/p>\n<p>Những cảm xúc hiện ra trên bề mặt câu thơ: “<em>Anh đang bị bao nỗi đau giằng xé”<\/em> (<em>Stanzas to Augusta (II)<\/em>). Nhân vật trữ tình thổ lộ tình cảm sâu nặng với Augusta, nàng là tình yêu duy nhất mà “<em>anh<\/em>” có được:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>(<em>Stanzas to Augusta (II)<\/em>)<\/p>\n<p>Nhân vật trữ tình bộc lộ những cảm xúc rất “trần thế”, rất chân thực: đó là xúc cảm đau buồn khi mối tình vỡ tan (“<em>When we two parted<\/em>”). Không rõ sau khi chia tay, anh hay em hay cả hai chúng ta cùng đau khổ:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p><em>Hai đứa cùng đau khổ”<\/em>)<\/p>\n<p>Và đau đớn nhất là khi:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>(“<em>When we two parted<\/em>”)<\/p>\n<p>Nỗi nhớ, niềm khắc khoải đợi chờ của Medora với Conard chân thực (“<em>Tên cướp biển<\/em>”- “<em>The Corsair<\/em>”):<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p><em>c. Chủ đề về quê hương, đất nước<\/em><\/p>\n<p>Mặc dù rời nước Anh ra đi, nhưng thật ra với Harold luôn yêu quê hương, đất nước- một tình cảm thiết tha và nồng thắm:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p><em>(“Cuộc hành hương của Childe Harold”)<\/em><\/p>\n<p>Càng yêu bao nhiêu, thì lại càng ghét sự thối nát bấy nhiêu. Sự căm thù đạo đức giả là một trong hai thứ tình cảm mà Byron luôn luôn trung thành. Ông thẳng thắn bộc lộ những xúc cảm đầy bất mãn với bọn quý tộc Anh- những kẻ nhân danh Tổ quốc để làm điều trái ngược đạo lí, lương tri: <em>“Thần số mệnh, ta hoàn ngươi tất cả Đây văn minh, tước vị, hư danh<\/em><\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p>"], ["1.3. Thể loại", 4, "<p>Chủ nghĩa cổ điển, trong phân biệt thể loại, thiếu dân chủ ở việc coi trọng kịch bao nhiêu thì xem nhẹ thơ bấy nhiêu. Chủ nghĩa lãng mạn đã xoả bỏ ranh giới phân biệt đó. Thơ lên ngôi. Vì vậy, chọn thơ đã là một cách tân nghệ thuật của Byron. Trong những truyện thơ của ông, thì yếu tố trữ tình xuất hiện và làm nên chất lãng mạn.<\/p>\n"], ["1.4. Ngôn ngữ", 4, "<p>Nhận thức được việc “<em>thưởng thức văn chương mỗi nước từ chính nguyên bản là điều lý tưởng, nhưng cũng là ảo tưởng bởi người tự hào thông thạo một ngoại ngữ nào đấy cũng không thể nắm bắt hết các khía cạnh tinh vi bằng người sử dụng ngôn ngữ ấy như tiếng mẹ đẻ<\/em>” (GS. Phùng Văn Tửu, “Cảm thụ và giảng dạy Văn học nước ngoài” (2003)), chúng tôi thừa nhận điểm hạn chế trong bài viết này là tập trung vào tư tưởng, chủ đề trong thơ lãng mạn của Byron hơn là những cách tân về nghệ thuật.<\/p>\n"], ["2. Tính hiện thực trong thơ lãng mạn của Byron", 3, "<p>Byron không để nhân vật sống trong những lí tưởng cá nhân. Ông cũng không hẳn dành nhiều trang thơ để nói về thiên nhiên thơ mộng. Chất lãng mạn trong thơ Byron không phải cái lãng mạn “mộng rớt” hay rơi vào quá ảo tưởng, xa vời thực tế. Chủ nghĩa lãng mạn trong thơ Byron có cả hiện thực.<\/p>\n<p>Chính Byron cho rằng thơ ông tuân thủ “<em>Các nguyên tắc của Aristole<\/em>” và sáng tác thơ, điều tốt nhất là “<em>tất cả phải trông như sự thật<\/em>”.<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Trong xây dựng nhân vật, đặc biệt ở Don Juan- “<em>một con người bình thường chứ không phải là một người anh hùng phi thường, được lí tưởng hoá<\/em>” . Tác giả phô bày cuộc sống bên trong của nhân vật, không hề che giấu những nhược điểm, những tật xấu của anh. Giống như Harold, Juan cũng hành hương, nhưng lí do rời đi của Juan là vì…bê bối tình cảm. Mối tình của Julia và Harold hoá ra là mối tình vụng trộm, Julia đã có chồng.<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Chủ nghĩa hiện thực đề cao tính chân thật đến từng chi tiết. Byron đã rất chân thật trong khắc hoạ bản chất người. Bản chất người lộ rõ nhất là khi con người rơi vào bước đường cùng. Khi đoàn tàu của Don Juan bị đắm ngoài khơi, những thuỷ thủ rơi vào cảnh thiếu lương thực. Bước đường cùng đẩy họ vào cảnh ăn thịt đồng loại:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Cũng trong “<em>Don Juan<\/em>”, lời bình luận của “tôi” cũng thể hiện đó là con người dám thừa nhận tính người, ngay cả là những xấu xa:<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p>Tính hiện thực trong thơ lãng mạn là một trong những đặc điểm tiêu biểu trong thơ lãng mạn của Byron. Đến “<em>Don Juan<\/em>”, Byron đã khẳng định bước đi hợp quy luật trong sáng tạo nghệ thuật, đó là chủ nghĩa hiện thực dần thay thế chủ nghĩa lãng mạn.<\/p>\n"], ["1. Bối cảnh xã hội Pháp thế kỉ XIX và quan điểm văn học thời kì này.", 3, "<p>Nước Pháp thời kì này đã trải qua hai dấu mốc lịch sử quan trọng. Thứ nhất, vào năm 1799 (cuối thế kỉ XVIII), cuộc đảo chính của Napoléon đã giúp ông giành quyền kiểm soát nước cộng hòa, trở thành tổng tài đầu tiên rồi sau đó là hoàng đế của Đế quốc Pháp, thành lập Đế chế thứ nhất, chấm dứt thời kì khởi nghĩa bạo loạn. Cũng từ đó, về chính trị, trong suốt 80 năm, Pháp trải qua 7 mô hình nhà nước và thế kỉ XIX được coi là thế kỉ của các cuộc khởi nghĩa. Về xã hội Pháp thời kì này, quý tộc, Giáo hội mất quyền lực và vị thế, cùng với đó là sự gia tăng những xung đột giữa tư sản và vô sản. Sau thất bại của Louis Napoléon trong chiến tranh Pháp – Phổ (1870), đến năm 1899 (cuối thế kỉ XIX), trong sự đe dọa từ vụ xung đột Dreyfus và phái Boulangisme, Nhà nước Cộng hòa thứ ba hay Đệ Tam Cộng hòa Pháp được thành lập.<\/p>\n<p><em>=&gt; Đây chính là dấu mốc lịch sử quan trọng thứ hai mà nước Pháp đã trải qua ở cuối thế kỉ XIX.<\/em><\/p>\n<p>Văn học Pháp thế kỉ XIX cũng lấy bối cảnh và chịu ảnh hưởng về mặt nội dung từ những biến động trong lịch sử - xã hội. Các tác phẩm với nội dung và hình thức đa dạng, có thể kể đến như: văn xuôi, thơ ca, nhạc kịch, ... Nổi lên những hiện tượng, những tác giả tài năng và những tác phẩm kinh điển. Sự ra đời các khuynh hướng văn học nghệ thuật nổi bật như: lãng mạn, hiện thực phê phán, tự nhiên, biểu tượng, ... Trong đó, lịch sử văn học Pháp thời kì này quan trọng nhất là văn học lãng mạn và văn học hiện thực. Xét về dòng văn học hiện thực phê phán, ta có thể thấy lịch sử văn học Pháp đã đạt được những thành tựu đáng kể với những tài năng văn chương kiệt xuất như Stendhal, Honoré de Balzac, Gustave Flaubert, Guy de Maupassant.<\/p>\n<p>Chủ nghĩa hiện thực phơi bày cuộc sống, môi trường xã hội nhằm phê phán xã hội tư bản, con người tha hóa. Đến năm 1866, khi chủ nghĩa hiện thực không còn đủ sức đáp ứng cho nhu cầu nghệ thuật, chủ nghĩa tự nhiên (biến thể của chủ nghĩa hiện thực) ra đời nhằm thay thế sáng tạo văn học bằng những yếu tố phi văn học, chủ trương mô tả những hiện thực cuộc sống theo lối sao chép thiếu sự lựa chọn, khái quát, đánh giá.<\/p>\n<p><em>=&gt; Do đó, nó không tồn tại lâu dài.<\/em><\/p>\n<p>Xét về dòng văn học lãng mạn, nó được khởi xướng từ đầu thế kỉ bởi hai nhà văn Pháp và có ảnh hưởng kéo dài đến cuối thế kỉ, trong đó thì từ năm 1830 trở đi, trào lưu lãng mạn mới được thống nhất và đạt tới đỉnh cao. Trong lĩnh vực thơ ca, phái Parnasse (chủ nghĩa Parnasse) chính thức xuất hiện vào năm 1866 với các tác giả tiêu biểu Théophile Gautier, Leconte de Lisle... chủ trương “nghệ thuật vị nghệ thuật”, thơ ca “vô cảm” và đề cao yêu cầu về sự gọt giũa ngôn từ. Những nhà thơ như Charles Baudelaire, Paul Verlaine, Stéphane Mallarmé, ... ban đầu là thành viên của phái thơ này nhưng sau đó họ cũng nhanh chóng ly khai, hình thành một trong những <em>hiện tượng thơ hoàn toàn mới<\/em>, hết sức quan trọng cuối thế kỷ XIX là <em>chủ nghĩa tượng trưng.<\/em><\/p>\n<p>Tuy nhiên, trước khi được thay thế bằng thuật ngữ “Chủ nghĩa tượng trưng” thì các nhà thơ trên đã khởi xướng và phát triển một chủ nghĩa khác, đó là chủ nghĩa suy đồi. Phong trào này được đặc trưng bởi cảm giác ghê tởm và bệnh hoạn đối với xã hội thời đó, các nghệ sĩ đã sử dụng sự hài hước thô thiển để thể hiện cảm xúc của họ và tin tưởng mạnh mẽ vào sự sáng tạo vượt trội của con người so với logic và thế giới tự nhiên. Và phong trào suy đồi hay chủ nghĩa suy đồi chưa bao giờ thực sự được công nhận, bởi lẽ đó, nó cũng nhanh chóng bị thay thế và cải tiến. Tựu chung lại, sẽ không ngoa nếu như nói thế kỉ XIX chính là thời kì hoàng kim của văn học nghệ thuật Pháp.<\/p>\n"], ["2. Trường phái chủ nghĩa tượng trưng.", 3, "<p>Theo Từ điển tiếng Việt: “Chủ nghĩa tượng trưng là một khuynh hướng văn học nghệ thuật cuối thế kỉ XIX đầu thế kỉ XX ở Châu Âu, chủ trương biểu hiện bằng tượng trưng nghệ thuật “những vật tự nó, những cái bản chất của sự vật”.<\/p>\n<p>Theo Lại Nguyên Ân, 150 thuật ngữ văn học, Nxb Văn học 2016: “Chủ nghĩa tượng trưng là một trào lưu nghệ thuật và một quan điểm triết học - mỹ học ở cuối thế kỷ XIX – đầu thế kỷ XX. Nảy sinh như một khuynh hướng văn học ở Pháp những năm 1860 – 1870”<\/p>\n<p><em>=&gt; Như vậy chủ nghĩa tượng trưng là một trào lưu và trường phái văn học nghệ thuật xuất hiện cuối thế kỉ XIX – đầu thế kỉ XX, phản ánh thế giới trong tính toàn vẹn, sâu xa làm nổi bật lên thế giới tinh thần được ẩn giấu đằng sau hiện thực bằng những tượng trưng nghệ thuật.<\/em><\/p>\n<p>Đối với Baudelaire ông cũng đưa ra cách hiểu riêng về tượng trưng: “Trong một số trạng thái tâm hồn hầu như có tính chất siêu nhiên, chiều sâu của cuộc sống bộc lộ toàn vẹn trong một cảnh tượng bày ra trước mắt con người, có thể là hết sức tầm thường. Cảnh tượng này là tượng trưng của sự sống.”<\/p>\n<p>Đối với Baudelaire nói riêng và các nhà thơ Tượng trưng nói chung, Mọi vật trong vũ trụ và con người có mối liên hệ huyền bí, mơ hồ không thể nhận biết bằng tư duy duy lý. Thơ là sự cố gắng thể hiện một thế giới nằm ẩn giấu đằng sau thế giới hiện thực. Chủ nghĩa tượng trưng xem thơ như một thứ siêu cảm giác, không giải thích được.<\/p>\n<p><em>=&gt; Có thể nói, chủ nghĩa Tượng trưng chịu ảnh hưởng trực tiếp từ tư tưởng của Baudelaire.<\/em><\/p>\n<p>Được xem là người tiên phong cho Chủ nghĩa Tượng trưng, Baudelaire là minh chứng tiêu biểu cho sự có mặt của dòng thơ đi sâu vào cảm quan của cái tôi huyền bí và đoạn tuyệt với cách nhìn hời hợt thông thường về thế giới.<\/p>\n"], ["3. 1. Về nội dung", 3, "<p>Chủ đề yêu thích của các nhà thơ tượng trưng là sự chết chóc, sự huyền bí, mờ ảo, là nỗi buồn, là những giấc mộng, những cảnh sắc phản chiếu góc khuất tâm hồn. Điểm này được thể hiện tương đối rõ ngay trong tiêu đề các tuyển tập thơ, các bài thơ tượng trưng. Đó là những thi phẩm trong Hoa khổ đau (Les fleurs du Mal) của Charles Baudelaire: Ái tình và sọ người (L'amour et le crâne), Nỗi buồn của mặt trăng (Tristesses de la lune), ... Đó là Một mùa ở địa ngục (Une saison en Enfer), Vũ điệu của những người bị treo cổ (Bal des pendus), Người ngủ trong thung lũng (Le dormeur du val), Giấc mộng nghèo (Le pauvre songe) của Arthur Rimbaud. Đó là Cái chết (La mort), Đào huyệt (L'enterrement), Mưa trong tim (Il pleure dans mon coeur), Giấc mơ quen thuộc (Mon rêve familier), Thu ca (Chanson d'automne), Anh trắng (Clair de lune) của Paul Verlaine; là Mộ phần (Tombeau), Nỗi kinh hoàng (Angoisse), Lâu đài hi vọng (Le château de l'espérance), Giấc mơ cổ đại (Rêve antique), Hạ buồn (Tristesse d'été) của Stéphane Mallarmé…<\/p>\n<p>Soi vào hoàn cảnh lịch sử của nước Pháp thế kỷ XIX, chúng ta có thể lý giải tại sao các nhà thơ tượng trưng Pháp lúc bấy giờ lại mang tâm trạng buồn bã, chán chường, tuyệt vọng vào thơ ca như vậy. Bất bình, hoang mang trước một xã hội đầy rẫy những biến động, nhà thơ nhiều lúc muốn chối bỏ thực tại, có lúc muốn tìm đến cái chết, có khi lại tìm về một quá khứ huy hoàng hoặc bay đến thế giới tương lai mộng tưởng.<\/p>\n"], ["3.2.1. Sử dụng biểu tượng (symbole), hình ảnh so sánh (comparaison), ẩn dụ (métaphore)", 5, "<p>Thơ tượng trưng đề cao tính bí ẩn, huyền diệu của thi ca. Để gợi lên thế giới vô hình, các nhà thơ tượng trưng thường sử dụng những biểu tượng, hình ảnh so sánh, ẩn dụ nhằm biểu đạt một cách gián tiếp, ngầm ẩn thông điệp cần truyền tải cho độc giả. Điểm này hoàn toàn khác với lối miêu tả và biểu lộ tình cảm trực tiếp của chủ nghĩa lãng mạn. Bài thơ Chim hải âu (L'albatros) của Charles Baudelaire là minh chứng tiêu biểu của đặc điểm này.<\/p>\n"], ["3.2.2. Tính nhạc (Musicalité)", 5, "<p>Cùng với việc dùng biểu tượng, ẩn dụ để gợi tâm trạng, gợi thông điệp, các nhà thơ tượng trưng mặc dù rất chuộng thể thơ tự do song cũng đặc biệt chú ý tới vần (rime) và nhịp (rythme) tạo cho thơ mang đậm tính nhạc.<\/p>\n<p>Hãy cùng đến với bài thơ “Mưa trong tim” (II pleure dans mon coeur) của Paul Verlaine để cảm nhận những nốt nhạc ấy. Nhịp thơ biến đổi uyển chuyển từ 3/3 sang 2/4, tựa như tiếng mưa rơi tí tách: “Ô bruit doux de la pluie. Par terre et sur les toits!” Lối gieo vần cũng rất lạ, không phải theo kiểu đan chéo (rimes croisées - ABAB) hay bao bọc (rimes embrassées - ABBA) thường gặp mà gieo ba lần một vần trong một khổ thơ bốn câu (ABAA); khổ thơ thứ nhất và thứ ba gieo rime masculine<\/p>\n<p>(coeur, langueur, coeur/raison, trahison, raison), hai khổ còn lại gieo rime féminine<\/p>\n<p>(kết thúc bởi <strong>e<\/strong> câm: pluie, s'ennuie, pluie/peine, haine, peine). Chính sự lặp lại của các âm, các vần, đặc biệt là âm [r] tràn ngập đã tạo nên chất nhạc cho bài thơ, êm ái, du dương, đượm buồn man mác. Cái Tôi trữ tình của nhà thơ giao cảm với mưa theo kiểu “Người buồn cảnh có vui đâu bao giờ! Bài thơ có thể ví như một sự hòa quyện giữa mưa ngoài đời và mưa trong lòng tác giả. Mỗi từ ngân lên như một nốt nhạc hòa thành một khúc mưa buồn. Cũng dễ hiểu tại sao bài thơ lại được Christophe Bourjois Eau giữ nguyên vẹn phần lời và phổ nhạc thành bài hát cùng tên.<\/p>\n"], ["3.2.3. Sự sáng tạo về ngôn ngữ", 5, "<p>Một điểm nổi bật khác của thơ tượng trưng Pháp là sự sáng tạo về ngôn từ, trong đó phải kể đến Stéphane Mallarmé, người được coi là thần tượng của trường phái Tượng trưng. Mallarmé thật sự đã thay đổi quan niệm thơ ca, khai phóng ngôn ngữ. Theo ông, thơ ca là tôn giáo, là ngôn ngữ tượng trưng cho cuộc đời. Ông tìm kiếm một thứ ngôn ngữ toàn diện, mới mẻ, xa lạ với ngôn ngữ thông thường, tựa như bùa chú, cho phép diễn tả điều cốt lõi.<\/p>\n<p>Để minh họa cho thứ ngôn ngữ thần thánh đó, khi thì Mallarmé chọn cách chơi vần độc, vần lạ kiểu như trong bài Móng vuốt trong sạch (Ses purs ongles...): onyx, Phénix, ptyx, Styx, nixe, fixe, lampadophore, amphore, sonore, s’horore, or, décor, encore, septuor, nhằm tạo nên một không gian thần bí với đuốc, phượng hoàng, vò cổ, vàng, mã não, thủy thần...; lúc phá cách về ngữ pháp bằng cách ngắt tưởng chừng như vô lý chủ ngữ và động từ của câu (Quel sépulcral naufrage, tu/Le sais, écume, mais y baves) trong bài thơ “Trên đám mây trĩu nặng”, em... (À la nue accablante, tu...); có khi lại dựa vào những khoảng trống tạo hình từ việc trình bày thả lỏng theo kiểu ziczac mô phỏng nội dung như trong bài thơ “May rủi” (Un coup de dés jamais n'abolira le Hasard)...<\/p>\n<p>Sự sáng tạo về ngôn từ ở các nhà thơ tượng trưng Pháp còn cho độc giả được thưởng thức những hình ảnh đẹp và mới lạ. Cùng là mùi hương nhưng tùy theo tâm trạng mà được cảm nhận khác nhau. Nếu như trong bài Tương hợp<\/p>\n<p>(Correspondances), Charles Baudelaire gợi lên những mùi hương mát như da thịt trẻ con, ngọt ngào như tiếng sáo, xanh mượt như cỏ non: “Il est des parfums frais comme des chairs d'enfants/Doux comme les hautbois, verts comme les prairies,\" thì trong<\/p>\n<p>Khúc chiều tà (Harmonie du soir), nhà thơ lại tả hương hoa như hương trầm qua hình ảnh ví von hoa nở như lư trầm ngút khói hương: “Chaque fleur s'évapore ainsi qu’un encensoir;”. Cũng trong Khúc chiều tà, Baudelaire đã vẽ lên một cảnh hoàng hôn đỏ rực, buồn sâu lắng qua những hình ảnh so sánh, nhân hóa đầy táo bạo: Tiếng dương cầm run rẩy như trái tim sầu não; bầu trời đẹp và buồn như một hương án khổng lồ; mặt trời ngút trong biển máu đặc quánh.<\/p>\n<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p><p><em>=&gt; Với những nét đặc trưng về nội dung và nghệ thuật độc đáo nêu trên, thơ tượng trưng đã thổi luồng gió mới vào thi đàn Pháp, góp phần tạo nên cuộc cách mạng trong văn học Pháp những năm cuối thế kỷ XIX, đầu thế kỷ XX.<\/em><\/p>\n"], ["1. Tiểu sử:", 3, "<p>Baudelaire được sinh ra tại Pháp, vào ngày mùng chín tháng tư năm 1821, là một trong những nhà thơ có ảnh hưởng nhất đến nền văn học Pháp của thế ký XIX. Thậm chí, Victor Hugo đương thời còn công nhận Baudelaire là tác gia lớn nhất của nền thơ ca Pháp thế kỷ XIX. Ông thuộc trường phái chủ nghĩa tượng<\/p>\n<p>Năm 1827, cha ông qua đời. Sau đó, mẹ ông tái hôn và gửi ông vào một trường nội trú. Ông cùng gia đình tới Ấn Độ vào năm 1841. Khoảng một năm sau đó, ông trở về Paris, đối mặt với cuộc sống thiếu thốn và bắt đầu sáng tác. Ông có tham gia cuộc Cách mạng năm 1848 để kết thúc nền Quân chủ tháng Bảy. Trong thời kỳ này, ông gặp một phụ nữ đẹp tên là Jeanne Duval, và chính người này đã đem nhiều cảm xúc và thi hứng cho ông. Năm 1867, ông qua đời sau một thời gian ốm nặng.<\/p>\n<p>Nhiều công trình của Baudelaire đã được xuất bản sau khi ông qua đời, cũng như mẹ ông đã hoàn trả nhiều khoản nợ đáng kể đã ám ảnh cuộc đời ông. Cuối cùng phu nhân Caroline đã nhìn thấy giá trị trong sự nghiệp văn chương của con mình. \"Tôi thấy rằng, con trai tôi, sau tất cả các lỗi lầm của mình, cuối cùng cũng có chỗ đứng trong văn học\". Người mẹ ấy đã sống thêm bốn năm nữa sau sự ra đi của Baudelaire. Thiên tài đau khổ cả đời chờ đợi tình thương tuyệt đối từ mẹ mình, ít ra đã có được điều ông mong chờ nhất khi ông rời khỏi cuộc sống<\/p>\n"], ["2. Quan điểm nghệ thuật của Charles Baudelaire", 3, "<p>❖ <strong>Nghệ thuật là ám gợi:<\/strong><\/p>\n<p>Thơ ông chủ trương lối thơ gợi chứ không tả, một thứ thơ phải kết hợp được ở đó cả cảm xúc và trí tuệ.<\/p>\n<p>Đầu tiên, Baudelaire quan niệm: “Nghệ thuật thuần túy là gì, theo quan niệm mới? Là tạo ra một sức mạnh kỳ diệu gợi cảm, chứa đựng cả đối tượng lẫn chủ động, ngoại giới và tâm hồn nghệ sĩ”. Theo Baudelaire nghệ thuật là “ám gợi” (suggestion), có thể ám gợi bằng ngôn ngữ, hình ảnh, âm thanh, thông qua đó người đọc có thể liên tưởng đến một thế giới sâu xa hơn hoặc đưa lại những rung động tinh vi của đời sống tinh thần, tâm linh. Baudelaire chủ trương tạo ra những kết hợp từ mới, nhà thơ là người biết gia công từ để biến ngôn ngữ trở thành một thứ ma lực gợi cảm.<\/p>\n<p>Bỏ qua lối mòn của thơ ca truyền thống miêu tả thế giới hiện hữu và bộc lộ cảm xúc dâng trào, ngôn ngữ trong thơ Baudelaire phá vỡ cấu trúc thông thường bằng cách vận dụng cách sắp đặt từ mới không theo quy luật miêu tả mà theo quy luật liên tưởng bất ngờ đầy tính trực giác.<\/p>\n<p>Với quan niệm nghệ thuật là ám gợi, thơ Baudelaire đề cao biểu tượng. Biểu tượng không còn xa lạ trong văn học, tuy nhiên đến Baudelaire biểu tượng trong thơ có nội hàm và sắc thái khác biệt so với các trường phái trước đó. Không phải ngẫu nhiên mà Baudelaire được mệnh danh là “ông vua biểu tượng” của thơ Pháp mà ông chính là người tiên phong khai thác một cách rộng rãi nhất ưu thế của biểu tượng trong sáng tạo nghệ thuật. Baudelaire từng nói: “Chỉ có tưởng tượng là mang đầy chất thơ”. Bởi thế hình ảnh sử dụng trong thơ Baudelaire vô cùng phong phú, mang đặc tính gợi cảm khiến thơ mở ra một thế giới vô hạn<\/p>\n<p>❖ <strong>Nghệ thuật là khám phá và diễn đạt thế giới mới<\/strong><\/p>\n<p>Phải nói rằng bản chất của thơ Baudelaire là khám phá và diễn đạt thế giới mới bí ẩn và vô tận. Ông không hài lòng với thơ mô tả thế giới hữu hình, bề mặt, mà ông quan niệm nhà thơ là người được trao quyền năng khám phá thế giới bí ẩn vô hình ẩn sâu sau thế giới hữu hình, khám phá những địa hạc tâm linh và vũ trụ kỳ bí ẩn sâu sau lớp vỏ bọc vật chất.<\/p>\n<p>Thơ Baudelaire trở thành một mĩ học mới, không chỉ gắn liền với cảm nhận và khao khát của nhà thơ trong mục đích khám phá và diễn đạt thế giới thống nhất, trọn vẹn, mà thơ còn là nơi ở đó con người được thoát ra khỏi cái tầm thường của đời sống vật chất hạn hẹp, để hướng đến thế giới mới đầy mị lực. Quan niệm mới ấy của Baudelaire đã ảnh hưởng đến nhiều nhà thơ thế hệ sau.<\/p>\n<p>Trong thơ Baudelaire, khả năng khám phá và diễn đạt thế giới mới không tách rời tư duy tượng hợp và năng lực trực giác. Ông là người đầu tiên đề cập một cách rộng rãi sự tương hợp giữa các giác quan trong sáng tạo nghệ thuật. Theo Phùng Văn Tửu, “Baudelaire muốn ta lưu tâm đến mối tương quan huyền bí tạo nên sự thống nhất âm u và sâu xa của vũ trụ vượt ra ngoài sự cảm nhận hời hợt của các giác quan thông thường”<\/p>\n<p>❖ <strong>Sáng tạo nghệ thuật là hành trình cô đơn và xả thân của người nghệ sĩ<\/strong><\/p>\n<p>Baudelaire cho rằng: “Một số đông người nói rằng mục đích của thơ ca là một sự giáo huấn nào đó, rằng thơ ca phải trau dồi lương tâm, hoặc trau dồi phong tục, hoặc cuối cùng chỉ ra một cái gì đó hữu ích… Nhưng thơ ca không có mục đích nào khác, và sẽ không có bài thơ nào vĩ đại, cao quý, thực sự xứng đáng với tên gọi bài thơ, bằng một bài thơ được viết ra chỉ vì cái thú làm một bài thơ… Thơ ca không thể đồng hóa với khoa học hoặc với luân lý, dù phải chịu tội chết hoặc bị bỏ rơi: nó không lấy chân lý làm đối tượng, nó chỉ là chính nó”. Baudelaire đã sớm bộc lộ rõ quan niệm nghệ thuật vị nghệ thuật khi cho rằng nhà thơ phải là người sáng tạo ra một thứ thơ “thuần khiết”.<\/p>\n<p>Sự cô đơn và lạc lõng giữa xã hội của người thi sĩ không phải là những biểu hiện kỳ quặc của những tâm hồn “suy đồi” mà chính là sự tiên liệu nền nghệ thuật mới và đi trước thời đại khiến nhiều người khó chấp nhận. Không ở đâu xa, ngay chính Tập thơ Hoa của nỗi đau từ khi mới ra đời năm 1857 đã bị giới cầm quyền cấm lưu hành, tác giả bị phạt tiền và bị kết án “đã làm tổn hại tới nền đạo đức chung”. “Tội” của Baudelaire chính là đã đi trước thời đại mình, hướng đến một nền nghệ thuật mới đồng thời dũng cảm thể hiện nó bất chấp những rào cản của luật pháp, đạo đức chung của xã hội trưởng giả nặng tư duy duy lợi và của thói quen thưởng thức cái Đẹp đã từ lâu trở thành lối mòn. Sở dĩ Baudelaire - “người thi sĩ bị ruồng bỏ” (Le poète maudit - chữ dùng của Verlaine) bị xã hội cự tuyệt bởi ông đã có những khám phá độc đáo và có lối diễn đạt quá mới mẻ về thế giới và đời sống hoàn toàn xa lạ với nền nghệ thuật nặng tư duy duy lý bấy lâu. Sự xả thân vì nghệ thuật của ông dễ dàng nhận thấy trong toàn bộ tập thơ Hoa của nỗi đau từ nội dung đến hình thức diễn đạt.<\/p>\n"], ["L’albatros", 3, "<p>Souvent, pour s’amuser, les hommes d’équipage Prennent des albatros, vastes oiseaux des mers,<\/p>\n<p>Qui suivent, indolents compagnons de voyage,<\/p>\n<p>Le navire glissant sur les gouffres amers.<\/p>\n<p>À peine les ont-ils déposés sur les planches,<\/p>\n<p>Que ces rois de l’azur, maladroits et honteux, Laissent piteusement leurs grandes ailes blanches<\/p>\n<p>Comme des avirons traîner à côté d’eux.<\/p>\n<p>Ce voyageur ailé, comme il est gauche et veule!<\/p>\n<p>Lui, naguère si beau, qu’il est comique et laid!<\/p>\n<p>L’un agace son bec avec un brûle-gueule,<\/p>\n<p>L’autre mime, en boitant, l’infirme qui volait!<\/p>\n<p>Le Poète est semblable au prince des nuées<\/p>\n<p>Qui hante la tempête et se rit de l’archer;<\/p>\n<p>Exilé sur le sol au milieu des huées,<\/p>\n<p>Ses ailes de géant l’empêchent de marcher.<\/p>\n<p>(Charles Baudelaire)<\/p>\n"], ["Chim hải âu (bản dịch của Phạm Nguyên Phẩm)", 3, "<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p>"], ["Chim hải âu (Bản dịch của Chế Lan Viên)", 3, "<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p>"], ["Chim hải âu (Bản dịch của Đào Hữu Dương)", 3, "<p class=\"mut\"><i>[Trích thơ: xem trong tài liệu gốc]<\/i><\/p>"], ["2. Hoàn cảnh sáng tác", 3, "<p>Hoàn cảnh sáng tác - Bài thơ được nằm trong thi phẩm Les fleurs du mal (Hoa khổ đau) xuất bản lần đầu năm 1857 nhưng không được đón tiếp nồng nhiệt, vì nhiều bài thơ biểu tượng nhục tính, phản luân lý và đạo giáo, và cũng vì thế mà ông và nhà xuất bản đã bị đưa ra toà và bị phạt vạ. Sáu bài thơ trong thi phẩm này đã bị kiểm duyệt cắt bỏ. Sau này ông sáng tác thêm 35 bài thơ mới, tái bản lần thứ 2 vào năm 1861, nhưng những bài đã bị kiểm duyệt vẫn chưa được thêm vào. Sau khi ông qua đời năm 1867, bản cuối cùng được xuất bản năm 1868 với một số bài thơ mới, nhưng cũng không có sáu bài đã bị kiểm duyệt trong các lần trước. Hoa khổ đau là một thi phẩm nổi tiếng của ông, mà chính tác giả đã bộc bạch thổ lộ: “viết với tất cả con tim và hận thù...” cho lý tưởng và nghệ thuật. Đó là những nối tiếp của đau thương, thất vọng, …<\/p>\n"], ["3. Nội dung", 3, "<p>Bài thơ “Chim hải âu” tiêu biểu cho thơ Bô-đơ-le về nghệ thuật tượng trưng và tư tưởng yếu đuối, chán chường, tuyệt vọng của nhà thơ trong cuộc sông đương thời. Bài thơ “Chim hải âu” hình thành từ cảm hứng trong chuyên đi lênh đênh trên Ấn Độ Dương. Lần đầu tiên nhà thơ cảm thấy những cánh hải âu bay lượn trên bầu trời mênh mông giữa biển khơi sao mà đẹp, nhưng rồi những cánh chim trời - ông hoàng của biển khơi - lại lếch thếch vụng về thảm bại trên sàn tàu làm trò đùa cho các thủy thủ. Trong nỗi đau khổ, cô đơn, chán chường, tuyệt vọng, nhà thơ đã chọn chim hải âu tượng trưng cho nhà thi sĩ.<\/p>\n"], ["1.1. Bài thơ là sự thổ lộ tình cảm mãnh liệt đã được ý thức", 4, "<p>Uy-li-am Uốt – thi sĩ người Anh có câu: <em>“Thơ ca là sự bột phát của những tình cảm mãnh liệt”<\/em> chính là khi tâm hồn của nhà thơ xuất hiện những rung động, xúc cảm trước cuộc đời mà bộc bạch nên câu chữ rồi kết thành những bài thơ. Con sóng lòng tràn bờ, tràn trên con chữ thành thơ. Và tác phẩm “Chim hải âu” của Baudelaire cũng được ra đời như thế. Bài thơ như được Baudelaire gửi gắm những nỗi cô đơn, là dòng tâm sự, sự bất lực đối với cuộc sống đương thời chán chường và tuyệt vọng, cũng đồng thời là số phận của chính mình trong xã hội.<\/p>\n<p>Bài thơ “Chim hải âu” được Baudelaire lấy cảm hứng trong chuyến đi lênh đênh trên Ấn Độ Dương. Lần đầu tiên nhà thơ cảm thấy những cánh hải âu bay lượn trên bầu trời mênh mông giữa biển khơi sao mà đẹp, nhưng rồi những cánh chim trời - ông hoàng của biển khơi - lại lếch thếch vụng về thảm bại trên sàn tàu làm trò đùa cho các thủy thủ. Trong nỗi đau khổ, cô đơn, chán chường, tuyệt vọng, nhà thơ đã chọn chim hải âu tượng trưng cho nhà thi sĩ. Bài thơ biểu hiện lên những xúc cảm nội tâm, là cảm nhận của con người trước những sự việc, cho ra thấy được chủ thể con người bên trong.<\/p>\n<p>Tác giả Baudelaire mượn hình ảnh những cánh chim hải câu để gửi gắm những tâm sự, trăn trở của mình một cách vô cùng đặc biệt trong bốn khổ thơ. Bài thơ không chỉ để kể câu chuyện của chú chim hải âu mà ẩn sau nó là nỗi niềm trăn trở của một nhà thi sĩ. Tác giả cảm nhận được rằng mình đang giống hoàn cảnh của chú chim biển lúc đó. Hình ảnh chú chim hải âu được tác giả miêu tả hình ảnh đối lập: lúc chúng sải “cánh to” tự do bay lượn trên bầu trời, loài chim biển to lớn vừa bay theo những con tàu trên đại dương đến lúc bỗng chốc trở thành trò chơi của các thủy thủ độc ác. Trong hình ảnh đối lập ấy, cảm hứng của nhà thơ nghiêng về phía mệt mỏi, uể oải của cánh chim, hải âu không còn là nó nữa. Và hoàn cảnh của Baudelaire cũng giống chú chim hải âu vậy. Lúc mà ông được tự do sáng tác, tự do bộc bạch những nỗi niềm, tâm tư tình cảm chân thật và mãnh liệt của mình qua những trang thơ, được sống là chính mình cũng giống những chú chim hải âu được sải đôi cánh to rộng lớn bay lượn trên bầu trời, tự do tận hưởng cuộc sống. Còn khi những chú chim trở thành trò chơi của lũ thủy thủ độc ác cũng giống như số phận của nhà thơ bị chính những con người trong xã hội đương thời đem ra chỉ trỏ, miệt thị bởi những tư tưởng mới mẻ khác xa với văn chương bình thường lúc bấy giờ. Hơn nữa còn đi ngược lại với những “thuần phong mỹ tục” của xã hội nước Pháp lúc bấy giờ. Tình cảm mãnh liệt được nhà thơ thể hiện ở đây là sự chán chường, nỗi cô đơn tuyệt vọng nằm sâu thẳm trong tâm hồn chứ không phải sự kêu gào than khóc ở bên ngoài. Sự thổ lộ tình cảm mãnh liệt được nảy sinh, xuất phát từ sự tàn ác mà ra. Đối tượng của thơ là tình cảm, cảm xúc bên trong của tác giả nhưng mà không phải tự nhiên mà cần có lí do để sự đau khổ mãnh liệt kia được bộc phát, và sự tàn ác của đám thủy thủ chính là lý do. Đám thủy thủ trở nên tàn bạo và thô lỗ qua lời kể của tác giả, trở thành những kẻ săn chim hải âu trên biển. Việc bắt nạt chim hải âu trở thành thú vui cho họ, chỉ là việc làm để “cho vui”, được thể hiện ngay trong dòng đầu của bài thơ. Ta nhận thấy rõ ràng có một sự chênh lệch lớn giữa hai hình ảnh: những người đàn ông với chú chim hải âu. Những hành động của thủy thủ cho thấy sự độc ác như: ghẹo, bắt chước, là chủ thể của các hành động: “lấy đi”; “đùa bỡn”. Còn chim hải âu là chủ thể của bị động: “vụng về”; “hài hước”; “xấu xí”. Chim hải âu như một món đồ chơi cho đám thủy thủ bắt nạt cười nhạo, chế giễu một cách tự nhiên. Đám thủy thủ như thể đại diện cho xã hội Pháp thời bấy giờ, họ chế giễu và không chấp nhận phong cách sáng tác thơ của Baudelaire, họ cho rằng những quan điểm ấy khác người thậm chí mỉa mai đối với các học thuyết xã hội, hiện thực và tự nhiên có trong các tác phẩm của ông và bắt ông phải sống giống như họ.<\/p>\n<p>Qua đó ta hiểu được sự tàn ác của thủy thủ ta biết được tâm trạng và cảm xúc của nhà thơ. Ở đây nhà thơ vẫn làm chủ được tình cảm mãnh liệt của mình bằng tư tưởng. Dường như những tư tưởng của ông đi ngược lại đám đông, ngược cả lại với “thuần phong mỹ tục” của nước Pháp, đó là nguyên nhân khiến cho những tác phẩm của Baudelaire bị chỉ trích và lên án. Ông coi những người không hiểu được tư tưởng trong thơ của ông, giễu cợt chỉ là tầm thường không cùng “đẳng cấp” với ông. Ông mượn hình ảnh chim hải âu để nói lên hoàn cảnh của mình, tác giả cảm giác như mình không thuộc về thế giới này mà là phải sải rộng cánh bay trên bầu trời chứ không phải là “đi bộ bằng đôi chân”. Những cảm xúc tình cảm mãnh liệt được truyền tải qua những câu thơ và phải là những cảm xúc đau khổ, cô đơn chán chường đến tột cùng mới có thể bộc lộ lên những câu thơ như thế. Những tình cảm của Baudelaire truyền tải là một thứ tình cảm lớn, mang một phạm trù nhân loại, đi trước cả thời đại. Chưa có ai trước đó dám viết lên những điều như ông viết, nhưng theo thời gian, qua hàng thế kỉ, thơ của ông lại được đón nhận nồng hậu của độc giả, điều đó đã chứng minh thơ của ông có một tầm ảnh hưởng và sức vang rất lớn. Thơ ca như một phương tiện, vũ khí và là sự giải thoát cho tâm hồn của những nhà thơ đương thời, điển hình là Baudelaire - ông đã sử dụng thơ là một hình thức văn học tiêu biểu để gửi gắm những tâm tư tình cảm của mình vào nó.<\/p>\n"], ["1.2. Nghệ thuật của trí tưởng tượng", 4, "<p>Đối với Baudelaire, trí tưởng tượng là “bà hoàng của mọi khả năng”. Nó thay thế cho sự kiện bằng “một thể hiện theo truyền thuyết về đời sống bên ngoài”; cho hành động, sự mơ mộng. Như chúng ta đã biết ở trên thì Baudelaire đã dùng câu chuyện bất hạnh của con chim hải âu để nói lên thân phận của chính mình trong xã hội đương thời. Dùng câu chuyện trong chuyến hành trình lênh đênh trên biển Ấn Độ Dương để kể lên câu chuyện của chính cuộc đời mình. Vì thế nên những hình ảnh trong bài thơ có thể nói là chân thực, giống như kể lại một câu chuyện. Ở đây tác giả không sử dụng quá nhiều trí tưởng tượng nhưng nó vẫn được sử dụng như trong hình ảnh:<\/p>\n<p>“Kéo đôi cánh trắng to bè<\/p>\n<p>Như đôi chèo rộng lê thê bên mình”<\/p>\n<p>Tác giả đã so sánh “đôi cánh trắng” của chim hải âu với “đôi chèo rộng”. Một sự liên tưởng so sánh khá thú vị. Chim hải âu đã bị mất đi sự tự do, không còn được tự do sải đôi cánh để bay lượn trên bầu trời nữa mà hoàn cảnh của nó bây giờ trở nên thật tệ hại, nó nằm trên sàn tàu bằng gỗ, trở thành thú vui cho đám thủy thủ độc ác, thật đáng thương làm sao. Mất đi đôi cánh, chim hải âu dường như không còn vẻ đẹp uy nghi vốn có của nó nữa, đôi cánh dùng để bay và là sức mạnh duy nhất của nó đã trở nên vô dụng, bất lực. Baudelaire chọn hình ảnh “đôi chèo rộng” để so sánh mà không phải hình ảnh khác là gì, dựa theo bối cảnh thì chúng ta cũng dễ dàng nhận ra được sự hợp lí khi tác giả lại chọn hình ảnh mái chèo. Khi mà bối cảnh đang được diễn ra trên một con thuyền lênh đênh trên biển, mái chèo là thứ giúp con thuyền có thể di chuyển được, công dụng của nó cũng tương tự như đôi cánh của chú chim hải âu dùng để bay lượn. Đôi cánh đối với chú chim hải âu được coi là niềm tự hào vĩ đại của mình thì với đôi chèo như một sư vật tầm thường, khác xa với một loại vật được coi là “vua của trời xanh”. Hình ảnh “đôi chèo” cũng được tác giả sử dụng xuyên suốt bài thơ, thể hiện nghệ thuật ngôn từ mà tác giả muốn nhấn mạnh. Xuyên suốt bài thơ, câu chuyện được nhà thơ Baudelaire thuật lại qua những hình ảnh rất chân thực, thực tế nhưng vẫn xuất hiện những hình ảnh liên tưởng, tưởng tượng - một đặc trưng thể loại thơ và phát huy được hết công dụng và vẫn vô cùng xuất sắc.<\/p>\n"], ["1.3. Tính cá thể hóa của tình cảm trong bài thơ “chim hải âu”", 4, "<p>Tính cả thể hóa của tình cảm trong bài thơ “Chim hải âu” được thể hiện khá rõ. Qua bài thơ đọc giả như được tiếp cận với một quan điểm của một cuộc đời, một tâm hôn rất khác biệt, có chất riêng. Thơ của Baudelaire chính là tấm gương phản chiếu hay nói cách khác là một bản sao của ông. Qua bài thơ “Chim hải âu” ta thấy chân dung về một cuộc đời trải qua sóng gió, khốn khổ, có quan điểm sống mà tư tưởng riêng nhưng không được chấp nhận và đồng cảm.<\/p>\n<p>Tác phẩm kể về cuộc đời khốn khổ của chú chim hải âu khi bị đem là đùa giỡn, trở thành thú vui cho đám thủy thủ, thông qua đó ta cảm nhận được sự đau khổ của chính nhà thơ. Khác với hình ảnh loài chim hải âu mà chúng ta biết, nó là “vua của bầu trời” là một loại chim biển lớn với đôi cánh được coi như một sự vĩ đại, chúng tự do sải cánh bay lượn trên bầu trời với đôi cánh to lớn và có vẻ khá vụng về khi phải sử dụng đôi chân. Nhưng ở đây, ngay từ đầu bài thơ, Baudelaire lại cho chúng ta thấy một hình ảnh trái ngược hoàn toàn. Từ đầu bài thơ, chim hải âu đã trở thành thú vui tiêu khiển trong trò chơi của những người thủy thủ. Từ đầu chúng bay lượn trên bầu trời lướt trên những cơn sóng biển nhưng đến khổ thứ hai thì khác, nó bị bắt và ném lên sàn gỗ của tàu con tàu. “Đôi cánh to” dường như lại trở thành điểm yếu cho sự chế giễu ở khổ dưới, giờ đây, đôi cánh trở nên vô dụng bởi những trò chơi độc ác của con người. Đôi cánh và dáng đi nặng nề của nó bị đám thủy thủ trêu đùa cười cợt và coi thường. Được coi như là “vua của trời xanh” nhưng bây giờ lại trở nên như một vật tàn phế với “đôi chèo nặng lê thê bên mình”. Cái hữu dụng duy nhất đối với nó thì giờ đây lại trở nên vô dụng, không thể trở về với thế giới thuộc về nó mà buộc phải chấp nhận sống với thế giới có thể nói là thấp kém hơn bản năng mà nó có được.<\/p>\n<p>Qua đó ta thấy “Chim hải âu” là đại diện hình ảnh của nhà thơ Baudelaire với xã hội, thời đại mà ông đang sống. Cũng giống như chim hải âu là vua của bầu trời thì Baudelaire cũng được coi là một thiên tài, ông vốn là một người có đầu óc thông minh, ham học hỏi, hiểu biết, có năng khiếu viết thơ và đặc biệt có sức hút sâu sắc với cái đẹp và nhiều tài năng khác được cô đọng lại trong những tác phẩm của ông. Ông đem tất cả những tài năng đó đem vào thơ của mình một làn gió mới, một quan điểm mới mẻ khác xa với những quan điểm thời bấy giờ. Nhưng nó lại trở thành chủ đề được đem ra giễu cợt, mỉa mai và xỉ nhục. Xã hôi đặt tên cho ông là một “nhà thơ đốn mat” vì ông dám viết lên những điều cấm kỵ gây tranh cãi, chưa phù hợp với nhân sinh quan thời đó… và nhất là sự thiếu vắng cảm thức về cái đẹp và tốt lành trong con người. Bài thơ “Chim hải âu” trong chùm thơ “Những bông hoa ác” đã khiến ông không ngừng bị trì triết và lên án vì ông thể hiện trong đó là sự độc ác, coi xã hội là những thứ thấp hèn, “những tiếng la ó”.<\/p>\n<p>Khổ thơ cuối cùng, Baudelaire đã tự đồng nhất mình với cánh chim hải âu để nói lên tư tưởng, cảm xúc của mình, ông lựa chọn hình ảnh chim hải âu để đại diện cho chính bản thân, hoàn cảnh của ông tương tự như số phận của chú chim vậy. dường như ông đang sống trong thế giới của riêng mình mà không có một ai hiểu được. Tuy nhiên không vì thế mà ông chịu thua hay buông bỏ việc sáng tác, ông vẫn cứ viết và thể hiện cái đẹp trong thơ một cách hiên ngang. Thơ như là một bàn đạp giúp ông hướng tới cái đẹp, một thế giới cao khác, ở đó ông nhìn xuống sự thấp hèn của xã hội. Dường như Baudelaire đã bị mắc kẹt giữa hai thế giới: thế giới nội tâm bên trong con người ông và thế giới bên ngoài, hai thế giới đối lập hoàn toàn nhau, Nội tâm bên trong của ông là khao khát có được bầu trời của một, ông coi đó là thế giới cao thượng mà mình thuộc về khác với thế giới bên ngoài tầm thường kia. Thứ ông có là “đôi cánh to và rộng” nhưng người ta lại bắt ông đi bằng “đôi chân”, ông vượt lên trên cõi thường, nhưng khi lẫn vào đám đông, ông lại chẳng là gì. Baudelaire là một phần của thế hệ những nhà thơ bị nguyền rủa, nghĩa là những người cùng thời với ông không hiểu được. Bài thơ chính là sự biểu hiện của tự do tinh thần, nỗi cô đơn của nhà thơ. Nhà thơ nhận ra khả năng “bay” của mình nhưng cũng nhận ra sự đối nghịch của hiện thực khắc nghiệt và đau đớn.<\/p>\n<p>Về sau, những bài thơ của ông dần dần được chấp nhận và hơn nữa còn trở thành những bài thơ bất hủ. Các tác phẩm được thể hiện những cảm xúc riêng nhưng lại khát quát được xã hội, nhân loại, có ý nghĩa và giá trị thẩm mĩ, nhân văn khá sâu sắc. Cụ thể là bài thơ “Chim hải âu” không chỉ là tiếng nói cá nhân của riêng nhà thơ mà còn giúp những thế hệ sau tìm thấy được những băn khoăn về sự công nhận của xã hộ hay tự do về tinh thần để đặt ra những vấn đề nhân sinh quan trong thế giới ngày nay.<\/p>\n<p>Theo từng thế kỉ, mọi thứ dần dần đổi thay, con người ngày càng được phát triển, trong thời đại của Baudelaire thì những bài thơ của ông không được công nhân nhưng đối với một thời đại mới như bây giờ thì chúng lại trở nên bất hủ. Tư tưởng và phong cách của ông đã góp một phần ảnh hưởng tới những thế hệ sau. Hình ảnh “chim hải âu” trở nên đồng điệu về tâm hồn với con người và góp phần khai phá ra một trường phái mới: trường phái thơ tượng trưng chủ nghĩa mà do chính Baudelaire là người đặt nên nền móng và xây dựng lên trường phái này, có rất nhiều các nhà thơ cũng đã chịu ảnh hưởng bởi phong cách sáng tác của ông trong đó có các nhà thơ Việt Nam.<\/p>\n"], ["1.4. Chất của thơ", 4, "<p>Nhà phê bình Trung Quốc đời Thanh là Diệp Tiếp trong sách Nguyên thi có nói: “Cái lí có thể nói, ai cũng nói được, đâu cần nhà thơ nói lên. Cái việc có thể chứng kiến, ai cũng kể lại được, đâu cần nhà thơ kể lại. Phải có những cái lí không thể nói, có những việc không thể kể, khi gặp thì chỉ hiểu ngầm qua hình dáng ý nghĩa, mà lí và việc cũng đã tường như thế”. Đó chính là cái chất thơ của đời sống. Thơ không nói ở những điều nó viết ra, mà nói ở những chỗ trống không viết ra, ở chỗ trắng, chỗ im lặng giữa các chữ, các lời. Trong thơ có ý nghĩa mặt chữ, ý nghĩa của logic, ý nghĩa trong hình tượng nhưng đó không phải là ý nghĩa có tính thơ. Cái ý nghĩa có tính thơ là ý nghĩa ngoài lời, ngoài hình ảnh, do chính lời và hình ảnh gợi lên.<\/p>\n<p>Đối với Baudelaire, thơ đối với ông không phải sự bộc bạch những trạng thái cảm xúc bình thường, mà phải hướng đến thể hiện những tri thức huyền nhiệm và chỉ có thơ mới diễn tả được. Thơ chính là tấm gương phản ánh thế giới thực, thơ là gợi chứ không vẽ các đường nét. Để người đọc liên tưởng, tưởng tượng chứ không phải hình dung. Qua tác phẩm “Chim hải âu” ở trên ta liên tưởng đến được tác giả, một chân dung của Baudelaire được khắc họa trong đó, và những khổ đau mà ông đã phải trải qua. Không chỉ thế, chuyến đi để ông lấy nguồn cảm hứng viết lên bài thơ này do chính bố dượng của Baudelaire - tướng quân Aupick đã buộc ông phải tham gia chuyến đi này với hi vọng rằng ông sẽ sửa chữa những hành vi sai trái. Baudelaire lại cực kì ghét chuyến đi này. Nhưng cũng vì chính chuyến đi này đã đánh thức trong ông sở thích về thơ tượng trưng thấm nhuần trong mọi tác phẩm của ông sau này.<\/p>\n<p>Bài thơ không đơn thuần chỉ là việc bắt nạt giữa đám thủy thủ với chú chim hải âu, nếu ta nhìn với góc độ khác ta sẽ thấy sự mở về không gian là sự đối lập giữa hai thế giới: một bên là thế giới nơi nhà thơ yêu lý tưởng bay lượn, bên kia là thế giới của những con người hạn chế và ác độc. “L'Albatros” tố cáo thú vui tiêu khiển mà “kẻ thô tục” có được khi làm điều ác, và đặc biệt, khi hành hạ nhà thơ. Khiến Baudelaire cảm thấy ghê tởm \"đám đông thấp hèn\". Thứ gây ức chế nhất với nhà thơ chính là sự ích kỉ xấu xa của loài người, những con người mà tinh thần của họ dường như tê liệt và một bản chất xấu xa vắng vẻ ý thức về cái đẹp và cái thiện. Baudelaire viết những tác phẩm của ông luôn thoát li khỏi những điều thô tục ấy, coi mình là người “bên trên” nhìn xuống “bên dưới” với thái độ chán ghét. Thơ đối với ông chính là sự nổi dậy.<\/p>\n<p>Trong bài thơ “chất thơ” của ông thể hiện lên bằng hình ảnh chú chim hải âu mà không phải một loài chim nào khác. Ông chọn một biểu tượng đau đớn hơn: chim hải âu đại diện cho nhà thơ bị hiểu lầm, những người mà sự vượt trội về mặt đạo đức của họ đã loại trừ họ khỏi xã hội của họ. Baudelaire gợi lên sự đối xử mà xã hội gây ra cho nhà thơ. Tự đại diện cho bản thân, con chim bị bắt, bị chế giễu và ngược đãi là hiện thân của nghệ sĩ bị hiểu lầm và bị từ chối. Hình ảnh chim hải âu còn nói lên cái quan điểm của người thi sĩ. Người làm thơ phải vươn đến những giá trị thẩm mỹ tươi đẹp, đứng trên cao bất chấp bão giông. Thơ là để dành cho cái đẹp.<\/p>\n<p>Hình ảnh “Chim hải âu” bị ngược đãi được so sánh và nhà thơ bị lăng mạ dường như quá rõ ràng. Câu khẳng định ở khổ thơ thứ tư “Thi nhân như loài chim vua ấy” đã không còn chỗ cho sự gợi ý. Tuy vậy bài thơ vẫn là sự đóng góp quan trọng trên hành trình sáng tác của Baudelaire.<\/p>\n"], ["2.1. Thơ biểu hiện bằng biểu tượng, ý tượng", 4, "<p>Để có thể thể hiện rõ nét những tư tưởng, những điều muốn truyền tải. thơ ca thường dùng các biểu tượng, ý tượng mang ngụ ý. Đặc biệt trong trường phái thơ tượng trưng biểu tượng, ý tượng là một điều không thể thiếu. Ngay từ nhan đề bài thơ Baudelaire đã mở ra một hình ảnh biểu tượng: “chim hải âu”. Chim hải âu là một loài chim biển có thân dài, cánh chim to, rộng. Đôi chân cao, gầy đặc trưng. Đôi cánh nặng nên di chuyển khó khăn. Tác giả đã có những ý đồ của mình khi lựa chọn chim hải âu làm hình ảnh xuyên suốt toàn bài.<\/p>\n<p><em>a. Hình ảnh - biểu tượng chim hải âu<\/em><\/p>\n<p>Chim hải âu tượng trưng cho thi sĩ. Hình tượng này một mặt nói lên cái cao đẹp của nhà thơ với tư thế hiên ngang, vùng vẫy trời cao, bất chấp bão giông, không quen, không ưa những gì tầm thường, nhỏ mọn; nhưng mặt khác lại cũng nói lên cái cao đẹp của nhà thơ trong quan niệm của Bô-đơ-le, đứng trên cao, coi thường quần chúng và xa rời cuộc sống đời thường. Có lẽ Bô-đơ-le thiên về mặt thứ hai. Tứ thơ tương phản trời cao và mặt đất quán xuyến trong toàn bài thơ. Bô-đơ-le quan niệm thi sĩ là hạng người cao siêu bị lưu đày xuống cõi trần tục, không thể nào thích nghi nổi:<\/p>\n<p>“Đọa đày giữa đám ghét ghen” (Nguyên văn: “Bị đày xuống đất giữa những lời la ó”)”.<\/p>\n<p><em>b. Hình<\/em> ảnh <em>- biểu tượng đôi cánh chim hải âu<\/em><\/p>\n<p>Có đôi cánh cụ thể (đôi cánh chim hải âu) và đôi cánh trừu tượng (đôi cánh tư tưởng của nhà thơ). Trong khoảnh khắc tuyệt vọng, Bô-đơ-le đã lấy chim hải âu làm hình ảnh tượng trưng cho thi sĩ. Đồng nhất đôi cánh trừu tượng của thi sĩ với đôi cánh của chim hải âu là nhà thơ đã tự thủ tiêu đôi cánh của mình. Khi đôi cánh hải âu tuyệt vời nhất, đôi cánh tung bay ngang dọc trên biển khơi, “ông hoàng của trời xanh” thì cũng không sánh được với đôi cánh trừu tượng kì diệu của nhà thơ, đôi cánh cụ thể hữu hạn, đôi cánh trừu tượng vô hạn. Khi hải âu bị lụy trên sàn tàu thì đôi cánh trở thành tai họa, còn ngay cả khi thi sĩ bị “đọa đày” thì đôi cánh trừu tượng vẫn bay lên, bị nhốt trong lồng đôi cánh tư tưởng vẫn bay lên:<\/p>\n<p><em>c. Hình<\/em> ảnh <em>- biểu tượng những người thuỷ thủ<\/em><\/p>\n<p>Tác giả không nhắc đến một người thủy thủ cụ thể mà chỉ chung bằng những danh từ chung. Bằng những hành động của mình, hình ảnh người thủy thủ hiện lên như một thống lĩnh của mặt đất. Hìn
