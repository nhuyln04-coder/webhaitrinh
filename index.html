$("#jour").innerHTML='<div class="card cr"><p class="tag">Nhật ký ôn thi</p><h2>Em đang đứng ở đâu?</h2><p class="mut">Phần chuyên đề tự tính theo sao em đạt trong hải trình. Phần rubric do em tự chấm: chạm để đổi mức. Mức “Tầm HSGQG” nghĩa là em viết được một đoạn trọn vẹn mà không nhìn tài liệu.</p><div class="bar"><i style="width:'+p+'%"></i></div><b>Hải trình: '+p+'%</b><h3>Chuyên đề đã chinh phục</h3>'+R.map((r,i)=>'<div class="rw"><span>'+r[1]+"</span>"+stars(Math.floor(rs(i)/4))+"</div>").join("")+'<h3>Rubric tự đánh giá</h3>'+RUB.map((g,i)=>{const v=S.rb["r"+i]||0;return '<div class="rw" style="flex-wrap:wrap"><span><b>'+g[0]+'</b>'+(v?"<br><small class=\"mut\">"+g[1][v-1]+"</small>":"")+'</span><button class="lvb l'+Math.min(3,v)+'" onclick="cy(\'r'+i+'\')">'+RL[v]+"</button></div>"}).join("")+'<h3>Kiến văn</h3><p>Đã đọc '+rd+'/'+bk.length+' tác phẩm trong Kho tinh hoa. <button class="ch" onclick="go(\'lib\')">Mở kho</button></p><h3>Tự học từ nguồn mở</h3>'+SRC.map((x,i)=>'<label class="ck"><input type="checkbox" '+(S.src[i]?"checked":"")+' onchange="sc('+i+')"> '+x+"</label>").join("")+'<p class="mut">Quy tắc chuyển hóa tri thức: đừng nghe thụ động. Mỗi video, ghi ngay [khái niệm cốt lõi] → [dẫn chứng điện ảnh hoặc văn học] → [mẫu câu ứng dụng vào bài văn].</p><h3>Hồ sơ bài viết</h3><p class="mut">Lưu bài viết theo thời gian để thấy lỗi lặp lại (tóm tắt truyện, thuật ngữ suông). Chép lại và biên tập các bài đạt giải Nhất quốc gia để cảm nhận đường dây lập luận.</p></div><div class="card cr"><h2>Nhà văn cần những gì?</h2><p>Học sinh chuyên văn trước hết phải là người đọc ngang tầm với người đọc mà nhà văn mong đợi, rồi mới học viết bằng giọng của chính mình. Sáu nhân tố dưới đây là chiếc gương để mình soi.</p>'+WR.map(w=>'<p><span class="role">'+w[0]+"</span>"+w[1]+"</p>").join("")+'<p class="mut">Thêm một điều kiện bên ngoài: môi trường sáng tạo tự do, và cơm áo tạm đủ để người viết còn đủ lòng mà viết.</p></div>'}
/* ===== Nhận định: bốn cấp câu hỏi, trả lời theo hình thức nào cũng được ===== */
const NH=[
{id:"gorky",q:"Văn học là nhân học.",who:"Thường được dẫn là lời của M. Gorky",tag:"Bản chất và chức năng của văn học",T:[
["Nhận định trên bàn về vấn đề nào của lí luận văn học: nguồn gốc, bản chất hay chức năng? Chép lại hai từ khoá quan trọng nhất.","Hai từ khoá là “văn học” và “nhân học” (khoa học về con người). Nhận định bàn về bản chất của văn học: đối tượng trung tâm của văn học là con người."],
["Giải thích bằng lời của em: vì sao có thể nói văn học là một thứ “học” về con người? Viết khoảng hai đến ba câu.","Gợi ý: văn học không đo đạc con người như khoa học tự nhiên. Văn học khám phá đời sống bên trong, như ham muốn, lòng nhân ái, bi kịch, bằng hình tượng và bằng trải nghiệm của người đọc."],
["Chọn một tác phẩm em đã đọc. Nêu một chi tiết giúp ta hiểu con người sâu hơn, rồi nói chi tiết ấy chứng minh điều gì cho nhận định.","Ví dụ: Macbeth cho thấy Lady Macbeth bị lương tâm đeo bám dù ban ngày bà tỏ ra lạnh lùng; Biến hình cho thấy con người bị đo bằng giá trị lao động. Điều quan trọng là chỉ rõ chi tiết và nói nó giúp ta hiểu thêm điều gì về con người."],
["Nhận định này có giới hạn nào? Nêu một tác phẩm hoặc một cách đọc khiến ta thấy không thể chỉ coi văn học là sự tìm hiểu con người.","Gợi ý: văn học còn là nghệ thuật ngôn từ, có cái đẹp của hình thức và tự do tưởng tượng. Có bài haiku chỉ gợi một khoảnh khắc cảm xúc, không “nghiên cứu” con người theo nghĩa lí tính."]]},
{id:"kafka",q:"Một cuốn sách phải là chiếc rìu bổ vào biển băng đóng trong ta.",o:"Ein Buch muss die Axt sein für das gefrorene Meer in uns.",who:"Franz Kafka, thư gửi Oskar Pollak, 1904",tag:"Chức năng đánh thức của văn học",T:[
["Nhận định dùng hai hình ảnh nào? Hãy nói mỗi hình ảnh tương ứng với điều gì trong đời sống con người.","“Chiếc rìu” tương ứng với sức đánh thức của sách. “Biển băng đóng trong ta” là những cảm xúc và nhận thức bị đóng băng, bị né tránh."],
["Giải thích: vì sao Kafka muốn sách làm ta xúc động mạnh chứ không chỉ làm ta dễ chịu? Viết hai đến ba câu.","Trong bức thư ấy, Kafka nói ta cần những cuốn sách tác động đến ta thật mạnh. Ý chính: văn học lớn buộc người đọc đối diện với điều mình vẫn tránh."],
["Chọn một tác phẩm đã khiến em thấy một điều trong mình bị đánh thức. Chỉ ra chi tiết đã làm điều đó.","Ví dụ: cảnh Gregor lo lỡ chuyến tàu đánh thức câu hỏi về kỉ luật lao động; tiếng nước trong một bài haiku làm ta nghe lại sự yên lặng. Hãy nói rõ chi tiết và điều nó đánh thức."],
["Văn học có phải lúc nào cũng phải đánh thức bằng nỗi đau không? Nêu một chức năng khác và bảo vệ ý kiến của em.","Gợi ý: văn học còn có chức năng thẩm mĩ, giải trí, an ủi. Nhận định của Kafka nói về một phẩm chất của sách lớn, chứ không định nghĩa toàn bộ văn học."]]},
{id:"calvino",q:"Tác phẩm kinh điển là cuốn sách chưa bao giờ nói hết điều nó phải nói.",o:"Un classico è un libro che non ha mai finito di dire quel che ha da dire.",who:"Italo Calvino, Perché leggere i classici",tag:"Tiếp nhận và sức sống của tác phẩm",T:[
["Từ khoá của nhận định là gì? Nhận định bàn về sáng tác hay về tiếp nhận?","Từ khoá: “kinh điển”, “chưa nói hết”. Nhận định bàn về tiếp nhận: sức sống bền lâu của tác phẩm qua nhiều thế hệ người đọc."],
["Giải thích vì sao một tác phẩm có thể “chưa nói hết” dù đã được đọc hàng trăm năm.","Nghĩa của tác phẩm mở ra mỗi khi có người đọc mới với câu hỏi mới. Ngôn từ văn chương nhiều tầng nghĩa, và văn bản luôn để lại khoảng trống cho người đọc."],
["Chọn một tác phẩm kinh điển. Nêu hai cách đọc khác nhau, rồi nói cả hai đều có chỗ dựa trong văn bản.","Ví dụ: cảnh mộng du của Lady Macbeth có thể đọc qua vô thức (Freud) hoặc qua hậu quả đạo đức và chính trị của việc giết vua. Mỗi cách đọc phải chỉ ra được chi tiết làm căn cứ."],
["Ai quyết định một tác phẩm là kinh điển? Hãy phản biện: có tác phẩm nào được gọi là kinh điển mà em thấy chưa xứng không?","Gợi ý: nhà trường, giải thưởng, phê bình và nhà xuất bản cùng tham gia (xem Chương 11 của chuyên đề về thiết chế). Cần phân biệt giá trị của tác phẩm với quyền lực của thiết chế công nhận nó."]]},
{id:"barthes",q:"Sự ra đời của người đọc phải trả giá bằng cái chết của Tác giả.",o:"La naissance du lecteur doit se payer de la mort de l’Auteur.",who:"Roland Barthes, “Cái chết của tác giả”, 1967",tag:"Tiếp nhận và phê bình hậu cấu trúc",T:[
["Nhận định đặt hai đối tượng nào đối diện nhau? Nêu hai thuật ngữ và nói nhận định bàn về vấn đề gì.","Hai thuật ngữ là “người đọc” và “Tác giả”. Vấn đề: ai quyết định nghĩa của văn bản."],
["Giải thích: Barthes nói “tác giả chết” theo nghĩa nào? Là con người thật không còn tồn tại, hay là một quan niệm nào đó không còn đứng vững?","Barthes không phủ nhận tác giả từng tồn tại. Ông bác bỏ quan niệm lấy ý định của tác giả làm đáp án cuối cùng; văn bản là nơi nhiều tiếng nói gặp nhau, và nghĩa hình thành khi đọc."],
["Lấy một văn bản em đã đọc. Nêu một cách hiểu mà tác giả có thể không chủ ý nhưng văn bản vẫn nâng đỡ. Chỉ rõ chi tiết.","Ví dụ: Kafka từng nhờ bạn huỷ bản thảo, nhưng các tác phẩm vẫn được xuất bản và đọc rộng rãi. Ý định tác giả không quyết định số phận của văn bản."],
["Thuyết “cái chết của tác giả” có giới hạn nào? Nêu một trường hợp mà bối cảnh và vị trí của người viết vẫn cần được xét.","Gợi ý: phê bình hậu thuộc địa và nữ quyền cho rằng vị trí người nói rất quan trọng. Foucault (1969) đề nghị nghĩ về “chức năng tác giả” thay vì phủ nhận tác giả."]]},
{id:"camus",q:"Phải hình dung Sisyphus hạnh phúc.",o:"Il faut imaginer Sisyphe heureux.",who:"Albert Camus, Huyền thoại Sisyphus, 1942",tag:"Triết lí phi lí và thần thoại Hi Lạp",T:[
["Camus mượn nhân vật thần thoại nào? Nhân vật ấy bị trừng phạt ra sao?","Sisyphus bị thần linh phạt đẩy một tảng đá lên đỉnh núi; mỗi lần tới đỉnh, tảng đá lại lăn xuống, và việc ấy lặp mãi."],
["Giải thích vì sao Camus bảo có thể hình dung Sisyphus hạnh phúc, dù ông vẫn bị trừng phạt.","Hạnh phúc ở đây không đến từ chỗ hết khổ. Nó đến từ việc tỉnh táo nhìn thẳng cái phi lí mà vẫn chọn tiếp tục, nên công việc ấy trở thành của chính mình."],
["Chọn một nhân vật văn học sống lặp đi lặp lại và đối diện cái phi lí. Chỉ ra chi tiết cho thấy nhân vật ấy tỉnh táo hay mù mờ.","Ví dụ: Meursault trong Người xa lạ; hoặc Gregor, người vẫn lo chuyện đi làm khi thân thể đã đổi khác. Hãy nêu chi tiết cụ thể rồi nói nó cho thấy điều gì."],
["Cách nhìn của Camus có giới hạn nào? Một người đọc theo Phật giáo hoặc Nho giáo sẽ trả lời nỗi khổ ấy khác đi như thế nào?","Camus bỏ hi vọng siêu hình. Phật giáo nhìn khổ qua vô thường và giải thoát; Nho giáo đặt con người trong trật tự nhân sinh. So sánh để thấy mỗi lăng kính trả lời một câu hỏi riêng."]]},
{id:"morrison",q:"Ngôn ngữ áp bức không chỉ biểu đạt bạo lực; nó chính là bạo lực.",o:"Oppressive language does more than represent violence; it is violence.",who:"Toni Morrison, diễn từ Nobel, 1993",tag:"Ngôn từ, quyền lực và quyền kể chuyện",T:[
["Nhận định bàn về vai trò nào của ngôn ngữ? Chép lại từ khoá và nói nhận định đối lập hai chức năng nào.","Từ khoá: “ngôn ngữ áp bức”, “biểu đạt”, “bạo lực”. Nhận định đối lập việc ngôn ngữ chỉ mô tả bạo lực với việc ngôn ngữ tự nó thực hiện bạo lực."],
["Giải thích vì sao một cách gọi tên, một lời nói có thể là hình thức của bạo lực.","Gợi ý: ngôn ngữ phân loại, gán nhãn, che giấu hoặc xoá tên con người. Người bị gán nhãn có thể bị đối xử như thể nhãn ấy là bản chất của họ."],
["Chọn một tác phẩm cho thấy ngôn ngữ được dùng để gán nhãn hoặc loại trừ. Chỉ ra từ ngữ hoặc cách gọi tên cụ thể.","Ví dụ: trong Biến hình, gia đình dần gọi Gregor là “nó”. Trong Things Fall Apart, viên quan huyện định gói cuộc đời Okonkwo vào một đoạn sách. Hãy nêu chi tiết và nói nó gây tác động gì."],
["Văn học vừa có thể dùng ngôn ngữ để áp bức vừa để giải phóng. Nêu hai chi tiết trái chiều nhau rồi đưa ra nhận xét của em.","Gợi ý: so sánh cách gọi tên áp đặt với việc nhà văn trao lại quyền tự kể (như Achebe với người Igbo, Morrison với những người từng bị lịch sử gọi bằng con số). Kể lại là một cách giành lại phẩm giá."]]}

const DOCS=[{"t": "Văn học phương Tây: tự sự, kịch, thơ", "n": "Bài giảng và bài làm về O. Henry, Cervantes, Shakespeare, Goethe, Byron, Baudelaire (nguyên văn tài liệu P1, P2). Các đoạn thơ trích được lược, xem trong tài liệu gốc.", "s": [["I - Thời đại - VĂN HỌC HIỆN ĐẠI THẾ KỈ XX Ở PHƯƠNG TÂY", 2, "<p>Thế kỉ XX chứng kiến nhiều sự thay đổi và chuyển biến phức tạp của xã hội phương Tây trên nhiều lĩnh vực, tạo nên những cuộc cách tân lớn trong nghệ thuật nói chung cũng như trong văn học nói riêng. Chiến tranh thế giới thứ hai bùng nổ đã để lại biết bao hậu quả tàn khốc cho nhân loại, cả sự hình thành của hai phe xã hội chủ nghĩa và tư bản chủ nghĩa đã tạo nên một trật tự thế giới mới - trật tự của thế giới hai cực.<\/p>\n<p>Sự kiện đáng được quan tâm nhất là thắng lợi của Cách mạng tháng Mười Nga năm 1917, sự khẳng định của khát vọng chính nghĩa, yêu hoà bình, chiến đấu vì hạnh phúc của con người, lan tỏa và truyền bá tư tưởng nhân đạo, dân chủ đến khắp nơi trên thế giới. Song song với đó, đây cũng là thế kỉ mà nền văn minh phương Tây có những nấc thang mới trong tiến trình phát triển, đạt được những thành tựu to lớn về khoa học - kĩ thuật cũng như về văn hoá - tinh thần.<\/p>\n<p>Kỷ nguyên hiện đại được mở ra từ câu nói nổi tiếng của nhà triết học lừng danh Friedrick Nietzsche “Chúa đã chết”, khẳng định Chúa không còn là chỗ dựa tinh thần tuyệt đối cho con người, Chúa đã không còn nữa và lúc này, con người cần phải quay về với cá nhân mình, về với cuộc sống đích thực đang hiện hữu trước mắt. Theo đó, thuật ngữ “chủ nghĩa hiện đại” (modernism) cũng bắt đầu xuất hiện để chỉ chung cho nền văn học phương Tây trong suốt thế kỉ XX. Các tác phẩm văn học ra đời trong giai đoạn này đều mang tinh thần “dấn thân”, “nhập cuộc”, khước từ mọi quy tắc, khuôn phép truyền thống để “làm mới”, đổi mới và sáng tạo trên cơ sở của hiện thực, hướng đến “nghệ thuật vị nhân sinh”, nghệ thuật phục vụ cho đời sống của chính con người. Văn học kêu gọi con người hãy sống một cách tự do và chân thực, cảm nhận bằng chính các giác quan của mình chứ không phải dựa trên những lí thuyết đã có sẵn từ trước, những chuẩn mực còn khuôn mẫu, giáo điều.<\/p>\n<p>Văn học phương Tây đạt được những cách tân sáng tạo trên cả thể loại văn xuôi, thơ và kịch. Văn xuôi hiện đại nổi bật có các tác giả James Joyce, Franz Kafka, William Faulkner với lối viết theo dòng ý thức, kể không tập trung vào cốt truyện, diễn biến sự việc mà chủ yếu khai thác qua các điểm nhìn trần thuật khác nhau. Thơ hiện đại đặc sắc nhất có thơ siêu thực với đặc điểm cơ bản là tính xếp đặt liền kề và gián cách các sự vật hiện tượng. Về kịch, thành công lớn và đáng kể nhất phải nói đến kịch phi lí với những tên tuổi như S.Beckett, E.Jonesco… khi những kịch gia này đã diễn tả sự phi lí của thời đại đầy đau thương, tang tóc sau thế chiến thứ hai. Nhìn chung, văn học phương Tây thời kì hiện đại đã có những bước tiến mới trên chặng đường lịch sử, đánh dấu sự đổi mới trong tư tưởng và nội dung phản ánh. Khi ấy, văn học là tiếng nói tố cáo đầy mạnh mẽ và đanh thép về những khủng hoảng nặng nề trong đời sống tinh thần của con người sau chiến tranh, là tiếng nói bi phẫn, đau đớn của những số phận nghèo khổ cùng khát vọng vươn lên, thoát khỏi cuộc sống áp bức, bóc lột để xây dựng một thế giới hoà bình tốt đẹp, khẳng định tự do, công lí, chính nghĩa.<\/p>\n"], ["1. Tiểu sử:", 3, "<p>O’Henry là bút danh của William Sydney Potter (1862 - 1910) - O’Henry và cuộc đời như một truyện ngắn:<\/p>\n<p>+ Sinh ra tại Greensboro bang Bắc Carolina<\/p>\n<p>+ Bố là bác sĩ có tài nhưng nghiện rượu và không biết lo xa, sống hoang phí<\/p>\n<p>+ Năm 3 tuổi mẹ qua đời, ông cùng e trai được gửi tới trường tư do cô ruột quản lí.<\/p>\n<p>+ Năm 15 tuổi đến làm việc tại một hiệu thuốc =&gt; công việc tẻ nhạt ông đọc sách rất nhiều 20 tuổi ông chuyển đến Texas làm thủ quỹ ngân hàng và chủ bút khi thành lập tờ báo Đá lăn =&gt; bị tố cáo biển thủ công quỹ ngân hàng, ông bỏ trốn đến Hôndurat và Nam Mĩ để khỏi bị bắt<\/p>\n<p>+ Khi vợ hấp hối, ông quay trở lại Austin, bị bắt và kết án tại Ohaio + 3 năm sau, do cải tạo tốt ông được ra từ, hoàn cảnh trong tù đã khiến ông tiếp xúc với rất nhiều người bất hảo trong xã hội, TG ngục tù cũng là một trong những tư liệu góp phần đưa vào trong các tác phẩm của ông<\/p>\n<p>+ Ông tiếp tục viết truyện ngắn dưới bút danh O’Henry để nuôi sống con gái.<\/p>\n<p>+ 3 năm trước khi mất, ông tái hôn với cô bạn từng là ny thời trẻ =&gt; hôn nhân tan vỡ =&gt; ông lao vào nghiện ngập, rượu chè và mất năm 1910 tại New York<\/p>\n<p>+ Trong sự nghiệp sáng tác của mình, Henry từng xuất bản 10 tập truyện, sở hữu khoảng 600 truyện ngắn. Tuy nghiện ngập nhưng rượu chè vẫn không hề ảnh hưởng đến những trang viết của nhà văn. Nhiều sáng tác của ông đã trở thành những truyện ngắn mẫu mực và kinh điển.<\/p>\n"], ["2. Phong cách nghệ thuật:", 3, "<p>O. Henry có tài quan sát và từng trải nhờ những biến cố mà ông đã trải qua trong cuộc đời, bởi thế nên truyện ngắn của ông bày tỏ rõ tấm lòng yêu thương, đồng cảm với những con người cùng cảnh ngộ. Sở trường và có biệt tài về mảng truyện ngắn, song truyện ngắn của O. Henry lại hết sức đặc biệt khi ông xây dựng một cốt truyện biến hoá linh hoạt, kết hợp với lối tự sự “vừa tình cảm nhẹ nhàng, vừa hài hước giễu cợt, châm biếm chua cay và đặc biệt là những cái kết bất ngờ”.<\/p>\n<p>Trước hết, ta nhận thấy O. Henry là nhà văn có cách kể chuyện hấp dẫn, cuốn hút. Đa số các truyện ngắn của ông đều có cốt truyện không quá phức tạp nhưng lại tạo nên những cái kết bất ngờ khiến độc giả không thể lường trước. Ông tạo ra một thế giới thấm đẫm chất thơ, chất trữ tình trong những trang văn của mình để rồi khi kết thúc truyện, chủ đề và tư tưởng chính mới được bộc lộ rõ nét nhất. O. Henry cũng được coi là bậc thầy trong nghệ thuật sử dụng từ ngữ với những câu văn tuy dung dị nhưng tạo nên dấu ấn riêng biệt cùng lối chơi chữ dí dỏm, lối trần thuật tài tình khéo léo. Bút pháp mà ông sử dụng cũng rất đa dạng, phong phú. Có khi là miêu tả trực tiếp, bộc lộ những gì trần trụi, chân thực nhất nhưng cũng có lúc nhà văn sử dụng thủ pháp phóng đại, cường điệu hoá để tô hồng hiện thực, vươn tới những khát vọng cao cả, tươi sáng hơn.<\/p>\n<p>Nhà văn O. Henry cũng có cho mình một quan điểm sáng tác mới mẻ, độc đáo và đầy chất nhân văn. Với ông, “truyện ngắn hay thì giống như viên thuốc đắng bọc đường”, tức xuyên suốt toàn bộ câu chuyện thì chủ đề chính bị ẩn đi, tất cả dường như đều được “bọc đường” và chỉ đến khi đọc kết thúc truyện, ta mới thấy được hình ảnh của “viên thuốc đắng”, hay cũng chính là thông điệp, tư tưởng mà tác giả muốn nói, là chủ đề chính của tác phẩm. Đồng thời, O. Henry cũng cho rằng “Thiên chức của nghệ thuật là thanh lọc tâm hồn, hướng thiện con người”. Khi đó, nghệ thuật có chức năng nâng đỡ tâm hồn con người, giúp con người vượt qua những vất vả, bộn bề trong cuộc sống để vươn tới một thế giới tốt đẹp hơn. Con người sáng tạo nên nghệ thuật, nghệ thuật dù có nảy sinh ở hoàn cảnh khốn khó, nghèo túng thì nó vẫn là thứ nghệ thuật trong sáng, nó sẽ chiến thắng cái ác, cái xấu để cổ vũ con người sống đời sống cao quý hơn. Nghệ thuật giúp con người bừng tỉnh, thoát khỏi nơi “bóng tối” ngự trị, đánh thức cái thiện lương sẵn có trong mỗi người mà hướng đến một cuộc đời tươi mới hơn. Mang trong mình quan niệm nghệ thuật tiến bộ và sâu sắc như vậy, mỗi truyện ngắn của O. Henry dường như là một bài thơ trữ tình đượm buồn mà lóng lánh tấm lòng nhân ái, và dường như cũng có khi như một bức tranh sinh động phản ánh hiện thực cuộc sống còn nhiều bất công, nghịch lí.<\/p>\n<p>Qua đó, ta nhận ra được phong cách nghệ thuật riêng biệt của nhà văn O. Henry. Nhờ khả năng sáng tạo và vận dụng linh hoạt các yếu tố trần thuật, O. Henry đã tạo dựng cho mình một lối viết truyện triết lí, bất ngờ nhưng cũng có khi hài hước, châm biếm, thể hiện quan điểm nghệ thuật rõ nét trong các sáng tác của mình. Với những tác phẩm đã để lại tiếng vang lớn như “Chiếc lá cuối cùng”, “Quà tặng của các thầy pháp”, “Tên cớm và bản Thánh ca”, O. Henry xứng đáng được coi là “phù thuỷ chuyên viết truyện ngắn”, “bậc thầy ở lĩnh vực truyện ngắn” và mỗi tác phẩm của ông vẫn là những kiệt tác bất hủ, toả hương thơm ngát giữa cánh rừng đại ngàn văn học và có sức lay động mãnh liệt đến hàng ngàn thế hệ bạn đọc.<\/p>\n"], ["1. Xuất xứ, vị trí:", 3, "<p>Chiếc lá cuối cùng (The last Leaf) là truyện ngắn xuất sắc bậc nhất của O.Henry. Tác phẩm được in trong tập Cây đèn thanh mảnh (The Trimmed Lamp) xuất bản năm 1907<\/p>\n"], ["2. Tóm tắt:", 3, "<p>Sue và Johnsy là hai nữ hoạ sĩ trẻ sống trong một khu nhà trọ. Cụ Behrman, một hoạ sĩ già cũng sống ở đó với họ, cả đời cụ khao khát vẽ một kiệt tác nhưng chưa thoả ý. Chẳng may, mùa đông năm ấy, Johnsy bị bệnh sưng phổi rất nặng. Bệnh tật khiến cô tuyệt vọng và nghĩ rằng khi chiếc lá thường xuân cuối cùng rụng xuống là sẽ là lúc mình lìa đời. Sue vô cùng lo lắng và hết lòng chạy chữa cho bạn nhưng vô ích, Johnsy vẫn bi quan như vậy. Cô gái tội nghiệp âm thầm đếm từng chiếc lá.<\/p>\n<p>Biết được ý nghĩ điên rồ đó của Johnsy, cụ Behrman bộc lộ sự không tán thành, nhưng sau đó lại âm thầm thức suốt đêm mưa gió bão bùng để vẽ chiếc lá thường xuân. Chiếc lá cuối cùng giống như thật. Nó đã không rụng trong đêm bão lớn khiến Johnsy suy nghĩ lại, cô hi vọng và muốn được sống, được sáng tạo. Johnsy từ cõi chết trở về nhưng cụ Behrman lại chết vì bệnh sưng phổi sau đêm sáng tạo kiệt tác chiếc lá cuối cùng để cứu Johnsy. Sue lặng lẽ đến bên Johnsy báo cho bạn về cái chết của cụ Behrman và bí mật của chiếc lá cuối cùng.<\/p>\n"], ["3. Cốt truyện:", 3, "<p>Với truyện ngắn “Chiếc lá cuối cùng”, cốt truyện ở đây tương đối phức tạp, khi nhà văn không xây dựng một tuyến cốt truyện xuyên suốt toàn bộ tác phẩm mà tạo nên những hai tuyến cốt truyện, tương ứng với đó là hai cái kết song hành và hai lần đảo ngược tình huống. Cách xây dựng cốt truyện hiện đại này đã góp phần không nhỏ trong việc tăng độ kịch tính, hấp dẫn cho câu chuyện.<\/p>\n<p>Về cốt truyện thứ nhất, tức cốt truyện nổi lên trên bề mặt của câu chuyện chính là cốt truyện liên quan đến nhân vật Johnsy. Cốt truyện này xuất hiện rõ nét trong toàn bộ tác phẩm dựa trên mối quan hệ nhân quả, từ đó mà cấu trúc của cốt truyện thứ nhất bao gồm năm thành phần theo quan niệm truyền thống: Trình bày (giới thiệu bối cảnh): tại một “khu hoạ sĩ” nọ, có một cô gái bị viêm phổi tên là Johnsy đang nằm chờ chết; Thắt nút (sự kiện đánh dấu điểm khởi đầu của một quan hệ tất yếu sẽ tiếp tục phát triển): Johnsy nằm chờ chết và ngồi đếm những chiếc lá trường xuân đang rụng, cho rằng khi nào chiếc lá cuối cùng rụng xuống thì cô cũng sẽ ra đi; Phát triển (toàn bộ các sự kiện thể hiện sự triển khai vận động của các quan hệ và mâu thuẫn xảy ra): lá mỗi ngày rụng dần và thưa thớt, sức khoẻ Johnsy cũng ngày càng kiệt quệ, tàn lụi; Đỉnh điểm (sự kiện thử thách cao nhất với nhân vật, tạo nên bước ngoặt của truyện): chỉ còn duy nhất một chiếc lá còn sót lại trên cây trường xuân, nếu chiếc lá ấy rơi xuống thì Johnsy cũng sẽ rơi theo; Mở nút (sự kiện giải quyết mâu thuẫn, xung đột): chiếc lá vẫn vững vàng bám trụ trên cành cây, Johnsy thức tỉnh và muốn sống tiếp, không muốn chết nữa.<\/p>\n<p>Về cốt truyện thứ hai, tức cốt truyện chìm ẩn đằng sau cốt truyện bề nổi kia là câu chuyện liên quan đến nhân vật chính là cụ Behrman. Cốt truyện này cũng được phát triển theo mối quan hệ nhân quả nhưng nó không tồn tại độc lập, riêng biệt mà luôn song hành, sóng đôi với cốt truyện thứ nhất. Có một hoạ sĩ đã lớn tuổi nhưng vẫn ấp ủ dự định vẽ một bức kiệt tác, khác hẳn với một cô gái trẻ tuổi nhưng vì bệnh tật mà chấp nhận buông bỏ sự sống, chết theo những chiếc lá rụng. Cụ Behrman muốn cứu Johnsy với dự định vẽ chiếc lá giống hệt như chiếc lá cuối cùng còn sót lại trên cây thường xuân, và trong đêm đông giá rét, tê buốt lạnh căm ấy cụ đã cần mẫn vẽ chiếc lá thay thế chiếc đã rụng. Kết thúc câu chuyện, cô gái trẻ Johnsy đã hồi phục tâm bệnh, cảm thấy bản thân mình đã thật tệ hại khi nghĩ đến cái chết và giờ đây tiếp tục khát khao sống, nhưng cụ Berhman đã mắc viêm phổi nặng và qua đời trong hai ngày sau đó.<\/p>\n<p>Nhà văn O. Henry đã xây dựng hai tuyến cốt truyện có sự đối lập, tương phản nhưng không hề loại trừ mà bổ sung, đan cài vào nhau để tạo nên chỉnh thể tác phẩm, đây cũng chính là cơ sở, tiền đề triển khai hai cái kết bất ngờ và hai lần đảo ngược tình huống. Johnsy bị bệnh viêm phổi, yếu ớt vô cùng và những tưởng cô sẽ ra đi theo chiếc lá trên cây trường xuân nhưng sau đó cô lại được hồi sinh, lấy lại nghị lực sống, thoát khỏi bàn tay của tử thần. Còn cụ Berhman đang khoẻ mạnh bỗng dưng bị viêm phổi, đột ngột qua đời và sự ra đi của cụ Berhman không chỉ tạo nên sự bất ngờ cho Sue và Johnsy mà còn với chính độc giả. Cụ Berhman tuy đã mất nhưng cụ đã hoàn thành được tâm nguyện cả đời của mình, đã vẽ được kiệt tác “chiếc lá trường xuân”, cứu sống cô gái trẻ Johnsy vượt qua bóng tối tử thần để vươn tới ánh sáng của sự sống tốt đẹp hơn. Qua đó, chúng ta thấy được ý nghĩa sâu sắc trong cách xây dựng cốt truyện hiện đại của nhà văn O. Henry.<\/p>\n<p>Thông qua hai tuyến cốt truyện, người đọc như bị cuốn vào mạch truyện mà đi từ hết bất ngờ này đến bất ngờ khác, để rồi cách kết thúc đầy khó đoán và hết sức bất ngờ đã để lại trong lòng người đọc một nỗi ám ảnh, một nỗi day dứt mãi không nguôi. Nhờ có hệ thống một chuỗi các sự kiện trong cốt truyện mà ta thấy được đặc điểm, tính cách của nhân vật Johnsy và Sue cùng mối quan hệ gắn bó khăng khít của họ; cũng như cả tấm lòng yêu thương, hi sinh cao cả và cống hiến tất cả vì nghệ thuật của cụ Behrman. Cốt truyện đã tái hiện sống động bức tranh hiện thực của những người nghệ sĩ nghèo khổ trong xã hội Mĩ lúc bấy giờ, đem đến giá trị nhận thức sâu sắc về giá trị của tình yêu thương cũng như sức mạnh to lớn của nghệ thuật khi nó cổ vũ, giúp con người vượt qua muôn vàn khó khăn và làm nên những điều thật phi thường!<\/p>\n"], ["4. Không gian nghệ thuật:", 3, "<p>Mỗi tác phẩm đều có cho mình một không gian sống riêng biệt, phạm vi của nó phụ thuộc vào trí tưởng tượng của nhà văn và nhu cầu cấu tạo của tác phẩm. Không gian trong tác phẩm “Chiếc lá cuối cùng” là mô hình không gian địa điểm, cụ thể ở đây chính là “khu hoạ sĩ” nằm ở phía Tây của quảng trường Wasinhton. Nhà văn O. Henry đã miêu tả không gian ấy có “đường phố chạy ngoằn ngoèo” và “tự mình cắt đôi ba lần” cho thấy đây là không gian cố định, cụ thể và các chi tiết trên được nhà văn tái hiện bằng chính hiện thực khách quan, chứ không phải là không gian mang ý nghĩa viễn cảnh hay không gian trong tâm tưởng của nhân vật. Gần hơn một chút, trong “khu hoạ sĩ” ấy thì câu chuyện xoay quanh một không gian chật hẹp hơn, chính là “căn phòng áp mái toà nhà ba tầng thấp tịt” - nơi Sue và Johnsy dùng làm phòng ngủ kiêm xưởng vẽ và dưới đó là tầng trệt, nơi ở của cụ Behrman. Đối diện với không gian căn phòng chật chội ấy là một bức tường đã nứt nẻ, in dấu vết của thời gian và xa hơn là hình ảnh của cây trường xuân đã già nua, cằn cỗi “Trong tầm mắt chỉ có một cái sân trơ trụi, ảm đạm và bức tường trống trơn của ngôi nhà gạch cách chừng sáu mét. Một dây trường xuan già, rất già, gốc cong queo và mục nát, leo đến giữa bức tường gạch. Hơi thở lạnh lẽo của mùa thu đã bứt dần lá của nó ra khỏi thân cho đến lúc chỉ còn trơ đám cành cây gần trụi hết lá bám vào những viên gạch nẻ sứt”.<\/p>\n<p>Có thể nói, không gian nghệ thuật trong tác phẩm “Chiếc lá cuối cùng” là một không gian có phần tù túng, và dường như con người khi sống trong một không gian như vậy cũng sẽ có đôi lúc cảm thấy chán nản và rơi vào tình trạng bi quan, tiêu cực. Trong văn học phương Tây, không gian mênh mông bát ngát thường biểu tượng cho sự tự do, cho khát vọng vươn xa của con người nhưng không gian ở đây lại chật hẹp đến mức chỉ trong một căn phòng nhỏ, điều này cũng chi phối và ảnh hưởng ít nhiều đến tâm trạng, tính cách của nhân vật. Sống trong một nơi chật hẹp, ẩm thấp, xung quanh lại là bức tường tựa như lớp màng ngăn cách và cây trường xuân nhưng không hề “xuân” mà lại già nua, cằn cỗi, một người bị bệnh viêm phổi, vốn mong manh và yếu đuối như Johnsy quả thực khó lòng có cảm hứng, nghị lực để vượt qua bệnh tật. Ngay cả không gian nơi ở của cụ Berhman cũng là một căn phòng tối tăm tựa như một chiếc hang ở tầng thấp nhất, nơi mà ánh sáng chỉ còn là từng hột, từng giọt nhỏ nhoi lọt vào. Xây dựng một không gian nghệ thuật có phần u ám, mờ nhạt và thiếu sức sống đến như thế, O. Henry đã phần nào phản ánh số phận nghèo khổ, bất hạnh của những người dân nơi đây, cụ thể hơn chính là những nghệ sĩ sống tại “khu hoạ sĩ”. Người nghệ sĩ rõ ràng là người làm công việc sáng tạo cái đẹp, tạo ra cái đẹp của nghệ thuật nhưng cái đẹp ấy lại không hề được nảy sinh trên mảnh đất của sự đẹp đẽ, mà nó lại nảy nở ngay trên chính một không gian tồi tàn, tù túng. Điều này đã cho thấy công phu lao động nghệ thuật nghiêm túc của người sáng tạo nghệ thuật, khi chính nhờ niềm đam mê và khát vọng cao cả của họ mà nghệ thuật đã nảy nở tốt đẹp, đã phát triển đến độ hoàn mĩ và kiệt tác. Đó chính là khi cụ Behrman đã vẽ nên chiếc lá cứu vớt sự sống cho Johnsy, hi sinh thân mình vì nghệ thuật, vì cái đẹp đích thực, vì cái đẹp hướng đến giá trị nhân văn cao đẹp nhất là “thanh lọc tâm hồn, hướng thiện con người”. Không những thế, tuy không gian trong tác phẩm rất đỗi chật hẹp nhưng bằng tấm lòng yêu thương con người và tinh thần nhân đạo sâu sắc, O. Henry đã vẽ nên những ước mơ của con người trong không gian ấy, đó là ước mơ vượt thoát khỏi sự tù tùng kia, đó là mơ ước vươn đến vịnh Naplo mênh mông, bát ngát, bao la, là khát vọng mà Sue và Johnsy vô cùng mong đợi, còn cụ Behrman suốt cả cuộc đời mình vẫn mơ về một kiệt tác để đời để thay đổi số phận “Đã bốn mươi năm ông cầm cây bút lông mà không sao đến gần được Nàng hội họa của mình. Lúc nào ông cũng đau đáu định vẽ một kiệt tác”. O. Henry đã đặt mình vào hoàn cảnh của nhân vật, ông trân trọng và nâng niu từng ước mơ nhỏ bé, mong manh ấy, mở ra một không gian rộng lớn hơn, tươi đẹp hơn để nhân vật được sống trọn vẹn với đam mê, hoài bão của mình.<\/p>\n<p>Các lớp không gian cứ thế được đan cài, xuyên thấm vào trong tác phẩm, định hướng cho hành động nhân vật, góp phần làm nên nét độc đáo trong nghệ thuật kể chuyện của cây bút O. Henry. Từ không gian tù đọng nơi thực tại với một vài sự chuyển động lẻ loi, yếu ớt “những chiếc lá nối nhau rụng”, “ông lão lần ra bức tường rêu phong kia” đến không gian rộng lớn trong mơ ước của Sue và Johnsy về vịnh Naplo, O. Henry đã tái hiện rõ nét bức tranh đời sống hiện thực cũng như những mong mỏi, hoài bão của con người nơi đây. Chỉ với chi tiết về không gian tù túng, chúng ta đã phần nào lí giải, hiểu rõ được bối cảnh, dụng ý nghệ thuật mà tác giả muốn đưa vào truyện ngắn của mình. Ngoài ra, chính nhờ chi tiết này mà ta thấy được “sức nặng” trong “Chiếc lá cuối cùng”, khi ở không gian tù túng, chật hẹp và tăm tối ấy nhưng con người vẫn đầy những hoài bão, ước mơ, họ muốn vượt qua cái tù túng, cái chật hẹp ấy để hoàn thành ước nguyện của đời mình, chính cái không gian ấy bác Berhman đã sáng tác ra tác phẩm tuyệt diệu, hay cũng chính không gian đó mà Johnsy đã vượt lên căn bệnh tâm lí để tiếp tục sống sót,... Không phải bỗng nhiên O. Henry lại lấy không gian cho truyện ngắn của mình là những nơi tù túng, tối tăm như vậy, mà dụng ý của ông là muốn tái hiện lại xã hội, thời cuộc nước Mĩ lúc bấy giờ, để cho nhân vật của mình tỏa sáng ở những góc tối, và đấy cũng chính là ánh sáng chói lọi nhất của cuộc đời mỗi nhân vật.<\/p>\n"], ["5. Thời gian nghệ thuật", 3, "<p>Trong thực tại, thời gian theo cái nhìn của con người luôn hướng về phía trước, là thời gian mang tính liên tục, không ngừng trôi qua và tiếp nối, không bao giờ quay trở lại được. Đây chính là quy luật của tự nhiên, khi thời gian cứ trôi qua, đến và đi, mang theo biết bao những sướng vui, khổ đau của con người. Dòng thời gian ấy là bất tận, là vĩnh viễn trải dài và chúng ta chỉ có thể xác định, lấy một điểm mốc nào đó là điểm khởi đầu chứ không thể biết được đâu là kết thúc, hay khi nào thời gian ngừng trôi, ta trở về với cát bụi, với cõi vĩnh hằng. Nếu gán số đếm cho thời gian thì quy luật tất yếu phải là một, hai, ba, bốn, năm… Thế nhưng, trong truyện ngắn “Chiếc lá cuối cùng”, thời gian lại được biểu thị hoàn toàn khác, ngược lại so với quy luật của tự nhiên. Cũng vẫn là những con số như thế nhưng đếm ngược lại: năm, bốn, ba, hai, một… Những con số chạy ngược được đếm bởi nhân vật chính trong tác phẩm là Johnsy, khi hàng ngày cô vẫn đếm từng chiếc lá còn sót lại trên cây thường xuân, đến khi nào một chiếc lá duy nhất còn sót lại cũng rụng xuống thì cũng là lúc Johnsy rời khỏi cõi đời này. Thời gian với một con người đã mất niềm tin vào sự sống như Johnsy là thời gian chạy ngược, không còn thấy được tương lai phía trước mà chỉ còn thấy sự sống đang lùi dần về con số 0, cái chết đang cận kề và đến rất gần.<\/p>\n<p>Với cô gái trẻ Johnsy, thời gian như lùi lại và khi nó lùi về theo cái cách mà cô nghĩ thì tất cả sẽ chấm dứt. Thế nhưng, O. Henry vẫn để câu chuyện tiếp tục, nhà văn đã kéo dài thêm thời gian sự kiện để tăng kịch tính cho tác phẩm bởi sự mâu thuẫn giữa “vận động thời gian ngược của người bệnh để đi đến chỗ chết và sự vận hành của thời gian vũ trụ là đi đến sự sống, luân hồi”. Tạo ra xung đột về thời gian bằng cách nối dài thời gian, O. Henry đã xây dựng được cao trào, đỉnh điểm cho câu chuyện để rồi cho xung đột ấy ngắt lại giữa quãng tại một điểm: muốn chết là một tội lỗi. Nhưng cuộc đời đâu có giản đơn và dễ dàng đến như vậy, khi bằng những trải nghiệm và vốn sống của bản thân, O. Henry đã đúc kết một một sự thật cay đắng trong tác phẩm của mình: “người muốn chết thì không thể chết còn người không muốn chết thì lại chết”. Đọc đến đây, có lẽ bản thân chúng ta đang suy nghĩ rằng O. Henry có quá tàn nhẫn khi để cho các nhân vật của mình chịu đựng sự trớ trêu, đớn đau của tạo hoá, của thế giới vô thường này? Nếu hiểu như thế thì cái kết của “Chiếc lá cuối cùng” là một cái kết không có hậu, cái kết của sự bế tắc không thể giải thoát. Thật ra, điều này chỉ xuất hiện khi chúng ta chưa hiểu thật sự tại sao cụ Behrman lại ra đi, tại sao cụ đang khoẻ mạnh lại mắc bệnh viêm phổi và đột ngột qua đời hai ngày sau đó. Nguyên nhân sâu xa chính là bởi tấm lòng hi sinh của cụ, tấm lòng yêu thương của một con người nhân hậu muốn cứu vớt cô gái trẻ thoát khỏi bàn tay tử thần, cao hơn nữa đó là sự hi sinh cao cả vì nghệ thuật, đánh đổi chính mạng sống của bản thân mình để làm nên một kiệt tác nghệ thuật, một kiệt tác trường tồn, vĩnh cửu với thời gian. “Nhà văn O. Henry đã cho Behrman chết như một người già ra đi, là nhân tố quyết định để xoay dòng thời gian về theo chu trình của nó: một, hai, ba, bốn, năm… để Johnsy sống trọn cuộc đời của một thiếu nữ”. Thời gian ngược và thời gian xuôi hoà quyện, lồng ghép vào nhau trong tác phẩm, cái chết của Behrman chỉ là sự tiếp nối hoà trong cái vĩnh hằng của vụ trụ vô biên, gắn kết hai dòng thời gian bằng lòng yêu thương, bằng trái tim nhân hậu để tạo nên một kết thúc đẹp, một kết thúc tựa như truyện cổ tích long lanh ánh sáng, lấp lánh chất thơ cho “Chiếc lá cuối cùng”. Có thể thấy, yếu tố thời gian không chỉ làm tăng thêm sự kịch tính, độ căng cho cốt truyện mà còn góp phần thể hiện giá trị nhân đạo sâu sắc của tác phẩm, gieo vào lòng người đọc những tình cảm chân thành, nồng ấm của một trái tim nguyện hi sinh cao cả vì nghệ thuật, để lại những dư âm cứ day dứt, ám ảnh không thể nào quên với mỗi độc giả.<\/p>\n"], ["6. Chi tiết ngẫu nhiên", 3, "<p>Câu chuyện được dẫn dắt từ nhiều chi tiết ngẫu nhiên, cái ngẫu nhiên kết hợp với cái tất nhiên tạo nên những đỉnh điểm, thắt nút, góp phần làm tăng thêm sự kịch tính cho câu chuyện. “Ngẫu nhiên khi khu phố cổ có nhiều con đường ngoằn ngoèo lại có nhiều ngôi nhà cổ xinh đẹp. Ngẫu nhiên là khi Sue và Johnsy gặp nhau. Ngẫu nhiên là Johnsy lăn đùng ra ốm và bên bức tường kia, ngẫu nhiên khóm thường xuân già thi nhau rụng lá rồi trong đầu Johnsy nảy ra ý nghĩ những chiếc lá rụng ấy chính là tín hiệu của sức khỏe mình. Ngẫu nhiên mà họa sĩ già <em>đã bốn mươi năm múa bút mà chưa hề chạm tới được gấu áo Nữ thần của mình<\/em>, nhưng vẫn không nguôi hi vọng về bức kiệt tác. Ông lão nuôi mầm sống cho chiếc lá bằng những hơi thở tàn của mình, bằng sự quằn quại trong những cơn đau chết người của chính bản thân mình. Và, chính chiếc lá - bức kiệt tác đơn sơ - lại gieo mầm xanh trong tâm hồn trơ trọi không muốn sống của Johnsy, giúp cô buông bỏ ý nghĩ tiêu cực để tiếp tục sống, tiếp tục mơ ước”.<\/p>\n<p>Nếu như không có các chi tiết ngẫu nhiên ấy, chúng ta sẽ không thể thấy được giá trị cũng như ý nghĩa nhân văn sâu sắc của tác phẩm. Các chi tiết ngẫu nhiên kết hợp, đan cài vào nhau đã thể hiện thật chính xác, chân thực và sống động về bức tranh xã hội đương thời, cũng như tấm lòng cao cả, nhân ái và vị tha của những mảnh đời sống tại “khu hoạ sĩ” đó. Nếu như khu phố cổ kia không có những ngôi nhà cổ kính xinh đẹp mà giá thuê rẻ thì chưa chắc những con người ấy đã gặp nhau để tạo nên một bức tranh ấm áp tình người, nếu như không có sự gặp gỡ của Sue và Johnsy thì cũng không có minh chứng về một tình bạn đẹp và nếu như Johnsy không ốm thì chắc hẳn cũng không làm nên được tình huống cụ Behrman dùng những hơi thở cuối cùng để hoàn thành kiệt tác “chiếc lá cuối cùng”. Tất cả những chi tiết ngẫu nhiên trên, tưởng chừng như vô nghĩa thế nhưng nó lại mang trọng lượng vô cùng to lớn, bởi chính những sự ngẫu nhiên đó đã tạo nên những tình huống truyện độc đáo, là môi trường để nhà văn O. Henry xây dựng nên những nhân vật điển hình hóa trong truyện ngắn của mình, mang lại giá trị to lớn, cao cả hơn chính là tình yêu thương sâu sắc, là sự hi sinh cao thượng, hết mình vì nghệ thuật đích thực, “nghệ thuật vị nhân sinh”.<\/p>\n"], ["7. Quy luật và ngoại lệ", 3, "<p>Trong truyện ngắn “Chiếc lá cuối cùng”, ta thấy xuất hiện những quy luật, những điều vốn là tất yếu của tạo hoá, tự nhiên, không thể nào thay đổi được. Đó chính là quy luật sinh tồn của vũ trụ, khẳng định rằng mọi sự vật trên thế gian này đều có sinh có tử, có sinh ra thì sẽ có mất đi, và cuộc đời vốn là vô thường, là một vòng luân hồi, tuần hoàn khép kín. Cây trường xuân nhưng cũng không thể giữ hết được lá của mình, người trân trọng cuộc sống như cụ Behrman cuối cùng lại hi sinh tính mạng của mình vì người khác. Thế nhưng, bên cạnh cái quy luật bất diệt ấy, cái quy luật mà chúng ta không thể thay đổi được thì câu chuyện cũng đưa đến cho ta những ngoại lệ, những ngoại lệ hết sức nhân văn. Cây trường xuân không giữ được lá nhưng tấm lòng, sự cống hiến hết mình vì nghệ thuật của cụ Behrman đã giữ được lá, đã giữ cho chiếc lá cuối cùng ấy không bao giờ là cuối cùng, vẫn mãi xanh tươi và nảy nở, sinh sôi, gieo mầm cho sự sống tươi đẹp. Con người ai cũng quý trọng sự sống, cũng khao khát được sống và đấu tranh đến cùng để được tồn tại trên thế gian này nhưng Johnsy thì không, cô phó mặc số phận của mình theo những chiếc lá, bỏ quên đi chính con người mình, điều này cũng thật trái với quy luật tự nhiên. Cuộc sống đáng quý, đáng trân trọng là thế mà Johnsy lại muốn buông bỏ, còn cụ Behrman thì sẵn sàng hi sinh sự sống để đổi lại những điều cao quý hơn. Tất cả điều đó chính là những ngoại lệ, là những ngoại lệ mang đầy ẩn dụ, dụng ý nghệ thuật mà tác giả gửi gắm.<\/p>\n<p>Đặt song song quy luật và ngoại lệ xen kẽ, thẩm thấu vào nhau, O. Henry muốn nhấn mạnh đến chức năng cao cả của nghệ thuật. Đó chính là thiên chức cứu người, khi chính chiếc lá đã vớt vát tâm hồn nhỏ nhoi, mong manh, yếu đuối của Johnsy vượt ra khỏi bờ vực thẳm của cái chết. Với O. Henry, nghệ thuật đích thực không chỉ là thứ nghệ thuật phục vụ cái đẹp, mà còn phục vụ cho cuộc sống. Cuộc sống có tồn tại được khi con người phải biết hi sinh, cũng như nhân loại tồn tại và phát triển nhờ “sự hi sinh kế tục của các thế hệ tiếp nối”. Nghệ thuật không bao giờ đặt ra ngoài phạm vi của cuộc sống, nó luôn phải là bằng chứng sáng rõ nhất của hiện thực, phản ánh hiện thực với một tư duy thẩm mĩ và giàu tính sáng tạo.<\/p>\n"], ["8.1. Nhân vật Johnsy - một bệnh nhân đang tuyệt vọng và cận kề với cái chết, cùng với sự hồi sinh thần kì của cô", 4, "<p>Nhân vật văn học chính là con người được miêu tả, khắc hoạ, thể hiện trong tác phẩm của mình bằng các phương tiện văn học và trong “Chiếc lá cuối cùng”, nhân vật Johnsy chính là phương tiện để nhà văn O. Henry khái quát quan niệm nghệ thuật về con người. Trong cốt truyện bề nổi, Johnsy là nhân vật chính, nhân vật trung tâm của tác phẩm. Johnsy là cô gái trẻ, có tài năng và yêu thích hội hoạ nhưng lại vô cùng tội nghiệp khi sức khoẻ vốn đã yếu ớt, lại không may đối diện với căn bệnh nặng viêm phổi, chịu đựng nhiều sự đau đớn, giày vò. Sự yếu đuối ấy của Johnsy có thể coi là thuộc tính thường thấy ở nữ giới thuộc phái yếu và cũng là phẩm chất của đa số tâm hồn nghệ sĩ, luôn mong manh và nhạy cảm trước sự biến thiên của lòng người, tạo vật. Bệnh tật và nghèo khó đã bào mòn hết tất thảy những khát vọng, nghị lực của cô gái trẻ, khiến cô hoàn toàn tuyệt vọng và nghĩ rằng chỉ có cái chết mới có thể giải thoát được tất cả. Cô không còn chút một nghị lực sống nào nên đã quyết định đếm những chiếc lá thường xuân đang rơi, nếu một ngày chiếc lá cuối cùng rơi mất thì cô cũng chết. Sự tuyệt vọng của Johnsy đã tới tận cùng nên cô mới tin vào một điều vô lí như vậy, nương tựa tinh thần của mình vào những chiếc lá. Cuộc đời của cô gái ấy chỉ thực sự thay đổi khi cô nhìn thấy chiếc lá cuối cùng, mặc cho mưa to gió lớn, vẫn hiên ngang đứng vững trên cành cây mà không hề gục ngã, rơi tàn. Lúc đó, Johnsy đã vực dậy được tinh thần và khao khát được tiếp tục sống, nhận ra bản thân đã có những suy nghĩ sai lầm, tồi tệ “Có một cái gì đấy đã làm cho chiếc lá cuối cùng vẫn còn đó để cho em thấy rằng mình đã tệ như thế nào. Muốn chết là một tội”. Trong con người Johnsy đã có nhựa sống mới, cô bắt đầu hi vọng và có cho mình những ước mơ “Chị Xiu thân yêu ơi, một ngày nào đó em hi vọng sẽ được vẽ vịnh Na-plơ”.<\/p>\n<p>Quả thật, O. Henry đã xây dựng được chân dung nhân vật Johnsy rất thành công và điển hình, khi cô chính là đại diện cho hoàn cảnh khó khăn, khốn khổ và thiếu thốn của những người họa sĩ nghèo lúc bấy giờ. Với nhân vật Johnsy, ban đầu hẳn nhiều độc giả cũng vừa thương vừa bực tức với cái suy nghĩ ngu xuẩn, ngốc nghếch của cô gái trẻ như cụ Behrman, nhưng sau đó người ta lại càng khâm phục hơn cái nghị lực sống còn, tấm lòng yêu cuộc sống, yêu nghệ thuật được hồi sinh của cô gái trẻ. Câu chuyện của Johnsy đã trở thành bài học quý báu cho mỗi người, khuyên chúng ta hãy cố gắng vượt lên nghịch cảnh bằng tinh thần lạc quan, bằng nghị lực phi thường. Có như vậy, ta mới có thể tìm ra hướng giải quyết đúng đắn, thoát khỏi nghịch cảnh để vươn tới cuộc sống ngày mai tươi sáng, tốt đẹp hơn.<\/p>\n"], ["8.2. Nhân vật Sue - minh chứng cho một tình bạn cao đẹp", 4, "<p>Trong truyện “Chiếc lá cuối cùng”, Sue và Johnsy là đôi bạn thân thiết và đối với Sue, Johnsy như là người thân trong gia đình của mình, cô thương yêu và lo lắng như đối với em gái. Sue và Johnsy gặp nhau trong sự tình cờ, ngẫu nhiên nhưng chính cái ngẫu nhiên ấy lại khiến họ thêm xích lại gần nhau bởi ở họ có rất nhiều điểm chung: đều nhạy cảm, yếu đuối và có niềm đam mê mãnh liệt với hội hoạ. Sue rất thương Johnsy nhưng cũng chỉ đành bất lực trước suy nghĩ điên rồ của bạn mà chẳng thể nào khuyên can được bạn. Khi Johnsy yêu cầu cô kéo rèm cửa lên để xem chiếc lá cuối cùng đã rụng chưa, cô “làm theo một cách chán nản”. Rõ ràng trong cô vẫn bị ám ảnh bởi tâm trạng bi quan của Johnsy, cô không tin vào ý nghĩ ngớ ngẩn của bạn mình về chiếc lá nhưng cô rất lo lắng rằng, nếu mọi việc cứ tiếp tục tái diễn như thế này thì một ngày nào đó, Johnsy sẽ thực sự rời xa cô.<\/p>\n<p>Trước mặt Johnsy, Sue cố gắng tỏ ra vô cùng mạnh mẽ để vực dậy Johnsy đứng lên, để loại bỏ tất cả những suy nghĩ ngớ ngẩn, điên rồ nhưng sâu thẳm trong tâm hồn cô gái ấy vẫn là một trái tim yếu đuối, một trái tim đa sầu đa cảm. Cô lo âu, thấp thỏm không biết sẽ phải sống ra sao nếu chỉ có một mình, nếu một ngày nào đó Johnsy không còn bên cạnh cô nữa “Em thân, thân yêu! Em hãy nghĩ đến chị, nếu em không còn nghĩ đến mình nữa. Chị sẽ làm gì đây?”. Qua đây, chúng ta nhận thấy rõ được tình cảm chân thành, yêu thương của Sue dành cho Johnsy, cũng như phẩm chất cao đẹp, nhân hậu của cô gái trẻ. Trong một xã hội còn đầy rẫy những vất vả, khó khăn, nhưng ở những người nghệ sĩ nghèo ấy vẫn toát lên một tấm lòng nhân ái, một bức tranh rạng rỡ, ấm áp tình người. Mặc dù nhân vật Sue không phải là nhân vật chính ở trong tác phẩm nhưng qua nhân vật này, O. Henry đã đem đến cho người đọc một cái nhìn đa diện, nhiều chiều hơn về một bức tranh xã hội có những gam màu sáng của tình người cao đẹp, dù trong nghịch cảnh nhưng vẫn sáng ngời lên thứ tình cảm mạnh mẽ, thiêng liêng.<\/p>\n"], ["8.3. Nhân vật cụ Behrmnan", 4, "<p>Cụ Behrman trong tác phẩm được giới thiệu là một hoạ sĩ nghèo, cụ ao ước có thể vẽ nên một kiệt tác nghệ thuật nhưng vẫn chưa thực hiện được. Khi nghe Sue kể lại ý định kết thúc cuộc sống dựa vào sự rụng tàn của những chiếc lá trên cây trường xuân, cụ Behrman đã quyết định ngay trong đêm đông giá rét, lạnh buốt ấy, trực tiếp vẽ một chiếc lá khác thay thế chiếc lá cuối cùng đã rụng, cứu vớt tâm hồn đang dần tàn lụi của cô gái trẻ. Đây chính là kiệt tác để đời của cụ, khi hình ảnh chiếc lá giống y như thật, đến cả Sue và Johnsy là hoạ sĩ nhưng cũng không nhận ra “cuống lá còn giữ màu xanh sẫm, nhưng với rìa lá hình răng cưa đã nhuốm màu vàng úa”, ta thấy được từng đường nét, màu sắc của chiếc lá đều vô cùng rõ nét, chân thực và sống động. Cụ Behrman cũng tạo nên kiệt tác nghệ thuật ấy trong một hoàn cảnh hết sức đặc biệt. Đó là một đêm mưa bão tuyết, ngoài trời gió lạnh buốt, lạnh đến thấu xương và một thân một mình cụ đã bắc thang để vẽ bức tranh trên tường gạch. Chỉ có cụ Behrman mới có thể làm được một điều phi thường đến như thế, đó cũng chính là sự hi sinh tất cả vì nghệ thuật, vì kiệt tác của cuộc đời mình mà bất chấp sức khoẻ và hoàn cảnh không gian, thời gian vô cùng khó khăn, khắc nghiệt.<\/p>\n<p>Nhân vật cụ Behrman trong tác phẩm chính là biểu tượng cho lòng nhân ái cao cả, cho vẻ đẹp của những người làm nghệ thuật chân chính “nghệ thuật vị nhân sinh”. Hình ảnh cụ Behrman dường như thấp thoáng bóng hình của tác giả, khi O. Henry đã gửi vào đó tấm lòng đồng cảm, xót thương cũng như trân trọng cho những người nghệ sĩ, những hoạ sĩ đang đứng bên bờ vực thẳm. Nhà văn đã để cho nhân vật Johnsy tiếp tục được sống, thức tỉnh khát vọng sống chính nhờ vào tấm lòng cao cả của cụ Behrman, nhờ vào tình yêu nghệ thuật mãnh liệt đến mức có thể đánh đổi và hi sinh cả mạng sống của cụ. Cái chết của cụ Behrman không phải là sự giải thoát của những bế tắc để sau đó tiếp tục tăm tối, u ám, mà đó cái chết bất tử, vĩnh hằng theo quy luật tuần hoàn của vũ trụ, nó làm cho thời gian trong tác phẩm được trở lại đúng nghĩa với quy luật nguyên bản của nó. Đó không phải là sự ra đi vô nghĩa, là nỗi mất mát oan uổng mà chính là minh chứng bất diệt nhất cho một kiệt tác để đời, vĩnh hằng theo năm tháng, cho một tấm lòng nhân ái luôn sáng ngời, rạng tỏ.<\/p>\n"], ["9. Hình tượng chiếc lá", 3, "<p>Đã từ lâu, hình tượng chiếc lá trở một biểu tượng sáng tạo nghệ thuật độc đáo trong văn chương, đi vào cả thi ca nhạc hoạ, trở thành nguồn cảm hứng bất tận cho người nghệ sĩ. Hình ảnh chiếc lá thường được dùng để biểu thị thời gian, ẩn dụ cho sự mất còn của con người, hoặc đôi khi là tín hiệu của sự chuyển mùa, sự đổi thay của trời đất. Hình ảnh chiếc lá thường gieo vào lòng người đọc nhiều cảm xúc, nỗi niềm khác nhau, có khi là vui vẻ, hạnh phúc và tràn đầy nhựa sống trước cảnh sắc thiên nhiên tươi đẹp; có khi là bâng khuâng, xao xuyến và nhớ nhung về cảnh vật, con người đã qua.<\/p>\n<p>Trong tác phẩm “Chiếc lá cuối cùng”, hình ảnh “chiếc lá” chính là biểu tượng của sự sống, là nơi mà sự sống được nảy mầm, sinh sôi và phát triển. Kiệt tác xuất sắc của cụ Behrman đã cứu sống chiếc lá trường xuân, cứu sống cô gái trẻ đang bên bờ tuyệt vọng nhưng đổi lại là cái chết của ông lão. Tạo hoá, vạn vật đều vận động theo quy luật sinh tồn của tự nhiên nhưng nghệ thuật, bằng sức mạnh cổ vũ và chiến thắng “cái chết” của nó mà đã vượt qua được cái tất yếu đầy nghiệt ngã đó. Nhờ có nghệ thuật mà cây trường xuân vốn đã chết, đã rụng hết lá nay được tái sinh, trường tồn theo năm tháng. Nhờ có nghệ thuật mà con người cũng được phục sinh, vượt qua khỏi bóng tối của bệnh tật, của cái chết mà hướng đến tương lai tươi đẹp. Hình ảnh chiếc lá chính là kết quả của quá trình sáng tạo nghệ thuật, là biểu hiện rõ nét nhất cho thiên chức và sức mạnh của nghệ thuật. “Nơi nào nghệ thuật xuất hiện thì ở đó có sự sống phục sinh. Năm tháng vẫn sẽ trôi qua và chiếc lá cuối cùng kia sẽ không bao giờ là chiếc lá cuối cùng, nó sẽ mãi mãi là chiếc lá đầu tiên, chiếc lá xanh tươi, gieo mầm cho sự sống”. Chiếc lá sẽ luôn còn đó, bất diệt cùng với thời gian và trở thành một kiệt tác bất hủ, minh chứng cho sự hi sinh cao cả vì nghệ thuật của người nghệ sĩ, cho khả năng cổ vũ con người sống cuộc đời tốt đẹp hơn, tươi sáng hơn.<\/p>\n"], ["IV- Tình huống truyện:", 2, "<p>- Khái niệm: Tình huống truyện là sự kiện, hòn cảnh, tình thế đặc biệt của câu chuyện. Đó là tình huống chưa đựng những điều “bất thường”, éo le, nghịch lý trong cuộc sống thường ngày của nhân vật.<\/p>\n<p>🡺 Từ đó tạo nên 1 hoàn cảnh, tình thế cho nhân vật, bắt buộc nhân vật phải có sự lựa chọn, thể hiện rõ tư tưởng, tâm lý, hành động của nhân vật. Tuy nhiên 1 tác phẩm có thể có rất nhiều sự kiện nhưng không phải cái nào cũng là tình huống truyện mà chỉ có những sự kiện nổi bật nhất thể hiện rõ những tình huống éo le, hấp dẫn, lột tả tâm lý, hành động của nhân vật.<\/p>\n<p>- Thường được chia làm 3 loại phổ biến:<\/p>\n<p>+ Tình huống tâm lý: Tình huống diễn ra nhằm sáng tỏ đặc điểm tâm lý nhân vật<\/p>\n<p>VD: 1 tác phẩm xây dựng cảm xúc nhân vật từ đau khổ, tuyệt vọng 🡺 vui sướng. Đó là tình huống truyện đi từ bi kịch, éo le cho tới “tháo nút” làm sáng tỏ sự việc.<\/p>\n<p>+ Tình huống hành động: Giúp bộc lộ diễn biến hành động qua đó làm rõ nét tính cách nhân vật, thường sẽ tạo dựng hoàn cảnh thử thách khi nhân vật thực hiện hành động đó🡺người đọc sẽ hiểu thêm về tình cảm, phẩm chất nhân vật.<\/p>\n<p>+ Tình huống nhận thức: Không nhằm miêu tả hành động hay tâm lý. Thoongbqua tình huống này giúp nhân vật hiểu ra quy luật cuộc sống. Sự nhận thức “vỡ lẽ” của nhân vật chính như điểm “gỡ nút” câu chuyện.<\/p>\n<p>- 2 tình huống lết truyện khác nhau, đảo ngược tình huống mà trọn vẹn: Cụ Bermen đang sống khỏe mạnh và đã ra đi vì sự hy sinh và quan tâm cứu sống Johsy. Johnsy sắp chết dại dần khỏe mạnh nhờ chiếc lá của cụ Bermen.<\/p>\n<p>- Nghệ thuật đảo ngược là yếu tố tạo nên sức hấp dẫn, lôi cuối gây hứng thú, tạo yếu tố bất ngờ 🡺 Tạo nên sự đặc sắc cho câu chuyện.<\/p>\n"], ["I. Thời đại:", 1, "<p>- Đặc điểm văn học thời Phục hưng: tư tưởng chủ đạo là chủ nghĩa nhân văn (humanisme), đưa con người vào vị trí trung tâm, chú ý đến cuộc sống hiện tại, chủ trương cho con người được quyền hưởng mọi lạc thú ở đời.<\/p>\n<p>+ nội dung: đề cao quyền tự do của con người, chống lại chủ nghĩa khổ hạnh; ca ngợi hiện tại; đả kích, phê phán giáo hoàng và giai cấp phong kiến<\/p>\n<p>VD: “Hamlet” - Shakespeare: “Thế giới là một nhà tù mà Đan Mạch là nhà tù ghê tởm nhất” vì ở đó, tài trí, tình yêu, đạo đức đều bị chà đạp, còn giai cấp thống trị là bọn đê hèn, xảo quyệt, tàn bạo, ...<\/p>\n<p>+ về nghệ thuật: ra đời nhiều thể loại mới (xuất hiện dòng tiểu thuyết trào phúng của Boccaccio, Rabole; dòng truyện ngắn hiện thực của Rabole, ...); bắt đầu xuất hiện bút pháp hiện thực; ngôn ngữ dân tộc được đề cao.<\/p>\n<p>- Văn học Tây Ban Nha trong thời kì Phục hưng:<\/p>\n<p>Khi đất nước rơi vào khủng hoảng, suy thoái thì đây lại là lúc văn học Tây Ban Nha có được thời kì hoàng kim của mình. Những tình hình trên đều được phản ánh qua những tác phẩm văn học. Thời kì hoàng kim đó được bắt đầu từ nửa sau thế kỉ XVI vươn dài tới giữa thế kỉ sau.<\/p>\n<blockquote>\n<p>+ Văn học Phục hưng Tây Ban Nha có thể chia làm hai giai đoạn:<\/p>\n<\/blockquote>\n<p>● Giai đoạn sơ kỳ Phục hưng: Những tác phẩm của Ý đã làm cho các nghệ sĩ Tây Ban Nha mê mệt và say đắm gây nên phong trào học tập và bắt chước mẫu mực Ý. Lúc đầu, thơ ca của Tây Ban Nha chịu ảnh hương thơ Ý, thành tựu nổi bật phải kể đến như “Romencero” được Victor Hugo gọi là “Bản anh hùng ca Illiade của dân tộc Tây Ban Nha”. Tiểu thuyết hiệp sĩ cũng phát triển trong giai đoạn đầu.<\/p>\n<p>● Giai đoạn Phục hưng nở rộ:<\/p>\n<p>o Văn học phát triển toàn diện nhưng nổi bật là thơ ca, tiểu thuyết và kịch. Thơ phản ánh toàn diện tâm tư tình cảm đa dạng của giới trí thức Tây Ban Nha về đất nước lịch sử, dân tộc, về thời đại mới đang đến, và tình yêu, ...<\/p>\n<p>o Về tiểu thuyết: tiểu thuyết Tây Ban Nha phát triển rất mạnh. Trong đó, cuốn tiểu thuyết “Don Quixote” của Cervantes có thể nói là tác phẩm đạt được đỉnh cao và hiếm có nhất của không những Tây Ban Nha mà còn của Tây Âu lúc bấy giờ.<\/p>\n"], ["II. Tác giả:", 2, "<p>− Miguel de Cervantes (1547-1616) là một tiểu thuyết gia bậc thầy của nhân loại. Ông không chỉ nổi tiếng với tư cách là nhà văn mang tư tưởng tiến bộ hướng về quyền bình đẳng, tự do mà còn được xem là người khai sinh ra tiểu thuyết hiện đại, đặc biệt là loại tiểu thuyết phiêu lưu. Cervantes còn khai sinh ra kiểu nhân vật lưỡng thiện, vừa điên rồ vừa sáng suốt, dùng tiếng cười và thủ pháp lạ hoá điêu luyện trong việc bóc trần những thói hư tật xấu của con người. Ông được tôn vinh là “ông hoàng của sự dí dỏm”.<\/p>\n<p>− Cervantes sinh ra tại một gia đình quý tộc sa sút ở Tây Ban Nha. Thuở ấu thơ, Cervantes chịu nhiều khổ cực, cùng gia đình di chuyển qua nhiều thành phố để kiếm sống. Vì thế mà việc học của ông cũng phải chịu nhiều phen gián đoạn. Theo các tài liệu đáng tin cậy, ta biết Cervantes tốt nghiệp tại Học viện Nhân văn.<\/p>\n<p>− Năm 1571, hạm đội Thổ Nhĩ Kỳ xâm nhập vào khu vực Địa Trung Hải, Tây Ban Nha và Cộng hòa Venezia tổ chức hạm đội liên hợp chống lại. Hạm đội Liên minh thần thánh cuối cùng cũng đánh tan quân Thổ trong trận Lepanto, Cervantes tham gia trận này, được mô tả như một \"hiệp sĩ gầy gò và khờ dại\".<\/p>\n<p>− Sau khi tham gia nhiều trận đánh lớn trên biển Địa Trung Hải với tư cách là lính Tây Ban Nha, ông bị cướp biển Bắc Phi bắt giữ khi trên đường trở về Tây Ban Nha. Chúng đòi tiền chuộc quá lớn, gia đình ông không kịp chuẩn bị và triều đình thì không hề quan tâm.<\/p>\n<p>− Trong thời gian bị cầm tù Algiers (1575 – 1580), ông luôn luôn có ý chí đấu tranh, khuyến khích bạn bè giữ vững tinh thần tìm cơ hội thoát thân, ông tổ chức 4, 5 lần vượt ngục nhưng đều thất bại, và mỗi lần ông đều can đảm nhận phần trách nhiệm của người chủ mưu. Tinh thần dũng cảm và lòng vị tha của Cervantes không những gây tín nhiệm cho anh em cùng chung số phận mà còn làm cho chính vua Algiers phải kính nể, không giết. Quãng đời này của Cervantes được nhắc lại trong câu chuyện Người tù – trong cuốn tiểu thuyết Don Quixote – Nhà quý tộc tài ba xứ Mancha (phần 1 chương 39 – 41). Lúc này nhờ sự giúp đỡ<\/p>\n"], ["1. Xuất xứ", 3, "<p>− \"Don Quixote, nhà hiệp sĩ quý tộc tài ba xứ Mancha\" tiểu thuyết 2 tập, tập 1 xuất bản năm 1605 và tập 2 xuất bản năm 1615. Don Quixote, nhan đề đầy đủ là Don Quixote – Nhà quý tộc tài ba xứ Mancha, bao gồm hai phần: Phần một 52 chương, phần hai 74 chương, với gần 700 nhân vật, xoay quanh chuyến đi làm hiệp sĩ của Don Quixote.<\/p>\n<p>− Don Quixote được coi là một trong số ít tác phẩm có nhiều người đọc nhất trong văn học phương Tây. Một cuộc điều tra năm 2002 do Viện Nobel Na Uy tiến hành đã cho thấy đây là tiểu thuyết hay nhất trong mọi thời đại.<\/p>\n"], ["2. Tóm tắt", 3, "<p>Tiểu thuyết kể về nhà quý tộc nghèo Alonso Quixano chừng 50 tuổi, gầy gò và cao lênh khênh. Suốt ngày say mê đọc tiểu thuyết kiếm hiệp đến nỗi đầu óc mụ mẫm, lú lẫn. Tự trang bị cho bản thân những vũ khí đã gỉ sét của tổ tiên còn sót lại để lên đường hành hiệp. Tự phong cho mình là hiệp sĩ Don Quixote xứ Mancha, phong con ngựa gầy còm ốm yếu của mình là kị mã Rocinante. Trong chuyến đi lần thứ nhất của mình Don Quixote nai nịt chỉnh tề, ngồi ngất ngưởng trên lưng con ngựa Rocinante của mình, bắt đầu cuộc đời hiệp sĩ giang hồ. Tới một quán trọ bên đường, gã tưởng tượng đó là một tòa lâu đài, chủ quán là lãnh chúa và trịnh trọng xin ông làm lễ ấn phong cho gã. Sung sướng vì đã trở thành hiệp sĩ, gã háo hức rong ruổi khắp nẻo đường để diệt trừ cái ác, làm sáng danh hiệp sĩ xứ Mancha. Trên đường đi Don quixote bênh vực cậu bé bị chủ đánh rồi ra tay với bọn lái buôn vì không thừa nhận nàng Dulcinea là người đẹp nhất trần gian. Don Quixote bị trận đòn nhừ tử, người làng phát hiện ra và đưa hắn ta về nhà. Không lâu sau Don Quixote lại lên đường đi, theo sau là bác giám mã Sancho Panza. Họ qua cánh đồng Montiel, thấy những chiếc cối xay gió, tưởng là bọn khổng lồ độc ác. Don Quixote đã đánh nhau với những chiếc cối xay gió. Tiếp đó Don Quixote gặp các tu sĩ và đoàn kỵ binh, ông cho rằng đấy là công chúa bị bắt cóc đã xông vào giải thoát sau đó Don Quixote bị đánh một trận nhừ tử. Hai thầy trò đến một quán trọ mà Don Quixote cho là lâu đài, do nhầm lẫn với cô hầu gái mà thầy trò bị cuốn vào cuộc đánh nhau loạn xạ. Cha xứ và người thợ cạo láng giếng phải lập mưu đưa Don Quixote về nhà. Lần ra đi thứ ba hai thầy trò bắt đầu bằng việc đến thăm Dulcinea – cô thôn nữ xấu xí được cho là bị phù phép. Trên đường đi, hai thầy trò gặp nhà quý tộc Don Diego với triết lí sống an nhàn, phản đối cách sống ấy Don Quixote bắt mở cửa để đánh nhau với sư tử. Sau khi thực hiện vài chiến công nữa, họ gặp vợ chồng Công tước và bị biến thành trò cười hai thầy trò bỏ đi. Cậu tú Sanson Carrasco muốn cứu Don Quixote đã giả trang thành hiệp sĩ thách đấu với điều kiện người thua sẽ không được làm hiệp sĩ nữa. Don Quixote bị đánh ngã, gã đau khổ vô cùng và trở nên ốm yếu. Trên giường bệnh gã mới nhận ra những việc làm điên rồ của mình. Don Quixote viết chúc thư chia tài sản rồi qua đời.<\/p>\n"], ["3. Nội dung và ý nghĩa", 3, "<p>Qua hình tượng Don Quixote, nhà văn Tây Ban Nha Miguel de Cervantes Saavedra (1547-1616) phản ánh được tính đa diện của con người, bên cạnh tính cách gàn dở là sự tế nhị, thương yêu đồng loại, yêu quý tự do và ghét thói xa hoa ăn bám của bọn quý tộc đương thời và biết trọng đạo lý.<\/p>\n<p>Tác phẩm cũng không hoàn toàn được sáng tác với ý nghĩa hài hước, qua tác phẩm, Cervantes chế giễu những tàn dư của lý tưởng hiệp sĩ phiêu lưu thời phong kiến, đả kích một thị hiếu tầm thường đang phổ biến trong công chúng, hiển thị khát khao hướng đến một xã hội hậu phong kiến công bằng và nhân đạo hơn.<\/p>\n"], ["1. Thời đại Phục Hưng", 3, "<p>Trong hai thế kỉ XV và XVI, Tây Âu được gọi là thời đại Phục Hưng trong đó con người <em>“muốn làm sống lại, muốn tái sinh nền văn hóa cổ đại”.<\/em><\/p>\n<p><em><strong>- Hướng về cổ đại<\/strong><\/em>, để học tập, làm sống lại những truyền thống văn hóa tốt đẹp cổ đại Hi Lạp, La Mã đã bị trung cổ phong kiến và Nhà thờ cắt đứt<\/p>\n<p><em><strong>- Phát huy<\/strong><\/em> hơn nữa những truyền thống đó cho phù hợp với yêu cầu trước mắt. Bằng cách lên tiếng phê phán, tố cáo trung cổ phong kiến và nhà thờ.<\/p>\n<p>- Nói lên nhu cầu và khát vọng của con người, vạch rõ, biểu dương những khả năng và triển vọng của con người mới, xã hội mới. Con người mới đó là con người xây dựng xã hội mới, con người mà thời đại Phục hưng đang cần đến - <em>“Thời đại cần đến những con người khổng lồ và sản sinh ra những con người khổng lồ, khổng lồ về tư tưởng, về nhiệt tình và tính cách, khổng lồ về tài năng mọi mặt và về sự hiểu biết sâu rộng”<\/em> <strong>(Angghen)<\/strong><\/p>\n"], ["2. Nền văn hóa văn nghệ Phục Hưng", 3, "<p>- Xuất hiện nhiều tài năng khổng lồ, trong đó thế kỷ XV đạt đến trình độ chín muồi của tư tưởng nghệ thuật. Thế kỷ này sản sinh ra ba ngôi sao tiêu biểu nhất trên văn đàn: Rabelais, Cervantes, Shakespeare. Họ đều xây dựng lên nền nghệ thuật mới nhằm giải phóng con người thoát khỏi những ràng buộc của tôn giáo và hệ tư tưởng phong kiến. Nội dung của nó là tư tưởng nhân đạo chủ nghĩa, tinh thần tự do dân chủ, hình thức của nó là ngôn ngữ dân tộc đã đạt đến trình độ nghệ thuật mẫu mực.<\/p>\n<p><strong>- Chủ nghĩa nhân văn:<\/strong> (humanus): “<em>là toàn bộ những quan niệm đạo đức chính trị bắt nguồn không phải từ cái gì siêu nhiên, kỳ ảo, từ những nguyên lý ngoài đời sống nhân loại mà từ con người tồn tại thực tế trên mặt đất với những nhu cầu, những khả năng trần thế và hiện thực của nó, và những nhu cầu và những khả năng đó phải được phát triển đầy đủ, phải được thỏa mãn<\/em>” <em><strong>(Chủ nghĩa nhân văn và chủ nghĩa xã hội - Vôn Ghin)<\/strong><\/em><\/p>\n<p><strong>- Nguyên lý cơ bản của chủ nghĩa nhân văn:<\/strong> giải phóng con người khỏi xiềng xích phong kiến gông kìm của nhà thờ để họ tự do phát triển những khát vọng khổng lồ về vật chất và tinh thần của họ.<\/p>\n"], ["3. Nước Anh thời Phục Hưng", 3, "<p>- Thế kỉ XVI nước Anh tiến lên Chủ nghĩa tư bản, quan hệ sản xuất tư bản chủ nghĩa từng bước hình thành và phát triển mạnh. Chính vì thế mà bọn địa chủ mới ở Anh với sự hỗ trợ của chính quyền nhà vua bằng các đạo luật cho phép rào đất cướp ruộng đã xua đuổi hàng vạn nông dân ra khỏi làng mạc, nhà cửa, ruộng đất của họ biến những nơi đó thành đồng cỏ nuôi cừu. Nông dân vừa bị cướp ruộng đất vừa bị biến thành nhân công rẻ mạt. Do đó có nhiều cuộc khởi nghĩa nông dân đã nổ ra. Nhưng các cuộc khởi nghĩa đều bị dìm trong máu lửa. Thợ thủ công cũng khốn khổ không kém. Họ bị bòn rút đến kiệt sức trong các hầm mỏ, xí nghiệp, công trường. Nên các cuộc khởi nghĩa nông dân thường được hỗ trợ bởi các thợ thủ công.<\/p>\n<p>- Tư sản cùng với lớp quý tộc mới ủng hộ chính quyền nhà vua chống bọn lãnh chúa phong kiến nhằm thống nhất quốc gia, thống nhất thị trường trong nước và bành trướng ra nước ngoài.<\/p>\n<p>- Thời nữ hoàng Elizabeth nước Anh trở thành cường quốc số một ở Châu Âu và đang ra sức bành trướng thế lực. Không chỉ là trung tâm chính trị, kinh tế, văn hóa mà còn là trung tâm văn minh của Châu Âu. Triết học, khoa học kĩ thuật, văn học và nghệ thuật nước Anh phát triển mạnh vượt lên chiếm vị trí tiên tiến ở Châu Âu.<\/p>\n<p>- Tuy nhiên đằng sau bộ mặt phồn vinh đó là một xã hội đang trải qua những biến động dữ dội của thời kì quá độ từ chế độ phong kiến đến chủ nghĩa tư bản, là một xã hội chứa những mâu thuẫn giai cấp gay gắt.<\/p>\n<p>- Văn hóa Phục hưng ra đời trong bối cảnh đó nên có muộn hơn so với các nước Italia, Tây Ban Nha, Pháp nhưng một khi đã bùng lên là nó bùng lên mạnh mẽ và phát triển nhanh chóng.<\/p>\n<p>- Nó mang những tính chất như mọi phong trào Phục Hưng ở Châu Âu: tinh thần chống chủ nghĩa ngu dân, chủ nghĩa giáo điều kinh viện Trung Cổ nhằm giải phóng trí tuệ của con người, tinh thần khẳng định cuộc đời trần thế, sự đòi hỏi quyền lực tự do cá nhân con người, niềm phấn khởi trước những chân trời rộng mở nhờ những cuộc phát kiến thiên văn và địa lí mang lại, niềm say mê trước những vẻ đẹp của các tác phẩm văn nghệ cổ đại Hi Lạp vừa được phát hiện… Bên cạnh đó văn nghệ Phục Hưng Anh còn có những biểu hiện riêng biệt khác.<\/p>\n<p>-&gt; Đó là tính mâu thuẫn, tính đối kháng gay gắt của cuộc đấu tranh giai cấp ở Anh.<\/p>\n<p>-&gt; <em><strong>Tóm lại ở nước Anh thời bấy giờ cả hai mặt đen tối và tươi sáng đối lập với nhau rõ rệt.<\/strong><\/em><\/p>\n<p>- Tình hình đó chi phối chi sự phát triển văn học nghệ thuật nước Anh. Để phản ánh những mặt đối lập, những mâu thuẫn gay gắt, kịch là loại hình nghệ thuật có khả năng hơn cả. Nền kịch Anh nhờ tiếp thu những truyền thống tốt đẹp của kịch cổ đại Hi - La cũng như kịch Italia hiện đại đã tạo nên được một bước chuyển mới. Kịch cổ đại nêu cho kịch Anh thấy kịch tính gay gắt, những dục vọng ghê gớm, cuộc đấu tranh của con người chống lại định mệnh khắc nghiệt…<\/p>\n<p>- Trước khi Shakespeare bước vào kịch trường thì kịch nước Anh có hai xu hướng chính:<\/p>\n<p>+ Jôn Lyly và Roboc Grin chuyên chú trọng mô tả những cái êm dịu, nhẹ nhàng, vui vẻ họ thường đưa lên sân khấu chuyện tình ban đầu éo le nhưng kết thúc thành công.<\/p>\n<p>+ Khuynh hướng của Thomox Kit và Crixtop Maclovo thì ngược lại. Họ đưa đến cho kịch trường Anh hai chủ đề mới mẻ: hận thù và khát vọng.<\/p>\n<p>- Shakespeare đã tiếp thu cả hai xu hướng nói trên, vận dụng và phát triển hơn nữa thế mạnh của mỗi xu hướng đó kết hợp cả hai lại tạo ra một phong cách nghệ thuật kịch đặc sắc làm rạng rỡ cho nền kịch Anh.<\/p>\n"], ["II - Tác giả", 2, "<p><em><strong>Vị trí:<\/strong><\/em> Là kịch gia số một của nhân loại với tài năng độc nhất vô nhị. Chỉ mình ông thôi cũng đủ thâu tóm hết cả nền kịch nghệ thế giới.<\/p>\n"], ["1. Cuộc đời", 3, "<p>- Được sinh ra tại Stratford upon Avon - một thị trấn nằm ở trung tâm nước Anh với ngày sinh trùng với ngày lễ Thánh George - vị thánh yêu quý của người Anh.<\/p>\n<p>- Cha ông vốn theo nghề nông sau ra thị trấn làm ăn phát đạt và được bầu làm thị trưởng.<\/p>\n<p>- Thuở nhỏ, theo học trường Grammar School và được tiếp xúc với các môn phổ thông, tiếng Hi Lạp, La tinh và một vài tác phẩm cổ đại của Hi Lạp, La Mã.<\/p>\n<p>- 14 tuổi, gia đình sa sút nên bỏ học đi làm tại lò mổ, dạy học. 18 tuổi kết hôn với Anne Hathaway hơn 8 tuổi. Ba năm sau có hai con gái và một con trai tuy nhiên con trai ông chết năm 11 tuổi. Cuộc sống càng túng quẫn, 23 tuổi ông ra kinh thành London với hai bàn tay trắng và niềm đam mê sân khấu. Ông tìm đến rạp The Theatre làm chân giữ ngựa, soát vé và thể hiện được tài năng của mình. William Shakespeare lúc này bắt đầu từ một chân nhắc vở cùng đóng những vai diễn phụ. Từ 1590 - 26 tuổi, ông bắt tay vào sự nghiệp sáng tác.<\/p>\n<p>- 23/04/1616 – 52 tuổi, William Shakespeare từ dã cõi đời và được an táng tại nhà thờ Holi Triniti ở quê nhà.<\/p>\n"], ["2. Sự nghiệp sáng tác", 3, "<p>- Từ năm 1590, ông bắt tay vào sự nghiệp sáng tác.<\/p>\n<p>- Sự nghiệp sáng tác của ông có thể chia ra làm ba giai đoạn:<\/p>\n<p>+ <strong>Trước năm 1600<\/strong> (<em><strong>màu xanh của mùa xuân<\/strong><\/em>), là thời kì mà tài năng của William Shakespeare bùng nổ như hoa mùa xuân. Cảm hứng chủ đạo vẫn là lạc quan, yêu đời, yêu người, yêu đất nước, tự hào về đất nước.<\/p>\n<p>+ <strong>Từ 1601 - 1608<\/strong> <em><strong>(những cơn giông tố của mùa hạ<\/strong><\/em>), cảm hứng chủ đạo trong các tác phẩm đã có sự thay đổi. Giờ đây, cảm hứng mà người ta thấy ở trong sáng tác của ông là phê phán những mặt đen tối, những cái xấu xa, lên án tội ác, cường quyền và bạo lực, nêu lên những khủng hoảng và bế tắc của xã hội và thời đại.<\/p>\n<p>+ <strong>Từ 1609 trở đi<\/strong> <em><strong>(vẻ u buồn của mùa thu),<\/strong><\/em> là giai đoạn mà các sáng tác có phần dịu xuống. Mâu thuẫn đã không còn gay gắt, quyết liệt, không gây ra đổ vỡ, tan nát và chết chóc như ở giai đoạn trước. Kết thúc đã có thể là cái kết có hậu, có sum họp, có đoàn viên.<\/p>\n<p>- Các sáng tác của ông bao gồm:<\/p>\n<p>+ Hài kịch: Ầm ĩ và chuyện không đâu, Câu chuyện mùa đông, Những người vợ vui vẻ của Windsor, ....<\/p>\n<p>+ Bi kịch: Hamlet, Romeo and Juliet, Othello, ...<\/p>\n<p>+ Kịch lịch sử: Vua John, Ricardo II, Enrique IV, ...<\/p>\n<p>- Với 20 năm cầm bút, William Shakespeare để lại gần 40 vở kịch, 2 trường ca và 154 bài thơ Xonne…<\/p>\n"], ["III - Tác phẩm", 2, "<blockquote>\n<p>Là vở kịch nổi tiếng đầu tiên của William Shakespeare.<\/p>\n<\/blockquote>\n"], ["1. Hoàn cảnh sáng tác", 3, "<p>Theo đa số các nhà nghiên cứu, vở kịch Romeo và Juliet được viết vào khoảng những năm 1594 - 1595.<\/p>\n<p>Thiên tình sử vĩ đại và đẫm lệ Romeo và Juliet là câu chuyện hoàn toàn có thật? Đúng là như vậy, vở bi kịch được WS sáng tác nhưng không phải do ông sáng tạo ra mà dựa trên một cốt truyện có sẵn kể về một mối tình oan trái có thật từng xảy ra ở Ý thời Trung Cổ<\/p>\n<p>- Từ hơn một thế kỷ trước, vào năm 1476, tác giả người Ý là Masuccio Salernitano đã kể trong cuốn sách nhan đề “Il Novellino” về một mối tình vụng trộm, những vụ giết người, việc đi đày biệt xứ, việc một nhà tu hành sẵn lòng giúp đỡ cho đám cưới của đôi trẻ thuộc hai gia đình thù nghịch.<\/p>\n<p>- Đến năm 1530, Luigi da Porta cũng kể lại câu chuyện tình kết thúc bằng việc đôi tình nhân tự sát này với địa điểm diễn ra câu chuyện là thành phố Verona.<\/p>\n<p>- Tới năm 1562, nhà thơ Anh là Arthur Brooke đã dùng đề tài này trong tập thơ dài <em>“The Tragical History of Romeus and Julius”<\/em> (Câu chuyện bi thảm của Romeus và Julius), nói về một một tình yêu vụng trộm, không vâng lời cha mẹ và bất tuân luật pháp. Ngôn ngữ trong tập thơ khô khan và thiếu hấp dẫn.<\/p>\n<p><strong>2. Bố cục:<\/strong> 5 hồi được viết bằng thơ xen lẫn văn xuôi<\/p>\n"], ["3. Tóm tắt", 3, "<p>Trong thành Verona của Italy, hai dòng họ Montague và Capulet vốn có mối hận thù lâu đời. Một ngày nọ ở thành Verona xảy ra cuộc xung đột giữa những gia nhân nhà Capulet và Montague từ đó dẫn tới cuộc ẩu đả. Rồi sau đó, Vương chủ đã tới dẹp yên và đưa ra cảnh cáo cho hai gia tộc. Trở về từ cuộc ẩu đả, gia đình và Benvolio đã tìm Romeo, Benvolio biết được rằng chàng đang đau khổ trước mối tình không được đáp lại với nàng Rosaline xinh đẹp. Vì muốn gặp Rosaline, Romeo cùng hai người bạn lẻn vào buổi dạ tiệc nhà Capulet. Bi kịch bắt đầu từ đây - khi chàng đến buổi tiệc và va phải ánh mắt nàng Juliet rồi hai người yêu nhau ngay từ cái nhìn đầu tiên.<\/p>\n<p>Đêm ấy, Romeo đã nhảy tường nhà Capulet và đã trò chuyện với nhau ở ban công. Ngày hôm sau họ cử hành hôn lễ bí mật dưới sự giúp đỡ của nhũ mẫu và tu sĩ Lawrence<\/p>\n<p>Tuy nhiên một sự cố khiến Romeo giết chết người họ hàng của Juliet là Tybalt đã khiến cho mâu thuẫn nặng nề hơn. Romeo bị trục xuất khỏi thành Verona, còn Juliet thì bị gia đình ép gả cho bá tước Paris. Nhờ tu sĩ Lawrence, nàng đã uống một liều thuốc ngủ để giả chết trong vòng 42 giờ, vì thế đám cưới giữa Juliet và Paris lại trở thành đám tang. Xác Juliet được đưa xuống hầm mộ của gia đình.<\/p>\n<p>Nghe tin nàng chết, Romeo đau đớn trốn về Verona. Khi ngắm nhìn dung nhan người yêu thương đã khuất, chàng uống thuốc độc tự tử theo người mình yêu. Romeo vừa gục xuống thì cũng là lúc thuốc của Juliet hết hiệu nghiệm. Nàng tỉnh dậy và nhìn thấy xác Romeo bên cạnh. Quá tuyệt vọng, nàng rút dao tự vẫn.<\/p>\n<p>Cái chết tang thương của đôi bạn trẻ đã thức tỉnh hai dòng họ. Họ đã xóa sạch mối thù truyền kiếp và bắt tay hữu nghị. Nhưng những gì còn lại vẫn là nỗi xót xa cho một cuộc tình đẹp tựa bài thơ<\/p>\n<p><strong>IV -<\/strong> <strong>Bi kịch của Shakespeare: <em>Romeo và Juliet, Hamlet<\/em><\/strong><\/p>\n"], ["1. Đặc trưng bi kịch", 3, "<p>- Bi kịch là một thể loại của kịch, đối lập với hài kịch<\/p>\n<p>- Nhân vật bao giờ cũng là con người lương thiện, dũng cảm, anh hùng, cao thượng, đấu tranh vì mục đích tốt đẹp, vì lí tưởng cao quý, nhưng điều kiện khách quan chưa cho phép thực hiện.<\/p>\n<p>- Nhân vật bi kịch, do chỗ dám vượt qua những giới hạn không thể vượt qua nên không thể thoát khỏi tội lỗi bi kịch.<\/p>\n<p>- Bi kịch phản ánh những xung đột gay gắt, quyết liệt, thường kết thúc bằng sự thảm bại hoặc cái chết của nhân vật. Xung đột là biểu hiện cao nhất sự phát triển mâu thuẫn giữa các lực lượng, các tính cách trong một vở kịch, tạo nên kịch tính cho một vở kịch. Cái kết thảm bại, hay cái chết của nhân vật luôn làm nổi bật sự chiến thắng của con người và ước vọng của con người đời đời bất tử. Con người trong bi kịch chết để phục sinh, để sống lại.<\/p>\n<p>- Bi kịch có khả năng mang đến sự <em>“thanh lọc tâm hồn”<\/em> cho con người. Chứng kiến hành động và kết cục của nhân vật bi kịch, khán giả vừa sợ hãi, kinh hoàng, vừa thương cảm, xót xa trước cái chết hoặc sự thảm hại, tâm hồn họ bỗng thấy thanh cao trong sáng.<\/p>\n<p>-&gt; Bi kịch là thể loại sử dụng triệt để sức mạnh của kịch nhằm phản ánh cái bi như một trạng thái nhân thế để mang một ý nghĩa xã hội lớn lao.<\/p>\n<p><em><strong>Với cơ sở lý thuyết trên về đặc trưng bi kịch, nhóm chúng tôi xin được triển khai phân tích cụ thể đặc trưng bi kịch trong bi kịch lớn nhất của tác phẩm Romeo và Juliet – Bi kịch tình yêu.<\/strong><\/em><\/p>\n"], ["2.1. Nguyên nhân dẫn đến bi kịch trong Romeo và Juliet", 4, "<p><em>2.1.1. Mối thù giữa hai dòng họ<\/em><\/p>\n<p>Ngay từ hồi I - Tự Ngôn, vở kịch đã mở ra bằng bản đồng ca nói về mối thù truyền kiếp giữa hai họ Montague và Capulet. Và trớ trêu thay khi những đứa con của họ lại bén tình bén duyên với nhau để rồi, chính sự thù hận đó đã trở thành nguyên nhân to lớn nhất dẫn đến bi kịch và cái chết đầy thảm thương cho một mối tình đẹp như thơ:<\/p>\n<p><em>“Ngày xưa, ở thành Verona xinh đẹp,<\/em><\/p>\n<p><em>Có hai nhà thuộc hai dòng thế phiệt trâm anh<\/em><\/p>\n<p><em>Mối thù xưa bỗng gây cảnh bất bình<\/em><\/p>\n<p><em>Máu lương thiện, tay người lành nhuộm đỏ.<\/em><\/p>\n<p><em>Số phận éo le, thâm thù hai họ<\/em><\/p>\n<p><em>Lại khéo xui sinh hạ đôi tình nhân,<\/em><\/p>\n<p><em>Mối tình ai thê thảm muôn phần<\/em><\/p>\n<p><em>Chôn cừu hận, chỉ còn đành một thác.<\/em><\/p>\n<p><em>Tình lứa đôi thảm thương tan nát<\/em><\/p>\n<p><em>Trên xác con cha mẹ mới quên thù.<\/em><\/p>\n<p><em>Chuyện thương tâm, trình diễn đôi giờ,<\/em><\/p>\n<p><em>Xin quý vị kiên tâm chiếu cố<\/em><\/p>\n<p><em>Sức mọn tài hèn, chúng tôi xin gắng trổ”.<\/em><\/p>\n<p>Cuộc chiến giữa Montague và Capulet: Có thể nói, hai dòng họ nhà Montague và Capulet giống như hai thái cực đối lập nhau. Họ thù ghét nhau đến mức chỉ cần gặp nhau là gây gổ và đánh giết nhau. Khi người hầu nhà Capulet gặp người hầu nhà Montague, họ đã lên kế hoạch và cố tình <em>“nhổ nước bọt”<\/em> để khiến cho đối phương tức giận, thậm chí còn thách thức <em>“Các anh có giỏi thì tuốt kiếm ra! Này Gregory, nhớ đánh miếng bổ thượng của mày nhé”<\/em>, và thế là một cuộc ẩu đả đã xảy ra. Hay trong buổi yến tiệc nhà Capulet, khi Tybalt nhận ra Romeo sau lớp mặt nạ hóa trang, hắn đã sai gia nhân đi lấy thanh kiếm để nhằm đâm Romeo. Giả sử, nếu như không có mối thù hận lâu đời ấy mà hai gia đình thuộc dòng thế phiệt trâm anh kia sống hoà thuận, vui vẻ với nhau trong thành Verona thì có lẽ một đám cưới đẹp như trong cổ tích giữa hai người con trai tài - gái sắc, xứng đôi vừa lứa ấy đã được diễn ra long trọng, được sự chúc phúc của tất cả một người. Vậy mà éo le thay, chính mối thù giữa hai dòng họ đã giống như bức rào cản lớn nhất khiến cho Romeo và Juliet trở thành những nhân vật bi kịch ngay từ khi còn nằm trong bụng mẹ. Và cũng chính từ sự thù hận của hai gia đình, giữa những người làm cha, làm mẹ ấy đã gây nên cái chết trong tình yêu đầy bi thương của chính những người con của họ.<\/p>\n<p>Danh tính Romeo và Juliet: Đối với đa số mọi người, đặc biệt là những người có xuất thân danh giá thì họ sẽ thường cảm thấy vinh dự, tự hào khi được mang tên dòng họ của mình, nhưng đối với hai nhân vật chính trong vở bi kịch “Romeo và Juliet thì lại khác. Sự thù hận giữa hai họ vốn đã gây nhiều đau thương rồi nhưng lại càng đau đớn hơn khi biết người mình vừa mới chớm nở tình yêu mang tên họ kẻ thù ấy. Trong cảnh ban công nổi tiếng, Juliet đã than thở và đặt ra hàng ngàn những câu hỏi: <em>“Ôi, Romeo, hỡi Romeo! Sao chàng lại mang tên họ đó nhỉ? “Thế nào là họ Montague nhỉ?”<\/em>. Thậm chí, nàng còn mong nếu có thể thì nàng và Romeo sẽ được khước từ thân phận của mình: <em>“Chàng ơi! Hãy mang tên họ nào khác đi!”, “.... chàng hãy thề là chàng yêu em đi, em sẽ không còn là con cháu nhà Capulet nữa”.<\/em><\/p>\n<p>Như vậy, ngay từ những trang đầu của vở bi kịch, William, Shakespeare đã đề cập đến mối thù hận lâu đời giữa hai dòng họ và phát hiện ra danh tính của Romeo và Juliet ngay từ khi tình yêu ấy vừa mới chớm nở để cho thấy được rằng đây chính là nguyên nhân, là trở ngại quan trọng trên con đường tình yêu của cặp đôi ấy.<\/p>\n<p><em>2.1.2. Sự tác động của các nhân vật xung quanh Romeo và Juliet<\/em><\/p>\n<p><em><strong>*<\/strong><\/em> <em><strong>Tu sĩ Lawrence<\/strong><\/em><\/p>\n<p>Trong vở kịch, Friar Lawrence xuất hiện với vai trò là một vị linh mục. Ông là người luôn được tất cả mọi người yêu quý, kính trọng và tin cậy. Đến cả một người không bao giờ tâm sự với ai, dù là với bạn thân hay cha mẹ như Romeo, nhưng chàng lại đặt niềm tin và giãi bày tâm sự với tu sĩ Lawrence về nỗi đau khổ từ khi yêu đơn phương Rosaline hay đến khi chàng lỡ say đắm con của kẻ thù là Juliet: <em>“Con xin nói ngay để khỏi phiền Cha gặng hỏi. Đêm qua con đi dự yến ở nhà kẻ thù. Ở bữa yến, thình lình một người làm con bị thương, và con cũng làm người ấy bị thương”<\/em>. Không chỉ giãi bày hết nỗi niềm riêng tư trong lòng mà Lawrence còn là người được Romeo xin lời khuyên, sự giúp đỡ: <em>“xin Cha hãy đồng ý làm lễ kết hôn cho chúng con ngay hôm nay”<\/em>. Dù là người biết rất rõ về mối thù hận giữa hai gia tộc, dù biết rằng hành động đó là vội vàng và sai lầm khi nó được diễn ra một bí mật, không có sự đồng ý của cha mẹ hai bên nhưng rồi cuối cùng tu sĩ lại nhận lời trước lời cầu xin của Romeo bởi lý do: <em>“có thể vì mối duyên lành này mà oán thì giữa hai họ đổi thành tình sâu nghĩa nặng chặng!”.<\/em> Sự đồng ý se duyên cho đôi trai gái mà Lawrence đã vô tình thắt một nút thật chặt để từ đây, hàng loạt những cái chết, những đau thương sẽ xảy ra bởi chính tình yêu này.<\/p>\n<p>Ở một màn kịch khác, khi Juliet bị cha mẹ bắt gả cho Bá tước Paris, nàng cũng tìm đến tu sĩ Lawrence để xin sự giúp đỡ từ Cha. Một lần nữa ông ủng hộ, chắp vá lại cho mối tình trong sáng nhưng đầy ngang trái này bằng việc lên một kế hoạch để Juliet giả chết, như vậy không những nàng sẽ không phải lấy người mà mình không yêu mà còn được hưởng cuộc sống hạnh phúc sau này cùng người mình yêu say đắm. Nhưng Lawrence đã không lường trước được tình huống thư của ông không được gửi đến kịp để báo cho Romeo về kế hoạch mà mình và Juliet bàn bạc. Và cuối cùng chính quyết định, hành động sai lầm đó của ông đã dẫn đến cái chết thật đầy đau thương của đôi bạn trẻ.<\/p>\n<p>Khi Juliet tỉnh dậy, tu sĩ đã nói với nàng về việc kế hoạch bị thất bại và giục cô bỏ chạy đi khi phát hiện ra tiếng động: <em>“tiểu thư ơi, hãy rời khỏi nơi đây, nơi đây là ổ chết chóc, ổ truyền bệnh, là nơi có những giấc ngủ trái lẽ tự nhiên”<\/em>, thậm chí bỏ chạy trước “<em>Thôi, ta chẳng dám ở lâu hơn nữa…”<\/em>. Nếu như ông vẫn ở lại đó thì có lẽ, ông đã có thể ngăn được con dao mà Juliet dùng để tử tử.<\/p>\n<p>Tu sĩ Lawrence là một người thiện lành, luôn cố gắng giúp đỡ mọi người và đặc biệt ở đây, ông đã giúp cho tình yêu của Romeo và Juliet. Nhưng mặt khác, cũng chính từ những hành động, quyết định ấy đã biến ông trở thành người thúc đẩy cho thảm kịch của Romeo và Juliet, gây ra những cái chết thương tâm.<\/p>\n<p><em><strong>* Cha mẹ Juliet<\/strong><\/em><\/p>\n<p>Ở thế kỉ XVI, địa vị xã hội của gia đình có tầm quan trọng lớn, ảnh hưởng đến hôn nhân. Sự giàu có của một người đàn ông là đặc điểm phân biệt giữa các nhóm xã hội và địa vị. Con gái được dạy phải phục tùng và chấp nhận sự lựa chọn của cha mẹ. Một cuộc hôn nhân giữa con gái và một người đàn ông giàu có sẽ nâng cao vị thế của gia đình con gái, vì vậy một người cha sẽ cố gắng gả con gái mình vào cho người có địa vị xã hội cao hơn. Tuy nhiên, đầu vở kịch, trong cuộc hội thoại với Bá tước Paris, Capulet lại có quan điểm thoáng, tiến bộ khi nói rằng <em>“Bá tước hãy cố gắng chinh phục trái tim của con ta đi, ta tuỳ thuộc vào ý nó. Nếu nó ứng thuận ai thì sự đồng ý của ta cũng chỉ nằm trong vòng lựa chọn của nó mà thôi”<\/em>. Ông luôn quan tâm tôn trọng quyền tự do, sự lựa chọn của con gái mình, điều rất khó thấy ở những bậc làm cha mẹ trong xã hội thế kỉ XVI. Ngược lại với Capulet, vợ của ông - Capulet phu nhân lại không mấy quan tâm, dạy dỗ con cái ngay từ khi còn nhỏ mà tất cả phó mặc cho nhũ mẫu - người chăm sóc Juliet, đến cả tuổi của cô nhũ mẫu còn là người nhớ hơn cả chính mẹ ruột: <em>“Tôi xin cuộc ngay mười bốn cái răng của tôi! - mặc dầu tôi chỉ còn bốn chiếc thôi, khổ thân tôi! - là cô ấy chưa đến mười bốn tuổi”.<\/em> Phu nhân không thân thiết với con gái của mình, nên khi nói đến chuyện riêng tư, trọng đại, bà vẫn cần nhũ mẫu ở cùng trong phòng bởi bà nhận ra được khoảng cách giữa mình và con gái: <em>“Vú hãy lui ra
